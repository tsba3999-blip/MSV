<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon4.png" type="image/png">
<meta name="theme-color" content="#F5F1EA">
<title>Выбор комнаты — МСВ</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="form.css">
<link rel="stylesheet" href="rooms.css">
</head>
<body>

<div class="form form--wide">

  <div class="form__head">
    <a class="form__back" href="residences.html" aria-label="Вернуться к выбору адреса">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    <span class="head__back-label form__back-label">Вернуться</span></a>
    <h1 class="msv-sub form__title-link">Резиденция Уют</h1>
  </div>

  <div class="filters">
    <div class="filters__row">
      <span class="msv-note filters__label">Выбор комнаты и места</span>
      <div class="chips" role="group" aria-label="Пол">
        <button class="chip" type="button" data-sex="м" aria-pressed="false">Муж.</button>
        <button class="chip" type="button" data-sex="ж" aria-pressed="false">Жен.</button>
      </div>
    </div>

    <div class="filters__row">
      <span class="msv-note filters__label">Наличие</span>
      <div class="chips" role="group" aria-label="Наличие мест">
        <button class="chip" type="button" data-free="1" aria-pressed="true">Только свободные места</button>
        <button class="chip" type="button" data-free="" aria-pressed="false">Показать все места</button>
      </div>
    </div>

    <div class="filters__row">
      <span class="msv-note filters__label">Количество мест в комнате</span>
      <div class="chips" role="group" aria-label="Количество мест">
        <button class="chip" type="button" data-size="8" aria-pressed="false">8</button>
        <button class="chip" type="button" data-size="6" aria-pressed="false">6</button>
        <button class="chip" type="button" data-size="4" aria-pressed="false">4</button>
        <button class="chip" type="button" data-size="2" aria-pressed="false">2</button>
        <button class="chip" type="button" data-size="1" aria-pressed="false">1</button>
        <button class="chip" type="button" data-size="" aria-pressed="true">Все</button>
      </div>
    </div>
  </div>

  <div id="list" aria-live="polite"></div>

</div>

<script src="api.js"></script>
<script src="residences.js"></script>
<script src="photos.js"></script>
<script src="demo-bookings.js"></script>
<script src="residents-uyut.js"></script>
<script src="residents-forma.js"></script>
<script>
/* Сначала спрашиваем занятость мест, потом строим страницу: иначе все места
   выглядят свободными (шахматка резиденту закрыта). */
(function () {
  'use strict';
  if (location.protocol === 'file:') return;
  var res = new URLSearchParams(location.search).get('res') || '';
  var req = new XMLHttpRequest();
  req.open('GET', '/api/occupancy?res=' + encodeURIComponent(res), false);   // до отрисовки
  req.withCredentials = true;
  try {
    req.send(null);
    if (req.status === 200) {
      var d = JSON.parse(req.responseText);
      window.__BUSY__ = {};
      (d.busy || []).forEach(function (id) { window.__BUSY__[id] = true; });
    }
  } catch (e) {}
})();

MSV.ready(function (ctx) {
  'use strict';

  /* Комнаты — из данных резиденций (с сервера или демо), свободные места
     считаются по броням на сегодня. Раньше здесь был выдуманный список. */
  var SHOTS = [['#FFD93D','#CBB6FF','#56C3D0'],['#A2D2FF','#C8F03C','#E7BD83'],['#D04D87','#FFAB37','#7EB2DD'],['#90A955','#FFE558','#567EDD']];
  var today = (function () { var n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); })();
  function day(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || '')); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }

  /* Резиденция из адреса — со страницы выбора адреса */
  var wantRes = new URLSearchParams(location.search).get('res');
  var DEMO = new URLSearchParams(location.search).get('demo') === '1';
  var ROOMS = [];
  ctx.residences.forEach(function (res, ri) {
    if (wantRes && res.id !== wantRes) return;
    var d = ctx.bookings(res);
    var busy = {};
    d.bookings.forEach(function (b) { var f = day(b.from), t = day(b.to); if (f !== null && t !== null && f <= today && t >= today) busy[b.bedId] = true; });
    // ?demo=1 — режим просмотра для заказчика: каждое второе место считается
    // занятым, чтобы в одной карточке были и «Выбрать», и «Продано».
    // Реальные брони не меняются, это только показ.
    if (DEMO) { busy = {}; res.beds.forEach(function (b, i) { if (i % 2 === 0) busy[b.id] = true; }); }
    // Занятые места для резидента: шахматка ему закрыта, поэтому берём
    // короткий список занятых мест (/api/occupancy) — без имён и броней.
    if (!DEMO && window.__BUSY__) Object.keys(window.__BUSY__).forEach(function (id) { busy[id] = true; });
    res.rooms.forEach(function (r, i) {
      var beds = res.beds.filter(function (b) { return b.roomId === r.id; });
      var tiers = {};
      // У части мест в исходных данных нет пометки яруса. Если в комнате есть
      // ярусные места с той же ценой — это тот же ярус (24 200 — верхнее, 27 500 — нижнее).
      var priceTier = {};
      beds.forEach(function (b) { if (b.tier) priceTier[b.price] = priceTier[b.price] || b.tier; });
      beds.forEach(function (b) {
        var k = b.tier || priceTier[b.price] || 'Место';
        tiers[k] = tiers[k] || { kind: k === 'нижнее' ? 'Нижнее место' : (k === 'верхнее' ? 'Верхнее место' : 'Место'), left: 0, price: b.price, ids: [] };
        if (!busy[b.id]) { tiers[k].left++; tiers[k].ids.push(b.id); }
      });
      var list = Object.keys(tiers).map(function (k) { return tiers[k]; }).sort(function (a, b) { return a.price - b.price; });
      var freeIds = []; list.forEach(function (t) { freeIds = freeIds.concat(t.ids); });
      ROOMS.push({
        id: r.id, size: r.size || beds.length, sex: r.gender || '', name: r.name, residence: res.name, resId: res.id, residenceTitle: res.title || res.name,
        shots: SHOTS[(ri * 7 + i) % SHOTS.length], more: 0,
        text: r.note ? r.note.charAt(0).toUpperCase() + r.note.slice(1) : '',   // без описания — ничего, резиденция уже подписана выше
        beds: list, bedIds: freeIds, price: list.length ? list[0].price : 0
      });
    });
  });

  var UNUSED_DEMO_ROOMS = [
    { id: 'r1', size: 4, sex: 'ж', name: '№1 «Иваново»', shots: ['#FFD93D', '#CBB6FF', '#56C3D0'], more: 2,
      text: 'Окна во двор, два стола, свой санузел. Кухня на этаже.',
      beds: [ { kind: 'Верхнее место', left: 2, price: 24200 }, { kind: 'Нижнее место', left: 1, price: 27500 } ] },

    { id: 'r2', size: 4, sex: 'м', name: '№4 «Суздаль»', shots: ['#A2D2FF', '#C8F03C', '#E7BD83'], more: 3,
      text: 'Угловая комната, окна на две стороны. Рядом коворкинг.',
      beds: [ { kind: 'Верхнее место', left: 1, price: 24200 }, { kind: 'Нижнее место', left: 0, price: 27500 } ] },

    { id: 'r3', size: 2, sex: 'ж', name: '№7 «Ростов»', shots: ['#D04D87', '#FFAB37', '#7EB2DD'], more: 1,
      text: 'Две кровати, большой шкаф, балкон. Тихий этаж.',
      beds: [ { kind: 'Место в двухместной', left: 2, price: 33040 } ] },

    { id: 'r4', size: 8, sex: 'м', name: '№12 «Углич»', shots: ['#90A955', '#FFE558', '#567EDD'], more: 4,
      text: 'Просторный блок, четыре двухъярусные кровати, две душевые.',
      beds: [ { kind: 'Верхнее место', left: 3, price: 19800 }, { kind: 'Нижнее место', left: 2, price: 22400 } ] },

    { id: 'r5', size: 1, sex: 'ж', name: '№15 «Плёс»', shots: ['#CBB6FF', '#C8F03C', '#FDD232'], more: 0,
      text: 'Отдельная комната с рабочим местом и своим санузлом.',
      beds: [ { kind: 'Одноместная', left: 1, price: 46900 } ] }
  ];

  var list = document.getElementById('list');
  if (DEMO) { var warn = document.createElement('p'); warn.className = 'msv-note'; warn.style.cssText = 'margin:0 0 var(--msv-s12);padding:var(--msv-s8) var(--msv-s12);background:var(--msv-lavender);border-radius:var(--msv-r11)'; warn.textContent = 'Режим показа: занятость мест условная, каждое второе место считается занятым.'; list.parentNode.insertBefore(warn, list); }
  var filter = { sex: '', size: '', free: '1' };
  // Заголовок шапки — по выбранной резиденции; без ?res= — «Все резиденции».
  // (Раньше искался по устаревшему классу и не менялся: страница всех резиденций
  // называлась «Резиденция Уют» и показывала под ней чужие комнаты.)
  var notice = document.querySelector('.form__head .form__title-link');
  var shown = wantRes ? ctx.residences.filter(function (r) { return r.id === wantRes; }) : ctx.residences;
  if (notice) notice.textContent = shown.length === 1 ? (shown[0].title || shown[0].name) : 'Все резиденции';

  function money(n) {
    // Разряды разделяются тонким пробелом, валюта — «руб.»
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009') + '\u2009руб.';
  }

  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function shots(room, idx) {
    // Настоящие фотографии резиденции (photos.js). Пока их нет — цветные плашки.
    var real = window.MSV_PHOTOS ? MSV_PHOTOS.forRoom(room.resId, idx || 0, 3) : [];
    if (real.length) {
      var h = real.map(function (p) {
        return '<img class="room__shot" src="' + esc(p.src) + '" alt="' + esc(p.alt) + '" loading="lazy" decoding="async" data-zoom>';
      }).join('');
      var rest = (MSV_PHOTOS.all(room.resId).length - real.length);
      if (rest > 0) h += '<span class="room__more">+' + rest + '</span>';
      return h;
    }
    var html = room.shots.map(function (c, i) {
      return '<span class="room__shot" style="background:' + esc(c) + '" title="Фото ' + (i + 1) + ' появится после загрузки администратором"></span>';
    }).join('');
    if (room.more > 0) html += '<span class="room__more">+' + room.more + '</span>';
    return html;
  }

  function render() {
    var rooms = ROOMS.filter(function (r) {
      if (filter.sex && r.sex !== filter.sex) return false;
      if (filter.size && String(r.size) !== filter.size) return false;
      if (filter.free && !r.beds.some(function (b) { return b.left > 0; })) return false;
      return true;
    });

    if (!rooms.length) {
      list.innerHTML = '<p class="msv-body rooms__empty">' + (filter.free ? 'Свободных мест с такими условиями нет. Нажми «Показать все места» или встань в <a class="msv-link" href="relocation.html">очередь</a>.' : 'Комнат с такими условиями нет.') + '</p>';
      return;
    }

    // Кнопка «Выбрать» — у каждого вида места (верхнее / нижнее): у них
    // разная цена, и выбор происходит именно здесь. Все кнопки одинаковые;
    // у выкупленных мест — неактивная «Продано» (решение заказчика 21.09.2026).
    list.innerHTML = rooms.map(function (r, ri) {
      var prices = r.beds.map(function (b, ti) {
        var out = b.left === 0;
        var btn;
        if (out) {
          btn = '<button class="msv-btn msv-btn--s msv-btn--secondary" type="button" disabled>Продано</button>';
        } else {
          btn = '<button class="msv-btn msv-btn--s msv-btn--primary" type="button" data-pick="' + esc(r.id) + '" data-tier="' + ti + '">Выбрать</button>';
        }
        return '<div class="room__price' + (out ? ' room__price--out' : '') + '"' + (out ? '' : ' role="button" tabindex="0" data-pick="' + esc(r.id) + '" data-tier="' + ti + '"') + '>' +
          '<span>' + esc(b.kind) + '</span>' +
          '<b>' + money(b.price) + '</b>' + btn + '</div>';
      }).join('');

      // Порядок в карточке (решение заказчика 21.09.2026): тип + пол в одной строке,
      // резиденция, имя, описание (санузел и т.п.) сразу под именем, фото, цены.
      return '<article class="room">' +
        '<div class="room__top">' +
          '<span class="msv-note room__res">' + esc(r.residenceTitle) + '</span>' +
          '<span class="sex-tag sex-tag--' + (r.sex === 'ж' ? 'f' : 'm') + '">' + (r.sex === 'ж' ? 'Женская' : 'Мужская') + '</span>' +
        '</div>' +
        '<h2 class="msv-sub room__name">' + esc(r.name) + '</h2>' +
        '<span class="room__kind">' + r.size + '-местная</span>' +
        '<p class="msv-body room__text">' + esc(r.text) + '</p>' +
        '<div class="room__shots">' + shots(r, ri) + '</div>' +
        '<div class="room__prices">' + prices + '</div>' +
        '<p class="msv-note room__terms">Цены при условии оплаты по СБП и заключении «годового контракта» (проживание и оплаты без перерыва минимум до конца августа).</p>' +
      '</article>';
    }).join('');
  }

  /* ---------- Фильтры ---------- */

  // Выбор места: щелчок по всей строке (не только по кнопке) и Enter с клавиатуры
  document.getElementById('list').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var row = e.target.closest('.room__price[data-pick]'); if (!row) return;
    e.preventDefault(); row.click();
  });

  document.querySelector('.filters').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;

    var key = chip.hasAttribute('data-sex') ? 'sex' : (chip.hasAttribute('data-free') ? 'free' : 'size');
    var attr = 'data-' + key;
    var value = chip.getAttribute(attr);
    var on = chip.getAttribute('aria-pressed') === 'true';

    var group = chip.parentNode.querySelectorAll('.chip');
    Array.prototype.forEach.call(group, function (c) { c.setAttribute('aria-pressed', 'false'); });

    if (key === 'free') {                      // переключатель из двух состояний
      chip.setAttribute('aria-pressed', 'true'); filter.free = value; render(); return;
    }
    if (on && value !== '') {
      filter[key] = '';                        // повторное нажатие снимает фильтр
    } else {
      chip.setAttribute('aria-pressed', 'true');
      filter[key] = value;
    }

    // «Все» — это снятый фильтр, отмечаем его, когда ничего не выбрано
    if (key === 'size' && filter.size === '') {
      var all = document.querySelector('.chip[data-size=""]');
      if (all) all.setAttribute('aria-pressed', 'true');
    }

    render();
  });

  /* ---------- Выбор комнаты ---------- */

  list.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-pick]');
    if (!btn) return;
    var room = ROOMS.filter(function (r) { return r.id === btn.dataset.pick; })[0];
    if (!room) return;
    // Вид места выбран здесь (верхнее / нижнее); конкретную кровать этого
    // вида резидент уточнит с куратором — берём первую свободную
    var tier = room.beds[Number(btn.dataset.tier)] || room.beds[0];
    var bed = (tier && tier.ids && tier.ids[0]) || '';
    location.href = 'month.html?room=' + encodeURIComponent(room.name) +
                    '&size=' + room.size + '&bed=' + encodeURIComponent(bed) +
                    '&kind=' + encodeURIComponent(tier ? tier.kind : '') +
                    '&price=' + (tier ? tier.price : room.price || 0);
  });

  render();

  /* Пол из анкеты: свой фильтр включён, чужой недоступен — комнаты в резиденциях
     мужские и женские, и резидент видит только свои. */
  if (location.protocol !== 'file:') {
    fetch('/api/me/home', { credentials: 'same-origin' })
      .then(function (r) { return r.status === 200 ? r.json() : null; })
      .then(function (d) {
        var g = d && d.profile && d.profile.gender;
        if (g !== 'м' && g !== 'ж') return;
        document.querySelectorAll('.chip[data-sex]').forEach(function (c) {
          var mine = c.getAttribute('data-sex') === g;
          c.setAttribute('aria-pressed', mine ? 'true' : 'false');
          c.disabled = !mine;
          if (!mine) c.title = 'Комнаты другого пола недоступны';
        });
        filter.sex = g;
        render();
      })
      .catch(function () {});
  }
});
</script>


<script src="mark.js"></script>
<script src="zoom.js"></script>
<script src="edit.js"></script>
<script src="protect.js"></script>
</body>
</html>
