<script>
MSV.ready(function (ctx) {
  'use strict';

  var ME = ctx.me ? ctx.me.name : 'Сергей Ким';
  var RES = ctx.residences;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function ago(hours) {
    if (hours < 1) return 'только что';
    if (hours < 24) return hours + ' ' + plural(hours, 'час', 'часа', 'часов') + ' назад';
    var d = Math.floor(hours / 24);
    return d + ' ' + plural(d, 'день', 'дня', 'дней') + ' назад';
  }

  var PRIO_TAG = { critical: 'tag--bad', urgent: 'tag--warn', normal: 'tag--info', consult: 'tag--mute' };
  var STATUS_TAG = { 'Принята': 'tag--info', 'В работе': 'tag--warn', 'Выполнена': 'tag--ok', 'Отклонена': 'tag--bad' };

  /* Заявки всей сети. Изменения (взял в работу, выполнил) живут
     в памяти страницы до обновления — сервера нет. */
  var ALL = ctx.tickets();


  function row(t) {
    var late = t.overdue && t.status !== 'Выполнена' && t.status !== 'Отклонена'
      ? ' <span class="tag tag--bad">просрочена</span>' : '';
    return '<tr data-id="' + esc(t.id) + '">' +
      '<td><span class="who-cell__name">' + esc(t.category) + late + '</span>' +
        '<span class="msv-note sub">' + esc(t.text) + '</span></td>' +
      '<td>' + esc(t.resident) +
        '<span class="msv-note sub">' + esc(t.bed) + ' · ' + esc(t.room) + ' · ' + esc(t.residence) + '</span></td>' +
      '<td><span class="tag ' + PRIO_TAG[t.priority] + '">' + esc(t.priorityName) + '</span>' +
        '<span class="msv-note sub">срок ' + t.deadlineHours + ' ч · ' + esc(ago(t.ageHours)) + '</span></td>' +
      '<td><span class="tag ' + STATUS_TAG[t.status] + '">' + esc(t.status) + '</span>' +
        (t.master ? '<span class="msv-note sub">' + esc(t.master) + '</span>' : '') + '</td>' +
      '<td class="num">' + (
        (!t.master && t.status !== 'Выполнена' && t.status !== 'Отклонена')
          ? '<button class="msv-btn msv-btn--s msv-btn--secondary" type="button" data-act="take">Взять себе</button>'
          : (t.master === ME ? '<span class="msv-note">моя</span>' : '')) + '</td>' +
    '</tr>';
  }

  var state = { q: '', f: '' };

  function isClosed(t) { return t.status === 'Выполнена' || t.status === 'Отклонена'; }

  function matches(t) {
    if (state.f === '' && isClosed(t)) return false;
    if (state.f === 'closed' && !isClosed(t)) return false;
    if (state.f === 'free' && (t.master || isClosed(t))) return false;
    if (state.f === 'overdue' && (!t.overdue || isClosed(t))) return false;
    if (state.q) {
      var hay = (t.resident + ' ' + t.room + ' ' + t.bed + ' ' + t.category + ' ' + t.text + ' ' + t.residence)
        .toLowerCase().replace(/ё/g, 'е');
      if (hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function render() {
    var list = ALL.filter(matches).sort(function (a, b) {
      if (a.overdue !== b.overdue) return a.overdue ? -1 : 1;
      return b.created - a.created;
    });
    document.getElementById('count').textContent = list.length + ' из ' + ALL.length;
    var box = document.getElementById('rows');
    box.innerHTML = list.length ? list.map(row).join('')
      : '<tr><td colspan="5" class="grid__empty">Ничего не нашлось.</td></tr>';
  }

  document.getElementById('rows').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var t = ALL.filter(function (x) { return x.id === btn.closest('tr').dataset.id; })[0];
    if (!t) return;
    function apply() { t.master = ME; if (t.status === 'Принята') t.status = 'В работе'; render(); }
    if (!ctx.live) { apply(); return; }
    ctx.api('PATCH', '/api/tickets/' + encodeURIComponent(t.id), { take: true, status: 'В работе' })
      .then(function (r) { if (r.status === 200) apply(); else alert(r.body && r.body.error || 'Не удалось'); })
      .catch(function () { alert('Сервер не отвечает'); });
  });

  var timer = null;
  document.getElementById('q').addEventListener('input', function (e) {
    clearTimeout(timer);
    var v = e.target.value;
    timer = setTimeout(function () { state.q = v.trim().toLowerCase().replace(/ё/g, 'е'); render(); }, 150);
  });

  document.querySelector('.bar').addEventListener('click', function (e) {
    var chip = e.target.closest('.bar__chip');
    if (!chip) return;
    document.querySelectorAll('.bar__chip').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
    chip.setAttribute('aria-pressed', 'true');
    state.f = chip.getAttribute('data-f');
    render();
  });

  render();
});
</script>
