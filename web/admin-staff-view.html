  .set__title { margin: 0 0 var(--msv-s8); } .set__text { margin: 0 0 var(--msv-s16); color: var(--msv-n500); }
  .set__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--msv-s12); }
  .set .msv-field { margin-bottom: 0; }
  .grid tr.more td { padding: 0 var(--msv-s12) var(--msv-s12); background: var(--msv-beige); border-top: 0; }
  .more__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--msv-s8) var(--msv-s16); padding-top: var(--msv-s8); }
  .more__grid dt { font-size: 12px; color: var(--msv-n500); } .more__grid dd { margin: 0; font-weight: 600; }
  .tri { width: 28px; height: 28px; border: 0; background: transparent; color: var(--msv-n500); cursor: pointer; border-radius: 50%; }
  .tri:hover { background: var(--msv-n100); } .tri svg { transition: transform var(--msv-fast) var(--msv-ease); }
  .tri[aria-expanded="true"] svg { transform: rotate(180deg); }
  .miss { color: var(--msv-red); font-weight: 600; }
  .who-link { color: inherit; text-decoration: none; } .who-link:hover .who-cell__name { text-decoration: underline; }
</style>

<script src="api.js"></script>
<script src="staff.js"></script>
<script>
MSV.ready(function (ctx) {
  'use strict';
  var id = new URLSearchParams(location.search).get('id');
  var box = document.getElementById('card');
  /* Карточку берём из того же списка, что и страница «Сотрудники», —
     из базы. Раньше список был записан в файле, и карточка показывала
     то, чего в базе уже не было (25.09.2026). */
  window.MSV_STAFF_LOAD().then(function (list) { show(list.filter(function (x) { return x.id === id; })[0]); });

  function show(s) {
  if (!s) { box.innerHTML = '<p class="msv-body" style="color:var(--msv-n500)">Сотрудник не найден. <a class="msv-link" href="admin-staff.html">К списку</a></p>'; return; }
  document.querySelector('.work__title').textContent = 'Карточка сотрудника';
  var PLACE = window.MSV_STAFF_PLACE, tenure = window.MSV_STAFF_TENURE;
  function esc(v) { return String(v == null ? '' : v).replace(/</g,'&lt;'); }
  function f(v) { return v ? esc(v) : '<span class="miss">не указано</span>'; }
  function fdate(iso) { return iso ? iso.split('-').reverse().join('.') : '<span class="miss">не указано</span>'; }
  var ROLE = { admin: 'Администратор', moderator: 'Модератор', staff: 'Сотрудник' };
  box.innerHTML =
    /* Шапка как в карточке резидента: лицо, имя, должность. По лицу
       человека узнают быстрее, чем по строке в таблице (решение
       заказчика 25.09.2026). */
    '<section class="set"><div class="card-top">' +
      (s.photo
        ? '<img class="card-top__ava" src="' + esc(s.photo) + '" alt="" data-zoom>'
        : '<span class="card-top__ava">' + esc(s.name.split(' ').map(function (w) { return w[0] || ''; }).slice(0, 2).join('').toUpperCase()) + '</span>') +
      '<span class="card-top__t">' +
        '<h2 class="msv-sub card-top__name">' + esc(s.name) + '</h2>' +
        '<p class="msv-body card-top__sub">' + esc(s.position || 'должность не указана') + '</p>' +
        '<p class="msv-body card-top__sub">' + esc(s.phone || s.email || 'контакт не указан') + '</p>' +
      '</span></div>' +
      '<div class="set__grid">' +
      ['Должность', esc(s.position), 'Роль в системе', ROLE[s.role] || s.role,
       'Место работы', s.place ? esc(PLACE[s.place]) : '<span class="miss">не указано</span>', 'Дата рождения', fdate(s.birthday),
       'Работает с', fdate(s.started), 'Стаж', esc(tenure(s.started)), 'Оклад', s.salary ? String(s.salary).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' руб.' : '<span class="miss">не указан</span>',
       'Куда переводить', f(s.payTo), 'Тип отношений', esc(s.relation), 'Телефон', f(s.phone), 'Почта', f(s.email)]
      .reduce(function (acc, v, i, a) { if (i % 2 === 0) acc.push('<div><span class="msv-note" style="display:block">' + v + '</span><span class="msv-body" style="font-weight:600">' + a[i + 1] + '</span></div>'); return acc; }, []).join('') +
    '</div></section>' +
    '<section class="set"><h2 class="msv-sub set__title">Документы</h2><p class="msv-body set__text">Что сотрудник загрузил при регистрации: паспорт, ИНН, СНИЛС, договор, медкнижка.</p>' +
      '<div class="photos zoomable" id="docs"><p class="msv-note" style="margin:0">Документов пока нет — сотрудник загрузит их в своём кабинете, раздел «Мои документы».</p></div></section>' +
    '<section class="set"><h2 class="msv-sub set__title">Действия</h2><div style="display:flex;flex-wrap:wrap;gap:var(--msv-s8)">' +
      '<a class="msv-btn msv-btn--m msv-btn--primary" href="admin-staff.html">Начислить зарплату</a>' +
      '<a class="msv-btn msv-btn--m msv-btn--tertiary" href="admin-rights.html">Права доступа</a>' +
      '<button class="msv-btn msv-btn--m msv-btn--tertiary" type="button" id="resetPin">Выдать новый код входа</button>' +
    '</div></section>';
  /* Новый код выдаёт сервер — кнопка больше не показывает цифры,
     которые никуда не записаны (25.09.2026) */
  document.getElementById('resetPin').addEventListener('click', function () {
    var pin = String(prompt('Новый код входа — четыре цифры:', String(Math.floor(1000 + Math.random() * 9000))) || '').replace(/\D/g, '');
    if (pin.length !== 4) { if (pin) alert('Нужны четыре цифры'); return; }
    if (!ctx.live) { alert('Без сервера код не выдать'); return; }
    ctx.api('POST', '/api/users/' + (s.userId || s.id) + '/pin', { pin: pin })
      .then(function (r) {
        alert(r.status === 200
          ? 'Новый код для ' + s.name + ': ' + pin + '. Сообщите лично и попросите сменить.'
          : (r.body && r.body.error || 'Не удалось выдать код'));
      })
      .catch(function () { alert('Сервер не отвечает'); });
  });
  if (ctx.live && s.userId) {
    ctx.api('GET', '/api/users/' + s.userId + '/files').then(function (r) {
      if (r.status !== 200 || !r.body.length) return;
      document.getElementById('docs').innerHTML = r.body.map(function (d) { return '<img src="' + d.url + '" alt="' + esc(d.kind) + '" data-zoom style="width:120px;height:90px;object-fit:cover;border-radius:var(--msv-r11)">'; }).join('');
    }).catch(function () {});
  }
  }
});
</script>
