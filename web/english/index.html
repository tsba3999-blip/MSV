  <script id="goe-lesson-data" type="application/json">{"hotel":[{"prompt":"Hello! What is your name?","translation":"Здравствуйте! Как вас зовут?","hint":"Представьтесь: My name is …","good":"My name is Alex.","retry":"My name Alex.","explanation":"Имя понятно. Добавим is: My name is Alex — «Меня зовут Алекс»."},{"prompt":"Would you like to check in?","translation":"Вы хотите заселиться?","hint":"Чтобы выразить желание сейчас, используйте I'd like to …","good":"Yes, I'd like to check in, please.","retry":"Yes, I like to check in.","explanation":"I like означает «мне нравится». Для «я хотел бы заселиться» используйте I'd like to check in. I'd — сокращение от I would."},{"prompt":"Do you have a reservation?","translation":"У вас есть бронирование?","hint":"Если бронирование есть: Yes, I have a …","good":"Yes, I have a reservation.","retry":"Yes, I have reservation.","explanation":"Смысл понятен. Перед reservation в единственном числе здесь нужен артикль a: I have a reservation."},{"prompt":"How many nights will you stay?","translation":"На сколько ночей вы остановитесь?","hint":"Начните с I'll stay for … и добавьте число ночей: two nights.","good":"I'll stay for two nights.","retry":"I stay two night.","explanation":"После two нужно множественное число: nights. О предстоящем проживании удобно сказать I'll stay for two nights — «Я остановлюсь на две ночи»."},{"prompt":"Would you like breakfast?","translation":"Вы хотите завтрак?","hint":"Подтвердите заказ: Yes, I'd like …, please.","good":"Yes, I'd like breakfast, please.","retry":"Yes, I like breakfast.","explanation":"I like breakfast — «Мне нравится завтрак». Сейчас вы принимаете предложение, поэтому лучше I'd like breakfast — «Я бы хотел завтрак»."},{"prompt":"Do you need help with your bags?","translation":"Вам нужна помощь с сумками?","hint":"Если нужна помощь: Yes, I need help with my …","good":"Yes, I need help with my bags, please.","retry":"Yes, I need helps with my bags.","explanation":"Здесь help означает «помощь» и употребляется без окончания s: I need help with my bags."},{"prompt":"Would you like to pay by card?","translation":"Вы хотите заплатить картой?","hint":"Скажите, как заплатите: I'll pay by …","good":"Yes, I'll pay by card.","retry":"Yes, I will be pay by card.","explanation":"После will сразу ставим pay: I will pay. Слово be здесь не нужно. I'll pay — сокращённый вариант."},{"prompt":"Do you need a receipt?","translation":"Вам нужен чек?","hint":"Если чек не нужен: No, I don't need a …","good":"No, I don't need a receipt, thank you.","retry":"No, I not need receipt.","explanation":"Для отрицания используйте don't need — «не нужен». Перед receipt добавим a: I don't need a receipt."}],"travel":[{"prompt":"Where do you want to go?","translation":"Куда вы хотите поехать?","hint":"Назовите страну: I want to go to …","good":"I want to go to Turkey.","retry":"I want go Turkey.","explanation":"После want перед действием нужно to: want to go. Направление к стране тоже выражаем через to: go to Turkey."},{"prompt":"Who do you travel with?","translation":"С кем вы путешествуете?","hint":"Назовите спутника: I travel with my …","good":"I travel with my wife.","retry":"I traveling with my wife.","explanation":"Вопрос о том, с кем вы обычно путешествуете. Для этого подходит I travel with my wife. Форма I traveling без am неверна."},{"prompt":"What would you like to drink?","translation":"Что вы хотели бы выпить?","hint":"Закажите напиток: I'd like …, please. «С молоком» — with milk.","good":"I'd like coffee with milk, please.","retry":"I'd like coffee milk.","explanation":"Для «кофе с молоком» добавьте with: coffee with milk. Вежливое начало I'd like уже подходит."}],"ai":[{"prompt":"Do you use AI at work?","translation":"Вы используете ИИ на работе?","hint":"Если используете: Yes, I use AI …","good":"Yes, I use AI at work.","retry":"Yes, I using AI at work.","explanation":"Для обычного действия говорим I use — «я использую». Форма I using без am неверна."},{"prompt":"Do you understand this word?","translation":"Вы понимаете это слово?","hint":"Если слово непонятно: No, I don't understand …","good":"No, I don't understand this word.","retry":"No, I not understand this word.","explanation":"Отрицание с understand строится через don't: I don't understand — «Я не понимаю»."},{"prompt":"What do you want to learn?","translation":"Что вы хотите изучать?","hint":"Расскажите о цели: I want to learn about …","good":"I want to learn about AI.","retry":"I want learning about AI.","explanation":"После want используйте to и начальную форму действия: want to learn. Вся фраза: I want to learn about AI."}],"university":[{"prompt":"Are you a student?","translation":"Вы студент?","hint":"В роли студента ответьте: Yes, I'm a …","good":"Yes, I'm a student.","retry":"Yes, I student.","explanation":"Нужны am и артикль a: I am a student. В разговоре удобно сократить I am до I'm."},{"prompt":"What do you study?","translation":"Что вы изучаете?","hint":"Назовите предмет: I study …","good":"I study English.","retry":"I am study English.","explanation":"Для обычного занятия достаточно I study English. Перед study в этой конструкции am не ставится."},{"prompt":"Do you have a class today?","translation":"У вас сегодня есть занятие?","hint":"Если занятие есть: Yes, I have a class …","good":"Yes, I have a class today.","retry":"Yes, I has a class today.","explanation":"С I используется have: I have a class today. Has используется с he, she и it."}],"work":[{"prompt":"Where do you work?","translation":"Где вы работаете?","hint":"В роли сотрудника гостиницы: I work in a …","good":"I work in a hotel.","retry":"I work hotel.","explanation":"Чтобы сказать «работаю в гостинице», используйте in a hotel. Также правильно at a hotel."},{"prompt":"Do you enjoy your work?","translation":"Вам нравится ваша работа?","hint":"Если нравится: Yes, I enjoy my …","good":"Yes, I enjoy my work.","retry":"Yes, I enjoys my work.","explanation":"После I используйте enjoy без s: I enjoy my work. Окончание s нужно с he, she или it."},{"prompt":"What time do you start work?","translation":"Во сколько вы начинаете работать?","hint":"Назовите время: I start work at …","good":"I start work at nine.","retry":"I start work in nine.","explanation":"Перед конкретным временем используем at: at nine — «в девять». Поэтому I start work at nine."}]}</script>
