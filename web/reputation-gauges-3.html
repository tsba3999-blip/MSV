  /* ============================================================
     Тридцать круглых и полукруглых индикаторов репутации.

  .page { padding-bottom: var(--msv-s48); }

  .again { display: inline-flex; align-items: center; height: var(--msv-btn-s); padding: 0 var(--msv-s16); margin-top: var(--msv-s8); font: 600 13px/1 var(--msv-font); color: var(--msv-graphite); background: var(--msv-beige); border: 0; border-radius: 999px; cursor: pointer; }
  .mv { transition: all 1.3s cubic-bezier(.2,.9,.2,1); }
  .g.run .mv { transform: var(--tf, none); stroke-dashoffset: var(--dash, 0); opacity: var(--op, 1); }

<body>

<div class="page">

  <div class="head">
    <a class="head__back" href="reputation.html" aria-label="Вернуться назад">

    <h1 class="msv-sub head__title"><a class="head__title-link" href="reputation.html">Репутация: тридцать круглых</a></h1>
  </div>

  <p class="msv-body" style="margin:0 0 var(--msv-s24);color:var(--msv-n500)">Только круглые и полукруглые. Шкала −5…+5, значение 2,4. Оживают при открытии; «Ещё раз» — повторить. Выберите номер — поставлю его как основной.</p>

  <div class="grid" id="list"></div>

</div>

<script>
(function () {

  // угол значения на шкале со сдвигом: полный охват span, ноль в середине
  function angOf(span) { return -span / 2 + T * span; }

  function seq(g, sel, order, delay) { var el = g.querySelectorAll(sel); el.forEach(function (e) { e.classList.remove('on'); }); return function (on) { if (!on) return; order.forEach(function (i, k) { setTimeout(function () { el[i].classList.add('on'); }, 100 + k * delay); }); }; }

  var V = [];
  // 1
  V.push(['Тонкое кольцо с точкой', 'Полный круг, тонкая линия. От верха по часовой наливается цвет, на конце — точка-маркер.',
    '<svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="92" fill="none" stroke="' + N1 + '" stroke-width="4"/>' + fillArc('a', 110, 110, 92, 0, pos ? 180 : -180, 4, COL) +

  // 2

    (function () { var s = '<svg viewBox="0 0 240 220">'; for (var v = MIN; v <= MAX; v++) { var a0 = -135 + (v - MIN) * (270 / 11) + 1.5, a1 = a0 + 270 / 11 - 3, cur = Math.round(VALUE) === v; var r = cur ? 104 : 98; s += '<path class="ln" data-v="' + v + '" d="' + arc(120, 120, r, a0, a1) + '" fill="none" stroke="' + (cur ? G : (v < 0 ? RED : LIME)) + '" stroke-width="' + (cur ? 22 : 14) + '"/>'; } return s + big(120, 128) + cap(120, 150, 'репутация') + '</svg>'; })(),
    function (g, on) { var order = []; var vs = Math.round(VALUE); if (pos) for (var v = 0; v <= vs; v++) order.push(v - MIN); else for (var w = 0; w >= vs; w--) order.push(w - MIN); seq(g, '.ln', order, 110)(on); }]);
  // 7
  V.push(['Кольцо из точек', 'Двадцать четыре точки по кругу. От верха по часовой точки «включаются» по очереди до значения.',

    function (g, on) { var n = Math.round(F * 12), order = []; for (var i = 0; i < n; i++) order.push(pos ? i : 23 - i); seq(g, '.ln', order, 70)(on); }]);
  // 8
  V.push(['Двойное кольцо', 'Снаружи — тонкая шкала с рисками, внутри — толстое кольцо-заливка. Читается и издалека, и вблизи.',
    '<svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="' + N1 + '" stroke-width="2"/>' + ticks(110, 110, 104, 360, 8) + '<circle cx="110" cy="110" r="76" fill="none" stroke="' + N1 + '" stroke-width="16"/>' + fillArc('a', 110, 110, 76, 0, pos ? 180 : -180, 16, COL) + big(110, 120) + '</svg>']);

    needle('n', 120, 130, 82, 180) + big(120, 116) + '</svg>']);
  // 10
  V.push(['Кольцо с зазором внизу', 'Кольцо на 300° с разрывом внизу. Ноль — вверху; минус уходит влево красным, плюс — вправо лаймом.',
    '<svg viewBox="0 0 220 220"><path d="' + arc(110, 110, 88, -150, 150) + '" fill="none" stroke="' + N1 + '" stroke-width="14" stroke-linecap="round"/>' + fillArc('a', 110, 110, 88, 0, pos ? 150 : -150, 14, COL) + '<line x1="110" y1="14" x2="110" y2="30" stroke="' + G + '" stroke-width="3"/>' + big(110, 120) + cap(110, 142, 'репутация') + '</svg>']);

  V.push(['Пирог', 'Полный диск делится как пирог: закрашивается сектор, пропорциональный значению. Центр — белый круг с числом.',
    '<svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="' + N1 + '"/><path id="s" fill="' + COL + '"/><circle cx="110" cy="110" r="52" fill="' + W + '"/>' + big(110, 120) + '</svg>',
    function (g, on) { var p = g.querySelector('#s'), t0 = Date.now(), end = 180 * F; (function step() { var k = on ? Math.min(1, (Date.now() - t0) / 1300) : 0; var a = end * (1 - Math.pow(1 - k, 3)); var pt = P(110, 110, 96, pos ? a : -a); p.setAttribute('d', a < .5 ? '' : 'M110 110 L110 14 A96 96 0 ' + (a > 180 ? 1 : 0) + ' ' + (pos ? 1 : 0) + ' ' + pt.join(' ') + ' Z'); if (on && k < 1) setTimeout(step, 16); })(); }]);
  // 12
  V.push(['Штриховое кольцо', 'Кольцо из коротких штрихов (60 штук). Закрашенные штрихи — набранная репутация, штрихи «тикают» по очереди.',
    (function () { var s = '<svg viewBox="0 0 220 220">'; for (var i = 0; i < 60; i++) { var p0 = P(110, 110, 96, i * 6), p1 = P(110, 110, 84, i * 6); s += '<line class="ln" x1="' + p0[0] + '" y1="' + p0[1] + '" x2="' + p1[0] + '" y2="' + p1[1] + '" stroke="' + (i < 30 ? LIME : RED) + '" stroke-width="3" stroke-linecap="round"/>'; } return s + big(110, 120) + cap(110, 142, 'из +5') + '</svg>'; })(),
    function (g, on) { var n = Math.round(F * 30), order = []; for (var i = 0; i < n; i++) order.push(pos ? i : 59 - i); seq(g, '.ln', order, 28)(on); }]);

  // 14
  V.push(['Автомобильный', 'Тёмный диск, светящаяся дуга и стрелка с шариком на конце — как спидометр в машине.',

  // 15
  V.push(['Кнопка с кольцом', 'Графитовый круг с числом, как кнопка, и тонкое цветное кольцо вокруг — наливается по часовой.',
    '<svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="70" fill="' + G + '"/><circle cx="110" cy="110" r="92" fill="none" stroke="' + N1 + '" stroke-width="6"/>' + fillArc('a', 110, 110, 92, 0, pos ? 180 : -180, 6, COL) + big(110, 120, 'fill:#fff') + '<text class="cap" x="110" y="142" text-anchor="middle" style="fill:#B8B1A5">репутация</text></svg>']);
  // 16
  V.push(['Зубцы', 'Полукруг из 21 зубца. Зубцы до значения закрашены, остальные серые; каждый зубец — половина деления.',

  // 18
