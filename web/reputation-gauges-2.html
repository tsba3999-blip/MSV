<style>
  /* ============================================================
     Двадцать анимированных вариантов индикатора репутации.
     Шкала −5…+5, значение VALUE (сейчас 2,4). Ниже нуля — красный,
     выше — лайм; графит — текущее. Каждый вариант оживает при
     открытии; «Ещё раз» — повторить. Все рисунки свои, на SVG/CSS.
     ============================================================ */
  .page { padding-bottom: var(--msv-s48); }
  .v { margin-bottom: var(--msv-s24); padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); box-shadow: var(--msv-e1); }
  .v__t { margin: 0 0 var(--msv-s4); }
  .v__d { margin: 0 0 var(--msv-s12); color: var(--msv-n500); }
  .v__num { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; margin-right: var(--msv-s8); font-size: 14px; font-weight: 700; color: var(--msv-white); background: var(--msv-graphite); border-radius: 14px; vertical-align: middle; }
  .g { position: relative; display: block; width: 100%; max-width: 320px; margin: 0 auto; }
  .g svg { display: block; width: 100%; height: auto; overflow: visible; }
  .big { font: 700 34px/1 var(--msv-font); letter-spacing: -.02em; fill: var(--msv-graphite); }
  .mid { font: 700 20px/1 var(--msv-font); fill: var(--msv-graphite); }
  .cap { font: 600 11px/1 var(--msv-font); letter-spacing: .08em; text-transform: uppercase; fill: var(--msv-n500); }
  .tick { font: 600 11px/1 var(--msv-font); fill: var(--msv-graphite); }
  .again { display: inline-flex; align-items: center; height: var(--msv-btn-s); padding: 0 var(--msv-s16); margin-top: var(--msv-s8); font: 600 13px/1 var(--msv-font); color: var(--msv-graphite); background: var(--msv-beige); border: 0; border-radius: 999px; cursor: pointer; }
  .E { transition-timing-function: cubic-bezier(.2,.9,.2,1); }
  /* общие переходы: всё, что «едет», получает класс .mv и целевое значение через переменные */
  .mv { transition: all 1.3s cubic-bezier(.2,.9,.2,1); }
  .g.run .mv { transform: var(--tf, none); stroke-dashoffset: var(--dash, 0); opacity: var(--op, 1); }
  .ln { transition: opacity .3s ease, transform .4s cubic-bezier(.34,1.4,.64,1); opacity: .15; }
  .g.run .ln.on { opacity: 1; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .mv, .ln { transition: none; } }
</style>

<body>

<div class="page">

  <div class="head">
    <a class="head__back" href="reputation.html" aria-label="Вернуться назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </a>
    <h1 class="msv-sub head__title"><a class="head__title-link" href="reputation.html">Репутация: двадцать вариантов</a></h1>
  </div>

  <p class="msv-body" style="margin:0 0 var(--msv-s24);color:var(--msv-n500)">Шкала −5…+5, значение 2,4. Каждый вариант оживает при открытии; «Ещё раз» — повторить. Выберите номер — поставлю его как основной.</p>

  <div id="list"></div>

</div>

<script>
(function () {
  'use strict';
  var VALUE = 2.4, MIN = -5, MAX = 5;
  var pos = VALUE >= 0, F = Math.abs(VALUE) / MAX;             // доля 0…1
  var COL = pos ? 'var(--msv-lime)' : 'var(--msv-red)', G = 'var(--msv-graphite)', N1 = 'var(--msv-n100)', N3 = 'var(--msv-n300)', RED = 'var(--msv-red)', LIME = 'var(--msv-lime)';
  function fmt(v) { return (v > 0 ? '+' : '') + v.toFixed(1).replace('.', ','); }
  function P(cx, cy, r, deg) { var a = (deg - 90) * Math.PI / 180; return [(cx + Math.cos(a) * r).toFixed(1), (cy + Math.sin(a) * r).toFixed(1)]; }
  function arc(cx, cy, r, a0, a1) { var p0 = P(cx, cy, r, a0), p1 = P(cx, cy, r, a1); return 'M' + p0.join(' ') + ' A' + r + ' ' + r + ' 0 ' + (Math.abs(a1 - a0) > 180 ? 1 : 0) + ' ' + (a1 > a0 ? 1 : 0) + ' ' + p1.join(' '); }
  var big = function (x, y, extra) { return '<text class="big" x="' + x + '" y="' + y + '" text-anchor="middle" data-count ' + (extra || '') + '>0</text>'; };
  var cap = function (x, y, t) { return '<text class="cap" x="' + x + '" y="' + y + '" text-anchor="middle">' + t + '</text>'; };

  /* ---------- варианты: [название, описание, svg, инициализация(g) ] ---------- */
  var V = [];

  V.push(['Дуга с бегущей точкой', 'Дуга-градиент от красного к лайму. По ней от нуля бежит белая точка и останавливается на значении; за точкой дуга наливается графитом.',
    '<svg viewBox="0 0 320 200"><defs><linearGradient id="gr1" x1="0" x2="1"><stop offset="0" stop-color="#FB344A"/><stop offset=".5" stop-color="#EAE4DA"/><stop offset="1" stop-color="#C8F03C"/></linearGradient></defs>' +
    '<path d="' + arc(160, 160, 128, -90, 90) + '" fill="none" stroke="url(#gr1)" stroke-width="14" stroke-linecap="round" opacity=".55"/>' +
    '<path id="a1" class="mv" d="' + arc(160, 160, 128, 0, pos ? 90 : -90) + '" fill="none" stroke="' + G + '" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="--dash:' + (100 - F * 100) + '"/>' +
    '<circle id="d1" class="mv" cx="160" cy="32" r="9" fill="#fff" stroke="' + G + '" stroke-width="3" style="transform-origin:160px 160px;--tf:rotate(' + (pos ? 90 * F : -90 * F) + 'deg)"/>' +
    big(160, 150) + cap(160, 176, 'репутация') + '</svg>']);

  V.push(['Встречные полосы', 'Две полосы от центра: влево красная (до −5), вправо лаймовая (до +5). Тянется та, куда ушло значение; другая остаётся тонкой чертой.',
    '<svg viewBox="0 0 320 120">' +
    '<rect x="16" y="52" width="288" height="6" rx="3" fill="' + N1 + '"/><line x1="160" y1="40" x2="160" y2="70" stroke="' + G + '" stroke-width="2"/>' +
    '<rect id="b2" x="160" y="46" width="0" height="18" rx="9" fill="' + COL + '" style="transition:width 1.3s cubic-bezier(.2,.9,.2,1), x 1.3s cubic-bezier(.2,.9,.2,1)"/>' +
    '<text class="tick" x="16" y="92" text-anchor="start" fill="' + RED + '">−5</text><text class="tick" x="304" y="92" text-anchor="end">+5</text>' + big(160, 30) + '</svg>',
    function (g, on) { var b = g.querySelector('#b2'); var w = 144 * F; if (!on) { b.setAttribute('width', 0); b.setAttribute('x', 160); } else { b.setAttribute('width', w); b.setAttribute('x', pos ? 160 : 160 - w); } }]);

  V.push(['Батарея', 'Батарейка на десять ячеек: пять красных слева от нуля, пять лаймовых справа. Заряд — репутация. Число справа, как проценты у батареи.',
    (function () { var s = '<svg viewBox="0 0 320 110"><rect x="16" y="30" width="232" height="50" rx="10" fill="none" stroke="' + G + '" stroke-width="3"/><rect x="250" y="45" width="8" height="20" rx="3" fill="' + G + '"/>';
      for (var i = 0; i < 10; i++) s += '<rect class="ln" data-i="' + i + '" x="' + (23 + i * 22.4) + '" y="37" width="19" height="36" rx="4" fill="' + (i < 5 ? RED : LIME) + '"/>';
      s += '<line x1="132" y1="26" x2="132" y2="84" stroke="' + G + '" stroke-width="2"/>' + '<text class="mid" x="292" y="62" text-anchor="middle" data-count>0</text></svg>'; return s; })(),
    function (g, on) { var cells = g.querySelectorAll('.ln'); cells.forEach(function (c) { c.classList.remove('on'); }); if (!on) return; var n = Math.round(F * 5); for (var i = 0; i < n; i++) (function (k) { setTimeout(function () { cells[pos ? 5 + k : 4 - k].classList.add('on'); }, 120 + k * 150); })(i); }]);

  V.push(['Пульс', 'Линия, как на кардиомониторе, прочерчивается слева направо и заканчивается на высоте значения — точкой, которая мигает.',
    '<svg viewBox="0 0 320 150"><line x1="16" y1="75" x2="304" y2="75" stroke="' + N1 + '" stroke-width="2"/>' +
    '<path id="p4" class="mv" d="M16 75 L70 75 L86 55 L100 95 L114 75 L170 75 L186 60 L200 90 L214 75 L250 75 L250 ' + (75 - 60 * VALUE / MAX) + ' L304 ' + (75 - 60 * VALUE / MAX) + '" fill="none" stroke="' + COL + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="--dash:0"/>' +
    '<circle id="c4" cx="304" cy="' + (75 - 60 * VALUE / MAX) + '" r="6" fill="' + G + '" opacity="0"/>' +
    '<text class="tick" x="8" y="20" text-anchor="start">+5</text><text class="tick" x="8" y="139" text-anchor="start" fill="' + RED + '">−5</text>' + big(60, 44) + '</svg>',
    function (g, on) { var c = g.querySelector('#c4'); c.style.animation = 'none'; c.setAttribute('opacity', 0); if (on) setTimeout(function () { c.setAttribute('opacity', 1); c.style.animation = 'blink 1s ease-in-out infinite'; }, 1350); }]);

  V.push(['Стопка монет', 'Каждая единица — монета. Стопка растёт снизу вверх, по одной; при минусе монеты красные и стопка «уходит под пол».',
    (function () { var s = '<svg viewBox="0 0 320 170"><line x1="60" y1="120" x2="260" y2="120" stroke="' + G + '" stroke-width="2"/>';
      for (var i = 0; i < 5; i++) s += '<ellipse class="ln" data-i="' + i + '" cx="160" cy="' + (112 - i * 16) + '" rx="44" ry="9" fill="' + LIME + '" stroke="' + G + '" stroke-width="2"/>';
      s += cap(160, 150, 'монет: ' + Math.round(VALUE)) + big(265, 60, 'text-anchor="start"') + '</svg>'; return s; })(),
    function (g, on) { var c = g.querySelectorAll('.ln'); c.forEach(function (e) { e.classList.remove('on'); }); if (!on) return; var n = Math.round(F * 5); for (var i = 0; i < n; i++) (function (k) { setTimeout(function () { c[k].classList.add('on'); }, 100 + k * 180); })(i); }]);

  V.push(['Сектор циферблата', 'Круг делится на секторы как пирог: от нуля сверху по часовой закрашивается ровно та доля, которую «заработала» репутация.',
    '<svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="100" fill="' + N1 + '"/>' +
    '<path id="s6" fill="' + COL + '" d=""/>' +
    '<circle cx="120" cy="120" r="56" fill="#fff"/><line x1="120" y1="20" x2="120" y2="36" stroke="' + G + '" stroke-width="3"/>' + big(120, 130) + cap(120, 152, 'из +5') + '</svg>',
    function (g, on) { var p = g.querySelector('#s6'); var t0 = Date.now(), end = 180 * F; function step() { var k = Math.min(1, (Date.now() - t0) / 1300); var e = 1 - Math.pow(1 - k, 3); var a = end * e; if (!on) a = 0; var a1 = pos ? a : -a; var pt = P(120, 120, 100, a1); p.setAttribute('d', a < .5 ? '' : 'M120 120 L120 20 A100 100 0 ' + (a > 180 ? 1 : 0) + ' ' + (pos ? 1 : 0) + ' ' + pt.join(' ') + ' Z'); if (k < 1 && on) setTimeout(step, 16); } step(); }]);

  V.push(['Комета', 'Тонкое кольцо; от нуля стартует светящаяся голова кометы и оставляет за собой цветной хвост, который гаснет к началу.',
    '<svg viewBox="0 0 240 240"><defs><linearGradient id="gr7" x1="0" x2="1"><stop offset="0" stop-color="#C8F03C" stop-opacity="0"/><stop offset="1" stop-color="#C8F03C"/></linearGradient></defs>' +
    '<circle cx="120" cy="120" r="92" fill="none" stroke="' + N1 + '" stroke-width="4"/>' +
    '<path id="t7" class="mv" d="' + arc(120, 120, 92, 0, pos ? 180 : -180) + '" fill="none" stroke="url(#gr7)" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="--dash:' + (100 - F * 100) + '"/>' +
    '<circle id="h7" class="mv" cx="120" cy="28" r="8" fill="#fff" stroke="' + G + '" stroke-width="3" style="transform-origin:120px 120px;--tf:rotate(' + (pos ? 180 * F : -180 * F) + 'deg)"/>' +
    big(120, 130) + cap(120, 152, 'репутация') + '</svg>']);

  V.push(['Лучи', 'Двадцать лучей вокруг центра. От верхнего по часовой загораются лучи до значения — как солнце, которое встаёт.',
    (function () { var s = '<svg viewBox="0 0 240 240">'; for (var i = 0; i < 20; i++) { var a = i * 18; var p0 = P(120, 120, 62, a), p1 = P(120, 120, 100, a); s += '<line class="ln" data-i="' + i + '" x1="' + p0[0] + '" y1="' + p0[1] + '" x2="' + p1[0] + '" y2="' + p1[1] + '" stroke="' + (i < 10 ? LIME : RED) + '" stroke-width="7" stroke-linecap="round"/>'; }
      s += big(120, 130) + cap(120, 152, 'из +5') + '</svg>'; return s; })(),

  V.push(['Арка над шкалой', 'Горизонтальная шкала, а над значением вырастает арка с числом внутри — как отметка на карте маршрута.',
    '<svg viewBox="0 0 320 140"><rect x="16" y="104" width="288" height="6" rx="3" fill="' + N1 + '"/><rect x="16" y="104" width="144" height="6" rx="3" fill="' + RED + '" opacity=".35"/><rect x="160" y="104" width="144" height="6" rx="3" fill="' + LIME + '" opacity=".35"/>' +
    '<g id="a9" class="mv" style="transform-origin:160px 107px;--tf:translateX(' + (144 * F * (pos ? 1 : -1)) + 'px)"><path d="M120 107 A40 40 0 0 1 200 107" fill="#fff" stroke="' + G + '" stroke-width="3"/><circle cx="160" cy="107" r="6" fill="' + G + '"/>' + '<text class="mid" x="160" y="92" text-anchor="middle" data-count>0</text></g>' +
    '<text class="tick" x="16" y="132" text-anchor="start" fill="' + RED + '">−5</text><text class="tick" x="160" y="132" text-anchor="middle">0</text><text class="tick" x="304" y="132" text-anchor="end">+5</text></svg>']);

  V.push(['Плитка с фоновой дугой', 'Как плитка «К оплате» на главной: крупное число и подпись, а фоном — полупрозрачная дуга, которая тихо наливается. Спокойный, без приборов.',
    '<svg viewBox="0 0 320 160"><rect x="0" y="0" width="320" height="160" rx="20" fill="' + (pos ? '#EEF9D3' : '#FEE7EA') + '"/>' +
    '<path id="a10" class="mv" d="' + arc(250, 170, 130, -90, 90) + '" fill="none" stroke="' + COL + '" stroke-width="40" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="--dash:' + (100 - F * 100) + '" opacity=".55"/>' +
    '<text class="cap" x="24" y="40" text-anchor="start">Репутация</text><text class="big" x="24" y="96" text-anchor="start" style="font-size:44px" data-count>0</text><text class="tick" x="24" y="126" text-anchor="start" fill="var(--msv-n500)">из +5 · всё хорошо</text></svg>']);

  V.push(['Ступени вверх', 'Нулевая площадка посередине, пять ступеней вверх и пять вниз. Метка-человечек поднимается по ступеням до значения.',
    (function () { var s = '<svg viewBox="0 0 320 170">'; for (var v = -5; v <= 5; v++) { var x = 16 + (v + 5) * 26.8, y = 110 - v * 11; s += '<rect x="' + x + '" y="' + y + '" width="26" height="' + (160 - y) + '" fill="' + (v < 0 ? RED : (v === 0 ? G : LIME)) + '" opacity="' + (v === 0 ? 1 : .35) + '"/>'; }
      s += '<g id="m11" class="mv" style="--tf:translate(' + (26.8 * VALUE) + 'px, ' + (-11 * VALUE) + 'px)"><circle cx="163" cy="88" r="7" fill="' + G + '"/><path d="M163 95 v18 M155 103 h16 M163 113 l-7 12 M163 113 l7 12" stroke="' + G + '" stroke-width="3" stroke-linecap="round" fill="none"/></g>' + big(60, 40) + '</svg>'; return s; })()]);

  V.push(['Спираль', 'Линия закручивается от центра наружу: чем выше репутация, тем больше витков. Число — в начале спирали.',
    (function () { var d = '', turns = 2.5, pts = 160; for (var i = 0; i <= pts; i++) { var t = i / pts, a = t * turns * 360, r = 8 + t * 92, p = P(120, 120, r, a); d += (i ? ' L' : 'M') + p.join(' '); }
      return '<svg viewBox="0 0 240 240"><path d="' + d + '" fill="none" stroke="' + N1 + '" stroke-width="6" stroke-linecap="round"/><path id="s12" class="mv" d="' + d + '" fill="none" stroke="' + COL + '" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="--dash:' + (100 - F * 100) + '"/>' + '<text class="mid" x="120" y="127" text-anchor="middle" data-count>0</text></svg>'; })()]);

  V.push(['Вертикальная линейка с флажком', 'Шкала стоит вертикально, как рост на стене. Флажок с числом ползёт вверх от нуля и «втыкается» на значении.',
    (function () { var s = '<svg viewBox="0 0 200 240"><line x1="60" y1="20" x2="60" y2="220" stroke="' + N1 + '" stroke-width="6" stroke-linecap="round"/>'; for (var v = -5; v <= 5; v++) { var y = 120 - v * 20; s += '<line x1="' + (v % 5 === 0 ? 48 : 54) + '" y1="' + y + '" x2="66" y2="' + y + '" stroke="' + G + '" stroke-width="2"/>'; if (v % 5 === 0) s += '<text class="tick" x="40" y="' + (y + 4) + '" text-anchor="end"' + (v < 0 ? ' fill="' + RED + '"' : '') + '>' + (v > 0 ? '+' : '') + v + '</text>'; }
      s += '<rect id="v13" class="mv" x="57" y="120" width="6" height="0" rx="3" fill="' + COL + '"/>';
      s += '<g id="f13" class="mv" style="--tf:translateY(' + (-20 * VALUE) + 'px)"><path d="M63 120 h70 l-10 12 l10 12 h-70 z" transform="translate(0 -12)" fill="' + G + '"/><text class="mid" x="94" y="127" text-anchor="middle" style="fill:#fff;font-size:16px" data-count>0</text></g></svg>'; return s; })(),
    function (g, on) { var v = g.querySelector('#v13'); var h = 20 * Math.abs(VALUE); if (!on) { v.setAttribute('height', 0); v.setAttribute('y', 120); } else { v.setAttribute('height', h); v.setAttribute('y', pos ? 120 - h : 120); } }]);

  V.push(['Пузырь', 'Круг растёт от точки до размера, пропорционального репутации; максимум — во весь кадр. Мягко, как в мессенджерах.',
    '<svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="100" fill="none" stroke="' + N1 + '" stroke-width="2" stroke-dasharray="4 6"/>' +
    '<circle id="b14" class="mv" cx="120" cy="120" r="100" fill="' + COL + '" opacity=".9" style="transform-origin:120px 120px;transform:scale(.04);--tf:scale(' + (0.15 + .85 * F) + ')"/>' +
    big(120, 130) + '</svg>']);

  V.push(['Капли', 'Пять капель. Каждая заполняется снизу вверх, следующая — когда наполнилась предыдущая. Последняя — частично, по дробной части.',
    (function () { var s = '<svg viewBox="0 0 320 130"><defs>'; for (var i = 0; i < 5; i++) s += '<clipPath id="cp15' + i + '"><path d="M' + (48 + i * 56) + ' 20 C' + (66 + i * 56) + ' 50 ' + (72 + i * 56) + ' 66 ' + (72 + i * 56) + ' 80 A24 24 0 0 1 ' + (24 + i * 56) + ' 80 C' + (24 + i * 56) + ' 66 ' + (30 + i * 56) + ' 50 ' + (48 + i * 56) + ' 20 Z"/></clipPath>'; s += '</defs>';
      for (var j = 0; j < 5; j++) s += '<path d="M' + (48 + j * 56) + ' 20 C' + (66 + j * 56) + ' 50 ' + (72 + j * 56) + ' 66 ' + (72 + j * 56) + ' 80 A24 24 0 0 1 ' + (24 + j * 56) + ' 80 C' + (24 + j * 56) + ' 66 ' + (30 + j * 56) + ' 50 ' + (48 + j * 56) + ' 20 Z" fill="' + N1 + '"/><rect class="dr" data-i="' + j + '" clip-path="url(#cp15' + j + ')" x="' + (20 + j * 56) + '" y="106" width="56" height="0" fill="' + COL + '" style="transition:y .5s ease, height .5s ease"/>';
