<script>
(function () {
  'use strict';

  var C = { bordo: '#7A1F2E', red: '#FB344A', yellow: '#FFD93D', lime: '#C8F03C', green: '#35B265', emerald: '#1E7F4B', ink: '#34495E', white: '#FFFFFF', n100: '#EAE4DA', n300: '#B8B1A5', n500: '#6B665E' };

    { v: -2, c: 'bordo',   ink: '#fff', t: ['Опасность', 'расторжения', 'договора'], w: 'Опасность расторжения договора', s: 'Опасность' },

    { v:  1, c: 'lime',    ink: C.ink,  t: ['У тебя', 'хорошее', 'будущее'],         w: 'У тебя хорошее будущее', s: 'Будущее' },
    { v:  2, c: 'green',   ink: '#fff', t: ['Ты на', 'высоте'],                      w: 'Ты на высоте', s: 'На высоте' },
    { v:  3, c: 'emerald', ink: '#fff', t: ['Так', 'держать!'],                      w: 'Так держать!', s: 'Так держать!' }
  ];
  var ICON = { bordo: 'M12 3l10 18H2z M12 10v5 M12 18v.5', red: 'M12 4v10 M12 18v.5', yellow: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M9 13a3 3 0 0 0 6 0', lime: 'M5 12l5 5 9-10', green: 'M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z', emerald: 'M6 4h12v4a6 6 0 0 1-12 0z M9 20h6 M12 14v6 M6 6H3v2a3 3 0 0 0 3 3 M18 6h3v2a3 3 0 0 1-3 3' };
  var HEART = 'M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z';
  var state = { v: 1, lives: 2, months: 2 };

  /* ---------- геометрия ---------- */
  var CX = 200, CY = 200;
  function pt(r, a) { var k = a * Math.PI / 180; return [CX + r * Math.cos(k), CY - r * Math.sin(k)]; }
  function f(n) { return Math.round(n * 100) / 100; }
  function ring(r1, r2, a1, a2) {   // a1 > a2 (по часовой), дуга < 180°
    var big = a1 - a2 > 180 ? 1 : 0;
    var p1 = pt(r2, a1), p2 = pt(r2, a2), p3 = pt(r1, a2), p4 = pt(r1, a1);
    return 'M' + f(p1[0]) + ' ' + f(p1[1]) + ' A' + r2 + ' ' + r2 + ' 0 ' + big + ' 1 ' + f(p2[0]) + ' ' + f(p2[1]) +
      ' L' + f(p3[0]) + ' ' + f(p3[1]) + ' A' + r1 + ' ' + r1 + ' 0 ' + big + ' 0 ' + f(p4[0]) + ' ' + f(p4[1]) + ' Z';
  }
  function arc(r, a1, a2) { var big = a1 - a2 > 180 ? 1 : 0; var p1 = pt(r, a1), p2 = pt(r, a2); return 'M' + f(p1[0]) + ' ' + f(p1[1]) + ' A' + r + ' ' + r + ' 0 ' + big + ' 1 ' + f(p2[0]) + ' ' + f(p2[1]); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function hex(h) { var n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function rgb(a) { return '#' + a.map(function (x) { return ('0' + Math.round(Math.max(0, Math.min(255, x))).toString(16)).slice(-2); }).join(''); }
  function mix(h1, h2, k) { var a = hex(h1), b = hex(h2); return rgb([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]); }
  function light(h, k) { return mix(h, '#FFFFFF', k); }
  function plural(n) { return n === 1 ? 'месяц' : n < 5 ? 'месяца' : 'месяцев'; }
  var uid = 0;

  /* ---------- индикатор ----------
     o.sweep    — 180 (полукруг) или 270 (три четверти)
     o.band     — [r1, r2] цветная полоса; o.ring — [k1, k2] кольцо цифр или null
     o.flat     — без градиента; o.cont — сплошной градиент без секторов; o.gap — зазор, град.
     o.inside   — 'phrases' | 'icons' | 'none'; o.nums — 'ring' | 'out' | 'none'; o.ticks — штрихи
     o.needle   — 'graphite' | 'red' | 'white' | 'slim' | 'drop' | 'tail' | 'outer' | 'knob' | 'none'
     o.mode     — 'normal' | 'fill' (сектора до значения) | 'led' (деления) | 'only' (только текущий) | 'draw' (дуга-прогресс)
     o.center   — 'hearts' | 'score' | 'phrase' | 'initials' | 'livesArc' | 'none'; o.discount; o.dark
     o.anim     — 'spring' | 'ease' | 'bounce' | 'sweep' | 'tick' | 'grow' | 'shiver' | 'count' | 'fill' | 'led' | 'draw' | 'fade' */
  function gauge(o) {
    var id = 'g' + (++uid);
    var sweep = o.sweep || 180, A1 = 90 + sweep / 2, A2 = 90 - sweep / 2;
    var R1 = o.band[0], R2 = o.band[1];
    var gap = o.gap === undefined ? 1.4 : o.gap;
    var n = S.length, bounds = []; for (var i = 0; i <= n; i++) bounds.push(A1 - sweep * i / n);
    var v = state.v, idx = v + 2, cur = S[idx];
    var ang = (bounds[idx] + bounds[idx + 1]) / 2;
    var rot = 90 - ang, rot0 = 90 - A1;
    var dark = o.dark, ink = dark ? '#fff' : C.ink, sub = dark ? '#B7C3D0' : C.n500;
    var H = sweep > 180 ? 400 : (o.center === 'below' ? 262 : 224);
    var s = ['<svg viewBox="0 0 400 ' + H + '"' + (o.mode ? ' data-seq="1"' : '') + ' xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Репутация ' + v + '">', '<defs>'];
    s.push('<filter id="' + id + 'sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#34495E" flood-opacity=".18"/></filter>');
    s.push('<filter id="' + id + 'ns" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity=".3"/></filter>');
    ORDER.forEach(function (k) {
      s.push('<radialGradient id="' + id + k + '" cx="' + CX + '" cy="' + CY + '" r="' + R2 + '" gradientUnits="userSpaceOnUse"><stop offset="' + f(R1 / R2) + '" stop-color="' + light(C[k], .28) + '"/><stop offset=".8" stop-color="' + C[k] + '"/><stop offset="1" stop-color="' + C[k] + '" stop-opacity=".92"/></radialGradient>');
    });
    var rm = (R1 + R2) / 2, rl = [R2 - 14, R2 - 31, R2 - 48], tg = gap * 0.7;   // строки текста прижаты к внешнему краю, зазор для текста уже
    S.forEach(function (x, i) {
      rl.forEach(function (r, j) { s.push('<path id="' + id + i + 'abc'[j] + '" d="' + arc(r, bounds[i] - tg, bounds[i + 1] + tg) + '"/>'); });
      if (o.ring) s.push('<path id="' + id + i + 'k" d="' + arc((o.ring[0] + o.ring[1]) / 2, bounds[i] - gap, bounds[i + 1] + gap) + '"/>');
    });
    s.push('</defs>');

    /* кольцо + сектора */
    s.push('<g filter="url(#' + id + 'sh)">');
    if (o.ring) S.forEach(function (x, i) { s.push('<path d="' + ring(o.ring[0], o.ring[1], bounds[i] - gap, bounds[i + 1] + gap) + '" fill="' + (dark ? '#4A5B70' : (o.ringColor || C.white)) + '"/>'); });
    if (o.cont) {
      var N = 60;
      for (var q = 0; q < N; q++) {
        var t0 = q / N * (n - 1), i0 = Math.min(n - 2, Math.floor(t0)), col = mix(C[ORDER[i0]], C[ORDER[i0 + 1]], t0 - i0);
        var b1 = A1 - sweep * q / N, b2 = A1 - sweep * (q + 1) / N - 0.3;
        var on = o.mode === 'draw' ? (b2 >= ang - 0.01) : true;
        s.push('<path class="lit" data-i="' + q + '" d="' + ring(R1, R2, b1, b2) + '" fill="' + col + '" opacity="' + (o.mode === 'draw' ? (on ? 1 : .18) : 1) + '" data-on="' + (on ? 1 : .18) + '"/>');
      }
    } else if (o.mode === 'led') {
      S.forEach(function (x, i) {
        var k = 5, step = (bounds[i] - gap - (bounds[i + 1] + gap)) / k;
        for (var j = 0; j < k; j++) {
          var b1 = bounds[i] - gap - step * j, b2 = b1 - step + 0.9, on = b2 >= ang - 0.01;
          s.push('<path class="lit" data-i="' + (i * k + j) + '" d="' + ring(R1, R2, b1, b2) + '" fill="' + C[x.c] + '" opacity="' + (on ? 1 : .15) + '" data-on="' + (on ? 1 : .15) + '"/>');
        }
      });
    } else {
      S.forEach(function (x, i) {
        var op = 1;
        if (o.mode === 'fill') op = i <= idx ? 1 : .18;
        if (o.mode === 'only') op = i === idx ? 1 : .22;
        s.push('<path class="lit" data-i="' + i + '" d="' + ring(R1, R2, bounds[i] - gap, bounds[i + 1] + gap) + '" fill="' + (o.flat ? C[x.c] : 'url(#' + id + x.c + ')') + '" opacity="' + op + '" data-on="' + op + '"' + (o.stroke ? ' stroke="' + (dark ? C.ink : '#F5F1EA') + '" stroke-width="' + o.stroke + '" stroke-linejoin="round"' : '') + '/>');
      });
    }
    s.push('</g>');

    /* штрихи */
    if (o.ticks) {
      for (var tk = 0; tk <= 30; tk++) {
        var ta = A1 - sweep * tk / 30, major = tk % 5 === 0, ra = R2 + 4, rb = R2 + (major ? 14 : 8);
        s.push('<line x1="' + f(pt(ra, ta)[0]) + '" y1="' + f(pt(ra, ta)[1]) + '" x2="' + f(pt(rb, ta)[0]) + '" y2="' + f(pt(rb, ta)[1]) + '" stroke="' + (major ? ink : C.n300) + '" stroke-width="' + (major ? 2 : 1) + '"/>');
      }
    }
    /* цифры */
    if (o.nums === 'ring' && o.ring) S.forEach(function (x, i) {
      var on = x.v === v;
      s.push('<text font-size="' + (on ? 17 : 15) + '" font-weight="800" fill="' + (on ? ink : sub) + '" font-family="var(--msv-font)"><textPath href="#' + id + i + 'k" startOffset="50%" text-anchor="middle" dominant-baseline="middle">' + (x.v > 0 ? '+' : '') + x.v + '</textPath></text>');
    });
    if (o.nums === 'out') S.forEach(function (x, i) {
      var p = pt(R2 + (o.ticks ? 26 : 16), (bounds[i] + bounds[i + 1]) / 2), on = x.v === v;
      s.push('<text x="' + f(p[0]) + '" y="' + f(p[1]) + '" font-size="' + (on ? 17 : 14) + '" font-weight="800" fill="' + (on ? ink : sub) + '" text-anchor="middle" dominant-baseline="middle" font-family="var(--msv-font)">' + (x.v > 0 ? '+' : '') + x.v + '</text>');
    });
    /* подписи в секторах */
    if (o.inside === 'phrases') S.forEach(function (x, i) {
      var keys = x.t.length === 3 ? ['a', 'b', 'c'] : ['a', 'b'];
      x.t.forEach(function (ln, li) { s.push('<text font-size="' + (o.font || 7.5) + '" font-weight="600" fill="' + x.ink + '" font-family="var(--msv-font)"><textPath href="#' + id + i + keys[li] + '" startOffset="50%" text-anchor="middle" dominant-baseline="middle">' + esc(ln) + '</textPath></text>'); });
    });
    if (o.inside === 'icons') S.forEach(function (x, i) {
      var p = pt(rm, (bounds[i] + bounds[i + 1]) / 2);
      s.push('<g transform="translate(' + f(p[0] - 12) + ' ' + f(p[1] - 12) + ')"><path d="' + ICON[x.c] + '" fill="none" stroke="' + x.ink + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>');
    });
    if (o.inside === 'short') S.forEach(function (x, i) {
      s.push('<text font-size="9" font-weight="700" fill="' + x.ink + '" font-family="var(--msv-font)"><textPath href="#' + id + i + 'b" startOffset="50%" text-anchor="middle" dominant-baseline="middle">' + esc(x.s) + '</textPath></text>');
    });

    /* стрелка */
    var len = o.len || (R1 + (R2 - R1) * .45), body = '', hub = dark ? '#fff' : C.ink;
    var N_ = { graphite: '<path d="M' + CX + ' ' + (CY - len) + ' L' + (CX - 6) + ' ' + (CY - 10) + ' L' + (CX + 6) + ' ' + (CY - 10) + ' Z" fill="' + hub + '"/><circle cx="' + CX + '" cy="' + CY + '" r="14" fill="' + (dark ? C.ink : '#fff') + '"/><circle cx="' + CX + '" cy="' + CY + '" r="6" fill="' + hub + '"/>',
      red: '<path d="M' + CX + ' ' + (CY - len) + ' L' + (CX - 5) + ' ' + (CY - 8) + ' L' + (CX + 5) + ' ' + (CY - 8) + ' Z" fill="' + C.red + '"/><circle cx="' + CX + '" cy="' + CY + '" r="13" fill="' + C.red + '"/><circle cx="' + CX + '" cy="' + CY + '" r="5" fill="#fff"/>',
      white: '<path d="M' + CX + ' ' + (CY - len) + ' L' + (CX - 7) + ' ' + (CY - 10) + ' L' + (CX + 7) + ' ' + (CY - 10) + ' Z" fill="#fff" stroke="' + C.ink + '" stroke-width="2" stroke-linejoin="round"/><circle cx="' + CX + '" cy="' + CY + '" r="14" fill="#fff" stroke="' + C.ink + '" stroke-width="2"/><circle cx="' + CX + '" cy="' + CY + '" r="5" fill="' + C.red + '"/>',
      slim: '<line x1="' + CX + '" y1="' + (CY - 4) + '" x2="' + CX + '" y2="' + (CY - len) + '" stroke="' + hub + '" stroke-width="3.5" stroke-linecap="round"/><circle cx="' + CX + '" cy="' + (CY - len) + '" r="6" fill="' + C.red + '" stroke="#fff" stroke-width="2"/><circle cx="' + CX + '" cy="' + CY + '" r="11" fill="' + (dark ? C.ink : '#fff') + '" stroke="' + hub + '" stroke-width="3"/>',
      drop: '<path d="M' + CX + ' ' + (CY - len) + ' C' + (CX + 9) + ' ' + (CY - len * .5) + ' ' + (CX + 9) + ' ' + (CY - 18) + ' ' + CX + ' ' + (CY + 2) + ' C' + (CX - 9) + ' ' + (CY - 18) + ' ' + (CX - 9) + ' ' + (CY - len * .5) + ' ' + CX + ' ' + (CY - len) + ' Z" fill="' + hub + '"/><circle cx="' + CX + '" cy="' + (CY - 12) + '" r="4" fill="' + C.red + '"/>',
      tail: '<path d="M' + CX + ' ' + (CY - len) + ' L' + (CX - 4) + ' ' + CY + ' L' + (CX - 5) + ' ' + (CY + 24) + ' L' + (CX + 5) + ' ' + (CY + 24) + ' L' + (CX + 4) + ' ' + CY + ' Z" fill="' + C.red + '"/><circle cx="' + CX + '" cy="' + CY + '" r="10" fill="' + hub + '"/><circle cx="' + CX + '" cy="' + CY + '" r="4" fill="#fff"/>',
      outer: '<path d="M' + CX + ' ' + (CY - R2 - 4) + ' L' + (CX - 10) + ' ' + (CY - R2 - 22) + ' L' + (CX + 10) + ' ' + (CY - R2 - 22) + ' Z" fill="' + C.red + '"/>',
