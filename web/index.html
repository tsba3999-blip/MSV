<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Сеть студенческих резиденций «Москва в студентов верит!». Личный кабинет резидента, сотрудника и администратора.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FB344A">
<title>Москва в студентов верит!</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Первая страница — красное полотно с паттерном.
     Экран 04 прототипа, растянутый на любую ширину. */

  /* Первая страница целиком красная. Прокрутка вниз разрешена: подвал со
     входом для сотрудников и правовой строкой намеренно уведён под линию
     сгиба — чтобы его увидеть, страницу надо протянуть примерно на треть
     экрана (решение заказчика 24.09.2026). Вбок не скроллится: раньше на
     некоторых экранах вылезала полоса и бежевая кромка справа. */
  html, body { min-height: 100%; overflow-x: hidden; background: var(--msv-red); }
  body { margin: 0; }

  .start {
    position: relative;
    display: flex;
    flex-direction: column;
    /* экран плюс треть: ровно столько, чтобы подвал начинался за сгибом */
    min-height: 100vh;
    min-height: 130svh;
    background: var(--msv-red);
  }

  /* Паттерн — полосой поверху, не заходя под знак и не мешая кнопкам.
     Брендбук: не более 30% площади экрана. */
  .start__pattern {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 22%;
    opacity: .55;
    pointer-events: none;
  }

  /* Сетка из трёх рядов: пустой ряд сверху, объект «лого + вход + строка»
     в середине, снизу ряд той же высоты со служебными входами и копирайтом,
     прижатыми к нижнему краю. Верхний и нижний ряды равны — объект стоит
     ровно по центру экрана. */
  /* Живой градиент под содержимым: три размытых пятна тёплых оттенков брендбука
     плывут сами по себе, тянутся за курсором с инерцией и ещё несколько секунд
     покачиваются после того, как курсор остановился. Красный остаётся главным:
     пятна полупрозрачные и не выходят за палитру (жёлтый → красный, тёмный красный).
     При «уменьшить движение» в системе — пятна стоят на месте. */
  .start__glow { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .start__glow span {
    position: absolute; left: 0; top: 0; width: 70vmax; height: 70vmax; margin: -35vmax 0 0 -35vmax;
    border-radius: 50%; filter: blur(60px); will-change: transform; opacity: .55;
    background: radial-gradient(circle at center, var(--c) 0%, transparent 62%);
  }
  .start__glow span:nth-child(1) { --c: #FFD93D; opacity: .42; }
  .start__glow span:nth-child(2) { --c: #FF7A5C; opacity: .5; }
  .start__glow span:nth-child(3) { --c: #B0102A; opacity: .6; }
  @media (prefers-reduced-motion: reduce) { .start__glow span { transition: none; } }

  /* Первый экран: знак и вход ровно по центру окна */
  .start__inner {
    position: relative;
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    flex: 0 0 auto;
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0 auto;
    padding: var(--msv-s24);
    box-sizing: border-box;
  }
  .start__hero { grid-row: 2; display: flex; flex-direction: column; align-items: center; }

  /* Подвал прижат к низу всей страницы — то есть на треть экрана ниже сгиба */
  .start__foot {
    position: relative;
    width: 100%;
    max-width: 460px;
    margin: auto auto 0;
    padding: 0 var(--msv-s24) max(var(--msv-s24), env(safe-area-inset-bottom));
    box-sizing: border-box;
  }
  .start__brand { display: block; width: 100%; max-width: 340px; }
  .start__entry { width: 100%; max-width: 340px; margin-top: var(--msv-s24); }

  /* Логотип вставлен исходным файлом: воспроизводить знак вёрсткой
     или шрифтом брендбук запрещает. Горизонтальная версия не ставится
     уже 120 px — ниже этого берётся только знак. */
  .start__logo-link { display: block; width: 100%; margin: 0 auto; border-radius: 8px; }
  .start__logo-link:focus-visible { outline: 2px solid var(--msv-white); outline-offset: 4px; }
  .start__logo-link:hover .start__logo { opacity: .92; }

  .start__logo {
    display: block;
    width: 100%;
    max-width: 340px;
    height: auto;
  }

  .start__actions { display: flex; flex-direction: column; gap: var(--msv-s12); }

  .start__reg {
    margin: var(--msv-s24) 0 0;
    text-align: center;
    color: var(--msv-white);
    font-size: var(--msv-body-size);
    line-height: var(--msv-body-line);
  }

  .start__reg a { font-weight: 600; }

  /* Служебные входы: две фигуры одного размера, без подписей */
  .start__staff {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: var(--msv-s16);
    margin-top: auto;          /* прижимает фигуры к нижнему краю */
    padding-top: var(--msv-s32);
  }

  .staff-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--msv-tap);
    height: var(--msv-tap);
    border-radius: 50%;
    text-decoration: none;
    opacity: .55;
    transition: opacity var(--msv-base) var(--msv-ease),
                background var(--msv-base) var(--msv-ease);
  }

  .staff-mark:hover { opacity: 1; background: rgba(255, 255, 255, .14); }
  .staff-mark:focus-visible { opacity: 1; outline: 2px solid var(--msv-white); outline-offset: 2px; }
  .staff-mark:active .staff-mark__shape { transform: scale(.9); }

  /* Обе фигуры вписаны в один квадрат 20×20 — площадь и вес совпадают */
  .staff-mark__shape {
    display: block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--msv-white);
    transition: transform var(--msv-fast) var(--msv-ease);
  }

  /* Буквы С и А одной высоты — как прежние фигуры */
  .staff-mark__letter {
    display: block;
    height: 14px;
    font: 700 14px/14px var(--msv-font);
    color: var(--msv-white);
    letter-spacing: .02em;
  }

  /* Для владельцев отелей и общежитий — такая же тихая, как фигуры */
  .start__partner {
    display: inline-flex;
    align-items: center;
    margin-left: var(--msv-s8);
    padding: 0 var(--msv-s12);
    min-height: var(--msv-tap);
    font-size: 13px;
    font-weight: 600;
    color: var(--msv-white);
    opacity: .55;
    text-decoration: none;
    border-radius: calc(var(--msv-tap) / 2);
    white-space: nowrap;
    transition: opacity var(--msv-base) var(--msv-ease), background var(--msv-base) var(--msv-ease);
  }

  .start__partner:hover { opacity: 1; background: rgba(255, 255, 255, .14); }
  .start__partner:focus-visible { opacity: 1; outline: 2px solid var(--msv-white); outline-offset: 2px; }

  .start__legal {
    margin: var(--msv-s12) 0 0;
    text-align: center;
    font-size: 11px;
    line-height: 16px;
    color: var(--msv-white);
    opacity: .5;
  }
  .start__legal a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .start__legal a:hover { opacity: 1; }

  /* Широкий экран: тот же один объект по центру, лого крупнее */
  @media (min-width: 900px) {
    .start__brand, .start__entry { max-width: 420px; }
    .start__logo { max-width: none; }
  }
  .home-info { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 12px; margin-top:20px; color:#fff; font-size:14px; line-height:1.5; font-variant-numeric:tabular-nums; }
  .home-info a { color:inherit; text-decoration:none; }
  .home-info a:hover { text-decoration:underline; }
  .home-info span,.home-info a { white-space:nowrap; }
  .home-credit { opacity:1; font-size:11px; }
  .entry-session { margin-bottom: 16px; padding: 16px; border-radius: 20px; background: var(--msv-graphite); color: #fff; text-align: left; }
  .entry-session[hidden] { display: none; }
  .entry-session__title { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .entry-session__dot { flex: 0 0 10px; height: 10px; border-radius: 50%; background: var(--msv-lime); }
  .entry-session__name { margin-top: 8px; overflow-wrap: anywhere; }
  .entry-session__note { margin: 8px 0 12px; font-size: 14px; line-height: 1.4; }
  .entry-session__error { margin: 8px 0 0; font-size: 14px; }
  .entry-session__error:empty { display: none; }
</style>
</head>
<body>

<main class="start">
  <div class="start__glow" id="glow" aria-hidden="true"><span></span><span></span><span></span></div>
  
  <div class="start__inner">

    <div class="start__hero">
    <div class="start__brand">
      <a class="start__logo-link" href="login.html" aria-label="Вход для резидентов"><img class="start__logo" src="msv-1200-white.png" width="1200" height="209"
           alt="МСВ — Москва в студентов верит!"></a>
      <div class="home-info" data-no-edit><span id="moscowClock"></span><span id="moscowDay"></span><a id="moscowWeather" href="https://www.met.no/en" target="_blank" rel="noopener" title="Температура по прогнозу MET Norway">Москва · погода загружается</a></div>
    </div>

    <div class="start__entry">
      <section class="entry-session" id="entrySession" aria-label="Текущий аккаунт" data-no-edit hidden>
        <div class="entry-session__title"><span class="entry-session__dot" aria-hidden="true"></span><span data-session-role></span></div>
        <div class="entry-session__name" data-session-name></div>
        <p class="entry-session__note" data-session-note></p>
        <button class="msv-btn msv-btn--block msv-btn--on-red-fill" type="button">Выйти из аккаунта</button>
        <p class="entry-session__error" data-session-error role="alert"></p>
      </section>
      <nav class="start__actions" aria-label="Вход в личный кабинет">
        <!-- Дверь одна на всех: и резидент, и сотрудник, и администратор
             (решение заказчика 24.09.2026) -->
        <a class="msv-btn msv-btn--block msv-btn--on-red-fill" href="login.html">
          Вход
        </a>
      </nav>

      <p class="start__reg">
        Ещё не живёшь у нас?
        <a class="msv-link msv-link--on-red" href="signup.html">Как заселиться</a>
      </p>
    </div>
    </div>

  </div>

  <!-- Служебные входы. По просьбе заказчика — без подписей: эти две
       фигуры узнают только сотрудники и администрация. Подписи для
       экранного диктора оставлены: без них человек с нарушением зрения
       не сможет войти. Скрытость здесь не защита — доступ разграничивает
       роль в учётной записи, а не вид кнопки.
       Блок вынесен из первого экрана: он должен лежать ниже сгиба. -->
  <div class="start__foot">
    <!-- Отдельных входов для сотрудников и администратора больше нет:
         вход один на всех, а куда попадёт человек, решает роль в его
         учётной записи (решение заказчика 24.09.2026). -->
    <div class="start__staff">
      <a class="start__partner" href="partner.html">Регистрация средства размещения</a>
    </div>

    <p class="start__legal home-credit">Погода: <a href="https://www.met.no/en">MET Norway</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Температура округлена.</p>
    <p class="start__legal">© 2026 МСВ. Все права защищены. <a href="legal.html">Правовая информация</a></p>
  </div>
</main>

<script src="home-glow.js"></script>
<script src="home-info.js"></script>

<script src="entry-session.js"></script>
<script src="mark.js"></script>
<script src="zoom.js"></script>
<script src="edit.js"></script>
<script src="protect.js"></script>
</body>
</html>
