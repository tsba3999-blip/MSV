<script>
MSV.ready(function (ctx) {
  'use strict';

  var RES = ctx.residences;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  /* Сколько прошло: до суток — в часах, дальше — в днях. */
  function ago(hours) {
    if (hours < 1) return 'только что';
    if (hours < 24) return hours + ' ' + plural(hours, 'час', 'часа', 'часов') + ' назад';
    var d = Math.floor(hours / 24);
    return d + ' ' + plural(d, 'день', 'дня', 'дней') + ' назад';
  }

  var ALL = ctx.tickets();

  ALL.sort(function (a, b) {
    if (a.overdue !== b.overdue) return a.overdue ? -1 : 1;
    return b.created - a.created;
  });

  var state = { q: '', st: '', overdue: false };
  var rowsBox = document.getElementById('rows');
  var countBox = document.getElementById('count');

  function matches(t) {
    if (state.st && t.status !== state.st) return false;
    if (state.overdue && !t.overdue) return false;
    if (state.q) {
      var hay = (t.resident + ' ' + t.room + ' ' + t.bed + ' ' + t.category + ' ' +
                 t.text + ' ' + t.residence).toLowerCase().replace(/ё/g, 'е');
      if (hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  var STATUS_TAG = {
    'Принята': 'tag--info',
    'В работе': 'tag--warn',
    'Выполнена': 'tag--ok',
    'Отклонена': 'tag--bad'
  };

  var PRIO_TAG = {
    critical: 'tag--bad',
    urgent: 'tag--warn',
    normal: 'tag--info',
    consult: 'tag--mute'
  };

  function render() {
    var list = ALL.filter(matches);
    var over = ALL.filter(function (t) { return t.overdue; }).length;
    countBox.textContent = list.length + ' из ' + ALL.length +
      (over ? ' · просрочено ' + over : '');

    if (!list.length) {
      rowsBox.innerHTML = '<tr><td colspan="5" class="grid__empty">Заявок по такому запросу нет.</td></tr>';
      return;
    }

    rowsBox.innerHTML = list.map(function (t) {
      var late = t.overdue
        ? '<span class="tag tag--bad">просрочена</span>' : '';

      return '<tr>' +
        '<td><span class="who-cell__name">' + esc(t.category) + ' ' + late + '</span>' +
          '<span class="msv-note sub">' + esc(t.text) + '</span></td>' +
        '<td>' + esc(t.resident) +
          '<span class="msv-note sub">' + esc(t.bed) + ' · ' + esc(t.room) + ' · ' + esc(t.residence) + '</span></td>' +
        '<td><span class="tag ' + PRIO_TAG[t.priority] + '">' + esc(t.priorityName) + '</span>' +
          '<span class="msv-note sub">срок ' + t.deadlineHours + ' ч · ' + esc(ago(t.ageHours)) + '</span></td>' +
        '<td>' + (t.master ? esc(t.master) : '<span class="msv-note">не назначен</span>') + '</td>' +
        '<td><span class="tag ' + STATUS_TAG[t.status] + '">' + esc(t.status) + '</span></td>' +
      '</tr>';
    }).join('');
  }

  var timer = null;
  document.getElementById('q').addEventListener('input', function (e) {
    clearTimeout(timer);
    var v = e.target.value;
    timer = setTimeout(function () {
      state.q = v.trim().toLowerCase().replace(/ё/g, 'е');
      render();
    }, 150);
  });

  document.querySelector('.bar').addEventListener('click', function (e) {
    var chip = e.target.closest('.bar__chip');
    if (!chip) return;

    if (chip.hasAttribute('data-st')) {
      document.querySelectorAll('[data-st]').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
      chip.setAttribute('aria-pressed', 'true');
      state.st = chip.getAttribute('data-st');
    } else if (chip.hasAttribute('data-only')) {
      var on = chip.getAttribute('aria-pressed') === 'true';
      chip.setAttribute('aria-pressed', on ? 'false' : 'true');
      state.overdue = !on;
    }
    render();
  });

  render();
});
</script>
