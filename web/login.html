<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon4.png" type="image/png">
<meta name="theme-color" content="#F5F1EA">
<title>Вход — Москва в студентов верит!</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; }

  .page {
    display: flex;
    flex-direction: column;
    min-height: 100svh;
    max-width: 460px;
    margin: 0 auto;
    padding: 0 var(--msv-s24) max(var(--msv-s24), env(safe-area-inset-bottom));
  }

  .head {
    display: flex;
    align-items: center;
    gap: var(--msv-s12);
    height: var(--msv-header);
    margin: 0 calc(var(--msv-s24) * -1) 0 0;
    padding: 0 var(--msv-s16) 0 0;
  }

  .head__back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--msv-tap);
    height: var(--msv-tap);
    color: var(--msv-graphite);
    background: transparent;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    text-decoration: none;
  }

  .head__back:has(.head__back-label) { width: auto; padding-right: var(--msv-s8); border-radius: 22px; gap: 2px; }
  .head__back-label { font-size: var(--msv-note-size); line-height: var(--msv-note-line); color: var(--msv-n500); }
  .head__back:hover { background: var(--msv-n100); }
  .head__back:focus-visible { outline: 2px solid var(--msv-violet); outline-offset: 2px; }

  .role {
    display: inline-flex;
    align-items: center;
    gap: var(--msv-s8);
    margin-bottom: var(--msv-s12);
    padding: 4px 12px 4px 8px;
    border-radius: calc(var(--msv-chip) / 2);
    background: var(--msv-n100);
    font-size: 11px;
    font-weight: 600;
    line-height: 16px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--msv-graphite);
  }

  .role__dot { width: 10px; height: 10px; border-radius: 50%; background: var(--msv-red); }
  .role--staff .role__dot { background: var(--msv-sky); }
  .role--admin .role__dot { background: var(--msv-graphite); }

  .title { margin-bottom: var(--msv-s8); }
  .lead { color: var(--msv-n500); margin-bottom: var(--msv-s32); }

  .step { display: none; }
  .step--on { display: block; }

  /* Ячейки пинкода */
  /* minmax(0, 1fr), а не просто 1fr: у поля ввода есть собственная
     минимальная ширина, и колонка 1fr не может стать уже неё — сетка
     вылезала за края. */
  .pin {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--msv-s12);
    margin-bottom: var(--msv-s16);
  }

  .pin__cell {
    width: 100%;
    min-width: 0;
    height: 64px;
    padding: 0;
    font-family: var(--msv-font);
    font-size: 24px;
    font-weight: 600;
    text-align: center;
    color: var(--msv-graphite);
    background: var(--msv-white);
    border: 2px solid var(--msv-n300);
    border-radius: var(--msv-r11);
    transition: border-color var(--msv-fast) var(--msv-ease);
    -moz-appearance: textfield;
  }

  .pin__cell::-webkit-outer-spin-button,
  .pin__cell::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  /* Код не показываем цифрами: через плечо читается мгновенно
     (решение заказчика 24.09.2026) */
  .pin__cell { -webkit-text-security: disc; text-security: disc; }
  .pin__cell::-ms-reveal, .pin__cell::-ms-clear { display: none; }
  .pin__cell::-webkit-credentials-auto-fill-button,
  .pin__cell::-webkit-strong-password-auto-fill-button { display: none !important; visibility: hidden; width: 0; margin: 0; }

  .pin__cell:focus { outline: none; border-color: var(--msv-graphite); }
  .pin--error .pin__cell { background: var(--msv-n100); border-color: var(--msv-red); }

  .resend {
    padding: 0;
    font: inherit;
    font-size: var(--msv-note-size);
    line-height: var(--msv-note-line);
    font-weight: 500;
    color: var(--msv-link);
    background: none;
    border: 0;
    cursor: pointer;
    text-decoration: underline wavy var(--msv-link);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }

  .resend[disabled] { color: var(--msv-n500); text-decoration: none; cursor: default; }

  .msg { margin-bottom: var(--msv-s16); }
  .msg[hidden] { display: none; }

  .foot { margin-top: auto; padding-top: var(--msv-s32); }


  .sent { margin-bottom: var(--msv-s24); }
  .sent b { font-weight: 600; }
</style>
</head>
<body>

<main class="page">

  <div class="head">
    <a class="head__back" href="index.html" aria-label="Вернуться на первую страницу">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    <span class="head__back-label form__back-label">Вернуться</span></a>
    <a class="msv-note head__title-link" id="headTitle" href="index.html" style="color:var(--msv-n500);text-decoration:none">Вход</a>
  </div>

  <span class="role" id="roleBadge"><span class="role__dot"></span><span id="roleName">Резидент</span></span>

  <h1 class="msv-h title" id="pageTitle">Вход</h1>
  <p class="msv-body lead" id="pageLead">Введи почту или телефон и четырёхзначный код. Код выдаёт модератор.</p>

  <!-- Шаг 1: контакт -->
  <section class="step step--on" id="step1" aria-labelledby="pageTitle">
    <div class="msv-error msg" id="err1" hidden role="alert">
      <svg class="msv-error__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 2.5 15 14H1z"/><path d="M8 6.5v3.2"/><path d="M8 12h.01"/>
      </svg>
      <span id="err1Text"></span>
    </div>

    <label class="msv-field">
      <span class="msv-field__label">Почта или телефон</span>
      <input class="msv-input" id="contact" type="text" inputmode="email"
             autocomplete="username" placeholder="ivan@mail.ru или +7 999 000-00-00">
    </label>
    <p class="msv-note msv-field__hint">После трёх неверных кодов вход с этого номера закрывается на полчаса.</p>

    <div class="foot">
      <button class="msv-btn msv-btn--block msv-btn--primary" id="btnSend" type="button">Дальше</button>
    </div>
  </section>

  <!-- Шаг 2: пинкод -->
  <section class="step" id="step2" aria-label="Ввод пинкода">
    <p class="msv-body sent">Код для <b id="sentTo"></b>.
      <button class="resend" type="button" id="btnChange" style="text-decoration:none;color:var(--msv-n500)">Изменить</button>
    </p>

    <div class="msv-error msg" id="err2" hidden role="alert">
      <svg class="msv-error__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 2.5 15 14H1z"/><path d="M8 6.5v3.2"/><path d="M8 12h.01"/>
      </svg>
      <span id="err2Text"></span>
    </div>

    <div class="pin" id="pin">
      <input class="pin__cell" type="password" inputmode="numeric" maxlength="1" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" aria-label="Первая цифра">
      <input class="pin__cell" type="password" inputmode="numeric" maxlength="1" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" aria-label="Вторая цифра">
      <input class="pin__cell" type="password" inputmode="numeric" maxlength="1" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" aria-label="Третья цифра">
      <input class="pin__cell" type="password" inputmode="numeric" maxlength="1" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" aria-label="Четвёртая цифра">
    </div>

    <p class="msv-note" id="btnResend" hidden></p>

    <!-- Самостоятельного восстановления нет и быть не может: код никуда не
         высылается, его выдаёт человек. Говорим об этом прямо, чтобы не
         гадали (решение заказчика 24.09.2026) -->
    <p class="msv-note" style="margin-top:var(--msv-s8)">Забыли код? Восстановить его самому нельзя — новый выдаёт модератор.</p>

    <div class="foot">
      <button class="msv-btn msv-btn--block msv-btn--primary" id="btnLogin" type="button" disabled>Войти</button>
    </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  /* ============================================================
     ВРЕМЕННАЯ ЗАГЛУШКА — УБРАТЬ ПЕРЕД ЗАПУСКОМ

     Настоящей отправки пинкода пока нет. Чтобы можно было пройти
     весь путь, вход открывается по коду ниже с любым контактом.

     Это дыра: код знает каждый, кто откроет исходный текст страницы.
     Пока в системе нет ни настоящих людей, ни данных, это допустимо.
     Как только появятся — поставить DEMO_PIN = null и подключить
     сервер в двух местах, помеченных ЗДЕСЬ БУДЕТ ЗАПРОС К СЕРВЕРУ.
     ============================================================ */
  var DEMO_PIN = null;   // код проверяет сервер; в тексте страницы его быть не должно

  /* ---------- Роль из адреса ---------- */

  /* Вход один на всех. Кем человек войдёт — резидентом, сотрудником,
     модератором или администратором — решает роль в его учётной записи,
     а не то, по какой ссылке он пришёл. Раньше на первой странице были
     отдельные буквы «С» и «А»; роль они не меняли и только путали
     (решение заказчика 24.09.2026). */
  /* Куда попадает человек сразу после входа. У администратора и модератора
     это шахматка: с неё начинается рабочий день (решение заказчика
     24.09.2026). Остальные — на свою главную. */
  var CABINET = {
    resident: 'cabinet-resident.html',
    staff: 'cabinet-staff.html',
    moderator: 'staff-shahmatka.html',
    admin: 'admin-shahmatka.html'
  };

  var params = new URLSearchParams(location.search);

  var badge = document.getElementById('roleBadge');
  if (badge) badge.hidden = true;      // роль заранее неизвестна — не обещаем её
  document.getElementById('pageTitle').textContent = 'Вход';
  document.getElementById('headTitle').textContent = 'Вход';
  document.getElementById('pageLead').textContent =
    'Введи телефон или рабочую почту и четырёхзначный код. Код выдаёт модератор.';
  document.title = 'Вход — Москва в студентов верит!';

  /* Раньше страница сама входила под первой учётной записью нужной роли —
     остаток демо-режима. Из-за этого владелец, входя «под собой», попадал
     в чужой кабинет и видел чужое имя. Убрано: вход только по своему
     контакту и коду (решение заказчика 24.09.2026). */

  /* ---------- Элементы ---------- */

  var step1 = document.getElementById('step1');
  var step2 = document.getElementById('step2');
  var contact = document.getElementById('contact');
  var btnSend = document.getElementById('btnSend');
  var btnLogin = document.getElementById('btnLogin');
  var btnResend = document.getElementById('btnResend');
  var btnChange = document.getElementById('btnChange');
  var pin = document.getElementById('pin');
  var cells = Array.prototype.slice.call(pin.querySelectorAll('.pin__cell'));
  var sentTo = document.getElementById('sentTo');


  /* ---------- Сообщения об ошибке ---------- */

  function showError(which, text) {
    var box = document.getElementById('err' + which);
    document.getElementById('err' + which + 'Text').textContent = text;
    box.hidden = false;
  }

  function clearError(which) { document.getElementById('err' + which).hidden = true; }

  /* ---------- Проверка контакта ---------- */

  function normalize(value) {
    var v = String(value || '').trim();
    if (v.indexOf('@') !== -1) {
      // почта: одна собака, точка в домене, без пробелов
      return /^[^\s@]+@[^\s@.]+\.[^\s@]{2,}$/.test(v) ? { kind: 'email', value: v.toLowerCase() } : null;
    }
    var digits = v.replace(/\D/g, '');
    if (digits.length === 11 && (digits.charAt(0) === '7' || digits.charAt(0) === '8')) {
      return { kind: 'phone', value: '+7' + digits.slice(1) };
    }
    if (digits.length === 10) return { kind: 'phone', value: '+7' + digits };
    return null;
  }

  /* ---------- Шаг 1 → 2 ---------- */

  var current = null;

  btnSend.addEventListener('click', function () {
    clearError(1);
    var parsed = normalize(contact.value);
    if (!parsed) {
      contact.classList.add('msv-input--error');
      showError(1, 'Проверь запись. Почта — вида ivan@mail.ru, телефон — 11 цифр.');
      contact.focus();
      return;
    }
    contact.classList.remove('msv-input--error');
    current = parsed;

    setBusy(btnSend, true);

    // ЗДЕСЬ БУДЕТ ЗАПРОС К СЕРВЕРУ:
    //   POST /api/auth/request-pin  { contact: current.value, role: role }
    // Пока подключения нет — переходим к шагу 2 без запроса.
    setTimeout(function () {
      setBusy(btnSend, false);
      sentTo.textContent = current.value;
      step1.classList.remove('step--on');
      step2.classList.add('step--on');
      cells[0].focus();
    }, 300);
  });

  btnChange.addEventListener('click', function () {
    step2.classList.remove('step--on');
    step1.classList.add('step--on');
    clearError(2);
    clearPin();
    contact.focus();
  });

  /* ---------- Ячейки пинкода ---------- */

  function pinValue() {
    return cells.map(function (c) { return c.value; }).join('');
  }

  function clearPin() {
    cells.forEach(function (c) { c.value = ''; });
    pin.classList.remove('pin--error');
    btnLogin.disabled = true;
  }

  function syncLoginButton() {
    btnLogin.disabled = pinValue().length !== 4;
  }

  cells.forEach(function (cell, i) {
    cell.addEventListener('input', function () {
      cell.value = cell.value.replace(/\D/g, '').slice(0, 1);
      pin.classList.remove('pin--error');
      clearError(2);
      if (cell.value && i < cells.length - 1) cells[i + 1].focus();
      syncLoginButton();
      if (pinValue().length === 4) btnLogin.focus();
    });

    cell.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !cell.value && i > 0) {
        e.preventDefault();
        cells[i - 1].value = '';
        cells[i - 1].focus();
        syncLoginButton();
      }
      if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); cells[i - 1].focus(); }
      if (e.key === 'ArrowRight' && i < cells.length - 1) { e.preventDefault(); cells[i + 1].focus(); }
    });

    // Вставка кода целиком из смс
    cell.addEventListener('paste', function (e) {
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 4);
      if (!text) return;
      for (var k = 0; k < text.length && k < cells.length; k++) cells[k].value = text.charAt(k);
      syncLoginButton();
      cells[Math.min(text.length, cells.length - 1)].focus();
    });
  });

  /* ---------- Вход ---------- */

  btnLogin.addEventListener('click', function () {
    var code = pinValue();
    if (code.length !== 4) return;
    clearError(2);
    setBusy(btnLogin, true);

    var next = params.get('next');
    var safeNext = (next && /^[\w-]+\.html$/.test(next)) ? next : null;

    function go(serverRole, firstLogin) {
      // Роль — из учётной записи на сервере. Кнопка на первой странице
      // ничего не решает: сотрудник через кнопку резидента попадёт к себе.
      var r = serverRole && CABINET[serverRole] ? serverRole : 'resident';

      /* «Куда дальше» слушаем только для резидента: онборды зовут на выбор
         резиденции, и если той же дорогой пройдёт модератор, его утащит
         выбирать себе койку вместо кабинета (24.09.2026). */
      if (r !== 'resident') { location.href = CABINET[r]; return; }

      // Новый порядок: сперва место, потом данные. Новичок идёт туда, куда
      // его звали, а по умолчанию — выбирать резиденцию.
      if (firstLogin) { location.href = safeNext || 'residences.html'; return; }
      location.href = safeNext || CABINET[r];
    }

    function refuse(text) {
      setBusy(btnLogin, false);
      pin.classList.add('pin--error');
      clearPin();
      cells[0].focus();
      showError(2, text || 'Код не подошёл. Проверь цифры и введи ещё раз.');
    }

    // Страница открыта с диска — сервера заведомо нет
    if (location.protocol === 'file:') {
      setTimeout(function () {
        if (DEMO_PIN && code === DEMO_PIN) { go(role, false); return; }
        refuse();
      }, 300);
      return;
    }

    fetch('/api/auth/verify-pin', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact: current.value, pin: code })
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j || {} }; }, function () { return { status: r.status, body: {} }; });
    }).then(function (r) {
      if (r.status === 200) { go(r.body.role, r.body.firstLogin); return; }
      refuse(r.body.error);
    }).catch(function () {
      // Сервер не отвечает — работаем как без него, чтобы демонстрация не встала
      if (DEMO_PIN && code === DEMO_PIN) { go(role, false); return; }
      refuse('Сервер не отвечает. Попробуй позже.');
    });
  });

  /* ---------- Состояние загрузки кнопки ---------- */

  function setBusy(btn, busy) {
    if (busy) {
      btn.dataset.label = btn.textContent;
      btn.style.minWidth = btn.offsetWidth + 'px';
      btn.textContent = '· · ·';
      btn.disabled = true;
    } else {
      btn.textContent = btn.dataset.label || btn.textContent;
      btn.style.minWidth = '';
      btn.disabled = false;
      if (btn === btnLogin) syncLoginButton();
    }
  }

  /* Enter в поле контакта запускает отправку */
  contact.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); btnSend.click(); }
  });

})();
</script>

<script src="mark.js"></script>
<script src="zoom.js"></script>
<script src="edit.js"></script>
<script src="protect.js"></script>
</body>
</html>
