<html lang="ru">
<head>
<meta charset="utf-8">

<title>Выбери свою резиденцию — МСВ</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resident.css">
<style>
  /* ============================================================
     Выбор резиденции — компоновка «паспарту» (вариант 8 из двадцати,
     утверждён заказчиком 23.09.2026).

     Устройство карточки: фотография в белых полях, знак резиденции
     крупный и по центру, наезжает на нижний край кадра; под ним
     название, метро с адресом, свободные места и цена — всё по центру.

     Внизу карточки — «Узнать больше» (страница резиденции) и красная
     кнопка «Выбрать» (выбор места). Карточка не ссылка целиком: в ней
     три разных перехода — адрес открывает карту, фотография открывает
     просмотр снимков, кнопка ведёт к выбору места.
     Цены и свободные места приходят с сервера; пока сервер не ответил,
     цена берётся из справочника residences.js, а не заменяется словами
     «уточняется» (решение заказчика 23.09.2026).
     ============================================================ */
  .page { padding-bottom: var(--msv-s32); }

  .res {
    display: block;
    margin-bottom: var(--msv-s16);
    padding: var(--msv-s12) var(--msv-s12) var(--msv-s16);
    color: inherit;
    text-decoration: none;
    background: var(--msv-white);
    border-radius: var(--msv-r20);
    box-shadow: var(--msv-e1);
    transition: transform var(--msv-fast) var(--msv-ease);
  }
  .res:active { transform: scale(.99); }
  .res:focus-visible { outline: 2px solid var(--msv-violet); outline-offset: 2px; }

  /* лента фотографий: листается пальцем, снимки одного размера */
  .res__media { position: relative; }
  .res__shots { display: flex; gap: 2px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: var(--msv-n100); border-radius: var(--msv-r12); }
  .res__shots::-webkit-scrollbar { display: none; }
  .res__shot { flex: 0 0 100%; scroll-snap-align: start; display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--msv-n100); }
  .res__noshot { flex: 0 0 100%; display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 10; padding: var(--msv-s16); font-size: var(--msv-note-size); color: var(--msv-n500); text-align: center; }

  .res__dots { position: absolute; left: 0; right: 0; bottom: var(--msv-s8); display: flex; justify-content: center; gap: 5px; pointer-events: none; }
  .res__dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: width var(--msv-fast) var(--msv-ease), background var(--msv-fast) var(--msv-ease); }
  .res__dots i.on { width: 16px; border-radius: 3px; background: var(--msv-white); }

  /* Лупа по центру кадра: подсказка, что фотографии открываются крупно.
     Щелчок проходит сквозь неё на саму фотографию. */
  .res__zoom {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px;
    color: var(--msv-graphite);
    background: rgba(255,255,255,.88);
    border-radius: 50%;
    box-shadow: 0 2px 10px rgba(22,32,47,.25);
    pointer-events: none;
  }

  /* Знак: квадрат со скруглением, 68 пикселей, без тени, по центру,
     наезжает на край кадра.

     Белых углов нет: сами знаки — круги на прозрачном квадрате, поэтому
     подложка квадрата красится в цвет круга этого знака, и круг сливается
     с ней. Цвета взяты из самих файлов, не на глаз (решение заказчика
     23.09.2026). Новый знак — добавить цвет сюда же. */
  .res__logo {
    position: absolute;
    left: 50%;
    bottom: -34px;
    transform: translateX(-50%);
    width: 68px;
    height: 68px;
    object-fit: cover;
    border-radius: 17px;
  }
  .res__logo[data-res="forma"] { background: #EDEDED; }
  .res__logo[data-res="uyut"]  { background: #C41618; }
  .res__logo[data-res="molod"] { background: #3784BF; }

  .res__body { padding-top: 42px; text-align: center; }
  /* Надкатегория — фирменным лепестком (радиусы 24/8 по диагонали).
     У всех трёх резиденций лепесток одинаковый; метка свободных мест —
     зеркальный, чтобы две плашки не сливались (решение заказчика 23.09.2026) */
  /* Надкатегория — тот же чип, что «Telegram» в анкете резидента:
     капсула с серой обводкой, без заливки (решение заказчика 23.09.2026) */
  .res__kind {
    align-self: center;
    display: inline-flex;
    align-items: center;
    min-height: var(--msv-chip);
    margin-bottom: var(--msv-s8);
    padding: 0 var(--msv-s16);
    font: 600 13px/1 var(--msv-font);
    color: var(--msv-graphite);
    background: transparent;
    border: 1.5px solid var(--msv-n300);
    border-radius: calc(var(--msv-chip) / 2);
  }
  .res__name { margin: 0 0 var(--msv-s4); }
  .res__metro { margin: 0; }
  .res__addr { margin: 0; }

  /* свободные места: лаймовая метка, «мест нет» — графитовая */
  .res__free { align-self: center; display: inline-flex; align-items: center; height: 26px; margin-top: var(--msv-s12); padding: 0 12px; font: 700 12px/1 var(--msv-font); color: var(--msv-graphite); background: var(--msv-lime); border-radius: 8px 24px 8px 24px; }
  .res__free--none { color: var(--msv-white); background: var(--msv-graphite); }

  .res__foot { margin-top: var(--msv-s12); padding-top: var(--msv-s12); }
  .res__price { display: block; margin-bottom: var(--msv-s12); font-weight: 700; }
  .res__price small { display: block; font-weight: 500; font-size: var(--msv-note-size); line-height: var(--msv-note-line); color: var(--msv-n500); }
  /* Кнопка — обычная фирменная во всю ширину (.msv-btn--block). Надпись
     по центру: короткое слово у левого края широкой капсулы выглядело
     сломанным (решение заказчика 23.09.2026) */
  .res__pick { justify-content: center; }

  /* На мониторе колонка шире обычных 460 пикселей: трём карточкам в ряд
     нужно место, иначе они сжимаются (решение заказчика 23.09.2026).
     Так же расширена главная резидента.
     Карточки одной высоты, даже если описания разной длины: цена прижата
     к низу — как в выборе комнаты. */
  @media (min-width: 768px) {
    .page { max-width: 640px; }
  }
  @media (min-width: 1100px) {
    .page { max-width: 1040px; }
    .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--msv-s16); align-items: stretch; }
    .res { display: flex; flex-direction: column; margin-bottom: 0; }
    .res__body { display: flex; flex-direction: column; flex: 1 1 auto; }
    .res__free { align-self: center; }
    .res__foot { margin-top: auto; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="head">
    <a class="head__back" href="profile-2.html" aria-label="Вернуться назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    <span class="head__back-label form__back-label">Вернуться</span></a>
    <h1 class="msv-sub head__title">Выбери свою резиденцию</h1>
  </div>

  <p class="msv-body" style="margin:0 0 var(--msv-s16);color:var(--msv-n500)">Три резиденции в разных районах Москвы. Листай фотографии, выбирай, где хочешь жить — дальше покажем свободные места.</p>

  <div class="res-grid" id="list"></div>

</div>

<script src="photos.js"></script>
<script src="residences.js"></script>
<script>
(function () {
  'use strict';

  var R = [
    { id: 'forma', name: 'Forma', kind: 'Комфорт-резиденция', metro: 'Шаболовская', addr: 'Конный пер., 12',
      note: '1-, 2-, 4-, 8-местные номера в т.ч. со своим су и душем', logo: 'forma.png', beds: 57,
      map: 'https://yandex.ru/maps/-/CTtSY62w' },
    { id: 'uyut', name: 'Уют', kind: 'Эконом-резиденция', metro: 'Нагатинская', addr: 'Варшавское шоссе, 18к2',
      note: '2, 4, 6, 8-местные номера и капсулы', logo: 'uyt.gif', beds: 78,
      map: 'https://yandex.ru/maps/-/CTtSYE5l' },
    { id: 'molod', name: 'Молодежка', kind: 'Квартира для девушек', metro: 'Молодежная', addr: 'ул. Партизанская, 40',
      note: 'Большая 3-комнатная квартира в престижном районе', logo: 'molodejka.png', beds: 6,
      map: 'https://yandex.ru/maps/-/CTtSaI6E' }
  ];
  var PRICE = {}, FREE = {};

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function money(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' руб.'; }
  function places(n) { var a = n % 10, b = n % 100; if (b > 10 && b < 20) return 'мест'; if (a === 1) return 'место'; if (a >= 2 && a <= 4) return 'места'; return 'мест'; }

  /* Самая низкая цена резиденции. Пока сервер не ответил, берём её из
     справочника residences.js — он лежит рядом и всегда под рукой. */
  function minPrice(r) {
    if (PRICE[r.id]) return PRICE[r.id];
    var list = window.MSV_RESIDENCES || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id !== r.id) continue;
      var min = null;
      (list[i].beds || []).forEach(function (b) { if (b.price > 0 && (min === null || b.price < min)) min = b.price; });
      if (min) return min;
    }
    return 0;
  }

  function hasShots(r) { return !!(window.MSV_PHOTOS && MSV_PHOTOS.all(r.id).length); }

  function shots(r) {
    var ph = (window.MSV_PHOTOS ? MSV_PHOTOS.all(r.id) : []).slice(0, 8);
    if (!ph.length) return '<span class="res__noshot">Фотографии этой резиденции скоро появятся</span>';
    return ph.map(function (p, i) {
      return '<img class="res__shot" src="' + esc(p.src) + '" alt="' + esc(p.alt) + '" loading="' + (i ? 'lazy' : 'eager') + '" decoding="async" data-zoom>';
    }).join('');
  }
  function dots(r) {
    var n = Math.min(8, (window.MSV_PHOTOS ? MSV_PHOTOS.all(r.id).length : 0));
    if (n < 2) return '';
    var out = '';
    for (var i = 0; i < n; i++) out += '<i' + (i ? '' : ' class="on"') + '></i>';
    return '<span class="res__dots" aria-hidden="true">' + out + '</span>';
  }
  function freeBadge(r) {
    var f = FREE[r.id];
    if (f === undefined) return '';
    return f > 0
      ? '<span class="res__free">' + f + ' ' + places(f) + '</span>'
      : '<span class="res__free res__free--none">мест нет</span>';
  }

  var ZOOM = '<span class="res__zoom"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/><path d="M8.5 11h5"/><path d="M11 8.5v5"/></svg></span>';

  function card(r) {
    var p = minPrice(r);
    return '<article class="res" data-res="' + esc(r.id) + '">' +
      '<div class="res__media">' +
        '<div class="res__shots" data-shots data-gallery="' + esc(r.id) + '">' + shots(r) + '</div>' +
        (hasShots(r) ? ZOOM : '') +
        dots(r) +
        '<img class="res__logo" data-res="' + esc(r.id) + '" src="' + esc(r.logo) + '" alt="Знак резиденции ' + esc(r.name) + '">' +
      '</div>' +
      '<div class="res__body">' +
        '<span class="res__kind">' + esc(r.kind) + '</span>' +
        '<h2 class="msv-sub res__name">' + esc(r.name) + '</h2>' +
        '<p class="msv-body res__metro">м. ' + esc(r.metro) + '</p>' +
        '<p class="msv-body res__addr"><a class="msv-link" href="' + esc(r.map) + '" target="_blank" rel="noopener">' + esc(r.addr) + '</a></p>' +
        freeBadge(r) +
        '<div class="res__foot">' +
          '<span class="msv-body res__price">от ' + money(p) + '<small>в месяц</small></span>' +
          '<a class="msv-btn msv-btn--m msv-btn--primary msv-btn--block res__pick" href="rooms.html?res=' + esc(r.id) + '">Выбрать</a>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  var list = document.getElementById('list');
  function render() { list.innerHTML = R.map(card).join(''); }
  render();

  /* Точки под фотографиями следуют за прокруткой ленты */
  list.addEventListener('scroll', function (e) {
    var box = e.target.closest('[data-shots]'); if (!box) return;
    var i = Math.round(box.scrollLeft / box.clientWidth);
    var dd = box.parentNode.querySelectorAll('.res__dots i');
    dd.forEach(function (d, j) { d.classList.toggle('on', j === i); });
  }, true);

  /* Цены и свободные места — с сервера */
  if (location.protocol !== 'file:') {
    fetch('/api/residences', { credentials: 'same-origin' })
      .then(function (r) { return r.status === 200 ? r.json() : null; })
      .then(function (listData) {
        if (!listData) return;
        listData.forEach(function (res) {
          var min = null, n = 0;
          (res.beds || []).forEach(function (b) { n++; if (b.price > 0 && (min === null || b.price < min)) min = b.price; });
          PRICE[res.id] = min;
          var row = R.filter(function (x) { return x.id === res.id; })[0];
          if (row && n) row.beds = n;
        });
        render();
        return Promise.all(R.map(function (r) {
          return fetch('/api/occupancy?res=' + r.id, { credentials: 'same-origin' })
            .then(function (x) { return x.status === 200 ? x.json() : null; })
            .then(function (d) { if (d) FREE[r.id] = Math.max(0, r.beds - d.busy.length); })
            .catch(function () {});
        })).then(render);
      })
      .catch(function () {});
  }
})();
</script>
<script src="mark.js"></script>
<script src="zoom.js"></script>
<script src="edit.js"></script>
<script src="protect.js"></script>

</body>
</html>
