<style>
  body { --role: var(--msv-graphite); --role-ink: var(--msv-graphite); }

  /* Шахматке нужна вся высота рабочей области, иначе прокрутка
     появится у страницы целиком и шапка с датами уедет. */
  /* Высота задаётся сверху донизу без разрывов: экран → оболочка →
     рабочая область → шахматка. Стоит пропустить одно звено — и
     прокручиваться начнёт вся страница, а не сетка внутри. */
  .shell { height: 100svh; }
  .work { min-height: 0; }

  .work__body--full {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    padding: var(--msv-s16) var(--msv-s24) var(--msv-s24);
  }

  #shahmatka { flex: 1 1 auto; min-height: 0; }

  @media (max-width: 860px) {
    .shell { height: auto; min-height: 100svh; }
    #shahmatka { min-height: 60vh; }
  }

  /* Переключатель резиденций логотипами — справа вверху */
  .res-switch { display: flex; gap: var(--msv-s8); margin-left: auto; }

  .res-switch__btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 3px;
    background: var(--msv-white);
    border: 2px solid var(--msv-n100);
    border-radius: 50%;
    cursor: pointer;
    opacity: .55;
    transition: opacity var(--msv-base) var(--msv-ease), border-color var(--msv-base) var(--msv-ease);
  }

  .res-switch__btn img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
  .res-switch__btn:hover { opacity: 1; }
  .res-switch__btn:focus-visible { outline: 2px solid var(--msv-violet); outline-offset: 2px; }

  .res-switch__btn[aria-current="page"] {
    opacity: 1;
    border-color: var(--msv-red);
  }

  /* окно «Изменить бронь» */
  .bk-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: var(--msv-s16); background: rgba(52,73,94,.45); }
  .bk-modal__card { width: 100%; max-width: 380px; padding: var(--msv-s20); background: var(--msv-white); border-radius: var(--msv-r20); box-shadow: var(--msv-e2); }
  .bk-modal .msv-field { display: block; margin-bottom: var(--msv-s12); }

  @media (max-width: 860px) {
    .work__body--full { padding: var(--msv-s12); }
    .work__top { flex-wrap: wrap; }
    .res-switch { margin-left: 0; }
  }
</style>
</head>
<body>

    <header class="work__top">

      <nav class="res-switch" id="resSwitch" aria-label="Резиденция"></nav>
    </header>

    <main class="work__body work__body--full">
      <p class="msv-note notice">Комнаты и цены настоящие. Проживающие и брони вымышленные: сервер ещё не подключён.</p>

<script src="api.js"></script>
<script src="residences.js"></script>
<script src="demo-bookings.js"></script>
<script src="residents-uyut.js"></script>
<script src="residents-forma.js"></script>
<script src="shahmatka.js"></script>
<script>
MSV.ready(function (ctx) {
  'use strict';

  var RES = ctx.residences;

  var params = new URLSearchParams(location.search);
  var id = params.get('res');
  var res = RES.filter(function (r) { return r.id === id; })[0] || RES[0];
  if (!res) return;

  document.getElementById('title').textContent = res.title;
  document.title = res.name + ' — МСВ';

  /* Запоминаем, в какой резиденции работает администратор: раздел
     «Резиденты» откроется сразу с этим фильтром. sessionStorage живёт
     до закрытия вкладки — на другой день фильтр не навязывается. */
  try { sessionStorage.setItem('msv.lastResidence', res.id); } catch (e) { /* хранилище недоступно */ }

  /* ---------- Переключатель резиденций ---------- */

  document.getElementById('resSwitch').innerHTML = RES.map(function (r) {
    var cur = r.id === res.id;
    return '<a class="res-switch__btn" href="admin-shahmatka.html?res=' + encodeURIComponent(r.id) + '"' +
           (cur ? ' aria-current="page"' : '') + ' title="' + r.title + '">' +
           '<img src="' + r.logo + '" alt="' + r.title + '"></a>';
  }).join('');

  /* ---------- Данные для шахматки ---------- */

  var demo = ctx.bookings(res);
  var notice = document.querySelector('.notice');
  if (notice && ctx.live) notice.textContent = 'Данные из базы. Переселение сохраняется на сервере.';

  window.sh = MSVShahmatka.mount('#shahmatka', {
    buildings: [{ id: res.id, name: res.name }],
    rooms: res.rooms,
    beds: res.beds,
    residents: demo.residents,
    bookings: demo.bookings,
    payments: demo.payments
  }, {
    title: '',
    days: 35,
    months: 12,
    onMove: function (b, was, now) {
      if (!ctx.live) return;   // без сервера — до обновления страницы
      var iso = function (ts) { return new Date(ts).toISOString().slice(0, 10); };
      ctx.api('PATCH', '/api/bookings/' + encodeURIComponent(b.id), { bedId: now.bedId, from: iso(now.from), to: iso(now.to) })
        .then(function (r) {
          if (r.status === 200) return;
          // сервер отказал — возвращаем как было
          b.bedId = was.bedId; b.from = was.from; b.to = was.to;
          window.sh.refresh();
          alert(r.body && r.body.error || 'Не удалось сохранить переселение');
        })
        .catch(function () { alert('Сервер не отвечает. Переселение не сохранено.'); });
    },
    /* Изменить бронь: даты заезда/выезда и место — сохраняется на сервере (PATCH /api/bookings/:id) */
    onEdit: function (b) {
      if (!b) return;
      if (!ctx.live) { alert('Без сервера бронь не изменить.'); return; }
      var iso = function (ts) { return new Date(ts).toISOString().slice(0, 10); };
      var box = document.createElement('div');
      box.className = 'bk-modal';
      box.innerHTML =
        '<div class="bk-modal__card" role="dialog" aria-label="Изменить бронь">' +
          '<h2 class="msv-sub" style="margin:0 0 var(--msv-s12)">Изменить бронь</h2>' +
          '<label class="msv-field"><span class="msv-field__label">Место</span><select class="msv-input" id="bkBed"></select></label>' +
          '<label class="msv-field"><span class="msv-field__label">Заезд</span><input class="msv-input" id="bkFrom" type="date"></label>' +
          '<label class="msv-field"><span class="msv-field__label">Выезд</span><input class="msv-input" id="bkTo" type="date"></label>' +
          '<p class="msv-note" id="bkErr" hidden style="color:var(--msv-red)"></p>' +
          '<div style="display:flex;gap:var(--msv-s12);margin-top:var(--msv-s16)">' +
            '<button class="msv-btn msv-btn--m msv-btn--primary" type="button" id="bkSave">Сохранить</button>' +
            '<button class="msv-btn msv-btn--m msv-btn--tertiary" type="button" id="bkCancel">Отмена</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(box);
      var sel = box.querySelector('#bkBed');
      res.beds.forEach(function (bed) {
        var room = res.rooms.filter(function (r) { return r.id === bed.roomId; })[0];
        var o = document.createElement('option'); o.value = bed.id;
        o.textContent = (room ? room.name + ' · ' : '') + bed.label + (bed.tier ? ' (' + bed.tier + ')' : '');
        if (bed.id === b.bedId) o.selected = true;
        sel.appendChild(o);
      });
      box.querySelector('#bkFrom').value = iso(b.from);
      box.querySelector('#bkTo').value = iso(b.to);
      function close() { box.remove(); }
      box.querySelector('#bkCancel').addEventListener('click', close);
      box.addEventListener('click', function (e) { if (e.target === box) close(); });
      box.querySelector('#bkSave').addEventListener('click', function () {
        var bedId = sel.value, from = box.querySelector('#bkFrom').value, to = box.querySelector('#bkTo').value;
        var err = box.querySelector('#bkErr');
        if (!from || !to || to <= from) { err.textContent = 'Выезд должен быть позже заезда.'; err.hidden = false; return; }
        ctx.api('PATCH', '/api/bookings/' + encodeURIComponent(b.id), { bedId: bedId, from: from, to: to })
          .then(function (r) {
            if (r.status !== 200) { err.textContent = (r.body && r.body.error) || 'Не удалось сохранить.'; err.hidden = false; return; }
            b.bedId = bedId; b.from = new Date(from + 'T00:00:00').getTime(); b.to = new Date(to + 'T00:00:00').getTime();
            window.sh.refresh(); close();
          })
          .catch(function () { err.textContent = 'Сервер не отвечает.'; err.hidden = false; });
      });
    },
    /* Профиль: список резидентов с уже введённым поиском по имени */
    onOpenProfile: function (r) {
      if (!r) return;
      location.href = 'admin-residents.html?q=' + encodeURIComponent(r.name);
    }
  });
});
</script>
