<script>
MSV.ready(function (ctx) {
  'use strict';

  // Имя — только с сервера; без входа заявки не показываем
  var ME = ctx.me ? ctx.me.name : '';
  var RES = ctx.residences;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  function ago(h) {
    if (h < 1) return 'только что';
    if (h < 24) return h + ' ' + plural(h, 'час', 'часа', 'часов') + ' назад';
    var d = Math.floor(h / 24);
    return d + ' ' + plural(d, 'день', 'дня', 'дней') + ' назад';
  }

  var all = ctx.tickets();
  var mine = all.filter(function (t) { return t.resident === ME; })
    .sort(function (a, b) { return b.created - a.created; });

  var TAG = { 'Принята': 'note-card__mark--info', 'В работе': 'note-card__mark--pay',
              'Выполнена': 'note-card__mark--ok', 'Отклонена': 'note-card__mark--alarm' };

  /* Срок выполнения по срочности — из него считается обратный отсчёт.
     Консультация — без срока. */
  var LIMIT_H = { critical: 2, urgent: 24, normal: 64, consult: 0 };

  function countdown(t) {
    var h = LIMIT_H[t.priority];
    if (!h || t.status !== 'В работе') return '';
    var left = t.created + h * 3600000 - Date.now();
    if (left <= 0) return '<span class="timer timer--over">срок вышел</span>';
    var hh = Math.floor(left / 3600000), mm = Math.floor(left % 3600000 / 60000), ss = Math.floor(left % 60000 / 1000);
    var txt = hh >= 1 ? (hh + ' ч ' + String(mm).padStart(2, '0') + ' мин') : (mm + ':' + String(ss).padStart(2, '0'));
    return '<span class="timer' + (left < 3600000 ? ' timer--soon' : '') + '" data-created="' + t.created + '" data-h="' + h + '">осталось ' + txt + '</span>';
  }

  var box = document.getElementById('list');
  if (!mine.length) {
    box.innerHTML = '<p class="msv-body" style="text-align:center;color:var(--msv-n500);padding:var(--msv-s48) 0">Заявок пока не было.</p>';
    return;
  }

  box.innerHTML = mine.map(function (t) {
    var closed = t.status === 'Выполнена' || t.status === 'Отклонена';
    return '<article class="note-card">' +
      '<span class="note-card__mark ' + TAG[t.status] + '"></span>' +
      '<div class="note-card__body">' +
        '<p class="msv-body note-card__text" style="font-weight:600">' + esc(t.category) +
          ' <span class="tag" style="font-weight:600;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--msv-n100);color:var(--msv-n500)">' + esc(t.status) + '</span> ' + countdown(t) + '</p>' +
        '<p class="msv-body note-card__text" style="color:var(--msv-n500)">' + esc(t.text) + '</p>' +
        '<span class="msv-note note-card__when">' + esc(t.priorityName) + ' · ' + esc(ago(t.ageHours)) +
          (t.master ? ' · мастер ' + esc(t.master) : '') +
          (!closed && t.overdue ? ' · <span style="color:var(--msv-red)">срок вышел, разбираемся</span>' : '') +
        '</span>' +
      '</div></article>';
  }).join('');

  // таймеры тикают раз в секунду
  setInterval(function () {
    document.querySelectorAll('.timer[data-created]').forEach(function (el) {
      var left = Number(el.dataset.created) + Number(el.dataset.h) * 3600000 - Date.now();
      if (left <= 0) { el.textContent = 'срок вышел'; el.className = 'timer timer--over'; return; }
      var hh = Math.floor(left / 3600000), mm = Math.floor(left % 3600000 / 60000), ss = Math.floor(left % 60000 / 1000);
      el.textContent = 'осталось ' + (hh >= 1 ? (hh + ' ч ' + String(mm).padStart(2, '0') + ' мин') : (mm + ':' + String(ss).padStart(2, '0')));
      if (left < 3600000) el.classList.add('timer--soon');
    });
  }, 1000);
});
</script>
