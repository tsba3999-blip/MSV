     списком, вкладками, шагами, картой, ползунком цены.

     ============================================================ */
  .page { padding-bottom: var(--msv-s48); }

  .chev { flex: 0 0 auto; color: var(--msv-n300); }
  .grid3 { display: grid; gap: var(--msv-s12); }

  /* 1 свободные места первым делом */
  .a1 .it { display: flex; align-items: center; gap: var(--msv-s12); padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r12); margin-bottom: var(--msv-s8); }

  .a2 .bar span { display: block; height: 100%; background: var(--msv-red); border-radius: 4px; }
  .a2 .it { padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r12); margin-bottom: var(--msv-s8); }

  .a3 .tabs button { flex: 1 1 0; height: 40px; font: 600 13px/1 var(--msv-font); color: var(--msv-graphite); background: var(--msv-white); border: 0; border-radius: var(--msv-r11); cursor: pointer; }
  .a3 .tabs button[aria-pressed="true"] { color: #fff; background: var(--msv-graphite); }
  .a3 .pane { padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); }
  /* 4 шаги */
  .a4 .step { display: flex; gap: var(--msv-s12); padding: var(--msv-s12) 0; }
  .a4 .n { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--msv-red); color: #fff; font: 700 14px/28px var(--msv-font); text-align: center; }
  /* 5 карта-схема */
  .a5 .map { position: relative; height: 200px; background: var(--msv-white); border-radius: var(--msv-r20); overflow: hidden; }
  .a5 .pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; font: 600 12px/14px var(--msv-font); color: var(--msv-graphite); text-decoration: none; }
  .a5 .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .a5 .ring { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 1px dashed var(--msv-n300); border-radius: 50%; }
  /* 6 таблица цен */

  /* 10 плитка-обложка */

  /* 11 строка-таблица */

  /* 12 метро крупно */

  .a12 .m { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; color: #fff; font: 700 15px/34px var(--msv-font); text-align: center; }
  .a12 .st { font: 600 20px/26px var(--msv-font); }
  /* 13 две колонки данных */
  .a13 .it { display: grid; grid-template-columns: 1fr 1fr; gap: 4px var(--msv-s12); padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r12); margin-bottom: var(--msv-s8); }
  .a13 .it .full { grid-column: 1 / -1; }
  .a13 .k { color: var(--msv-n500); font-size: 12px; }
  /* 14 лента */
  .a14 { display: flex; gap: var(--msv-s12); overflow-x: auto; margin: 0 calc(var(--msv-s24) * -1); padding: 0 var(--msv-s24) var(--msv-s8); scrollbar-width: none; }
  .a14::-webkit-scrollbar { display: none; }
  .a14 .it { flex: 0 0 240px; padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); }
  /* 15 чек-лист условий */
  .a15 .it { padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r12); margin-bottom: var(--msv-s8); }
  .a15 ul { margin: var(--msv-s8) 0 0; padding: 0; list-style: none; }
  .a15 li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 20px; color: var(--msv-n500); }
  .a15 li svg { flex: 0 0 auto; margin-top: 3px; color: #4A6B12; }
  /* 16 цена за место в месяц крупно */
  .a16 .it { display: flex; align-items: center; justify-content: space-between; gap: var(--msv-s12); padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r12); margin-bottom: var(--msv-s8); }
  .a16 .p { font: 700 24px/1 var(--msv-font); }
  .a16 .p small { display: block; font: 500 11px/14px var(--msv-font); color: var(--msv-n500); margin-top: 4px; }
  /* 17 сравнение парами */
  .a17 .pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--msv-s8); margin-bottom: var(--msv-s12); }
  .a17 .side { padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r12); }
  .a17 .win { outline: 2px solid var(--msv-lime); }
  /* 18 радио-выбор с итогом */
  .a18 .opt { display: flex; align-items: center; gap: var(--msv-s12); padding: var(--msv-s12) var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r12); margin-bottom: var(--msv-s8); cursor: pointer; }
  .a18 input { width: 20px; height: 20px; accent-color: var(--msv-red); }
  .a18 .sum { padding: var(--msv-s16); background: var(--msv-graphite); color: #fff; border-radius: var(--msv-r20); }
  /* 19 значок и одна строка */
  .a19 .it { display: flex; align-items: center; gap: var(--msv-s12); padding: var(--msv-s12) var(--msv-s16); background: var(--msv-white); border-radius: 999px; margin-bottom: var(--msv-s8); }
  /* 20 всё в одной карточке */
  .a20 .it { padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); margin-bottom: var(--msv-s12); }
  .a20 .row2 { display: flex; justify-content: space-between; gap: var(--msv-s12); margin-top: var(--msv-s8); padding-top: var(--msv-s8); border-top: 1px solid var(--msv-n100); }

      return '<div class="a10">' + R.map(function (r) {
        return '<a class="c it" href="' + href(r) + '" style="background:url(' + r.ban + ') center/cover"><span class="kind" style="color:rgba(255,255,255,.85)">' + esc(r.kind) + '</span><span class="msv-sub">' + esc(r.name) + '</span><span class="msv-note">метро ' + esc(r.metro) + ' · ' + esc(from(r)) + ' · ' + esc(freeText(r)) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Строки как в расписании', d: 'Три колонки: название, цена, свободно. Никаких карточек — плотный список.', f: function () {
      return '<div class="a11">' + R.map(function (r) {
        return '<a class="c it" href="' + href(r) + '"><span><span class="msv-body" style="font-weight:600">' + esc(r.name) + '</span><br><span class="msv-note" style="color:var(--msv-n500)">метро ' + esc(r.metro) + '</span></span><span class="price">' + esc(from(r)) + '</span><span class="free' + (free(r) === 0 ? ' free--none' : '') + '">' + esc(freeText(r)) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Метро крупно', d: 'Первое, что читает студент, — станция. Знак метро в цвете линии, название крупно.', f: function () {
      return '<div class="a12">' + R.map(function (r) {
        return '<a class="c it" href="' + href(r) + '"><span class="m" style="background:' + r.line + '">М</span><span style="flex:1 1 auto"><span class="st">' + esc(r.metro) + '</span><br><span class="msv-note" style="color:var(--msv-n500)">' + esc(r.name) + ' · ' + esc(from(r)) + '</span></span>' + CHEV + '</a>'; }).join('') + '</div>'; } },
    { t: 'Карточка данных', d: 'Как паспорт объекта: метро, адрес, комнаты, места, цена — парами «поле — значение».', f: function () {
      return '<div class="a13">' + R.map(function (r) {
        return '<a class="c it" href="' + href(r) + '"><span class="full msv-sub">' + esc(r.name) + '</span>' +
          '<span><span class="k">Метро</span><br>' + esc(r.metro) + '</span>' +
          '<span><span class="k">Цена</span><br>' + esc(from(r)) + '</span>' +
          '<span><span class="k">Комнат</span><br>' + r.rooms + '</span>' +
          '<span><span class="k">Свободно</span><br>' + esc(freeText(r)) + '</span>' +
          '<span class="full msv-note" style="color:var(--msv-n500)">' + esc(r.addr) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Лента вбок', d: 'Узкие карточки листаются пальцем — экономят высоту экрана, видно, что есть ещё.', f: function () {
      return '<div class="a14">' + R.map(function (r) {
        return '<a class="c it" href="' + href(r) + '"><img class="ava" src="' + r.ava + '" alt=""><span class="msv-sub" style="display:block;margin-top:8px">' + esc(r.name) + '</span><span class="msv-note" style="color:var(--msv-n500)">метро ' + esc(r.metro) + '</span><br><span class="price">' + esc(from(r)) + '</span><br><span class="free">' + esc(freeText(r)) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Что входит', d: 'Под каждой резиденцией три галочки — чем она отличается. Выбор по сути, а не по картинке.', f: function () {
      return '<div class="a15">' + R.map(function (r) {
        return '<a class="c it" href="' + href(r) + '"><span class="msv-sub">' + esc(r.name) + '</span> <span class="price" style="float:right">' + esc(from(r)) + '</span><ul>' + r.plus.map(function (p) { return '<li>' + TICK + esc(p) + '</li>'; }).join('') + '</ul></a>'; }).join('') + '</div>'; } },
    { t: 'Цена как главное число', d: 'Крупная цена справа, название слева. Для тех, кто считает бюджет на год вперёд.', f: function () {
      return '<div class="a16">' + R.map(function (r) {
        return '<a class="c it" href="' + href(r) + '"><span><span class="msv-body" style="font-weight:600;display:block">' + esc(r.name) + '</span><span class="msv-note" style="color:var(--msv-n500)">метро ' + esc(r.metro) + ' · ' + esc(freeText(r)) + '</span></span><span class="p">' + esc(from(r).replace('от ', '')) + '<small>в месяц</small></span></a>'; }).join('') + '</div>'; } },
    { t: 'Сравнение парами', d: 'Две резиденции рядом, дешёвая подсвечена. Третья — ниже. Помогает выбрать между похожими.', f: function () {
      var cheap = R.slice().sort(function (a, b) { return (PRICE[a.id] || 1e9) - (PRICE[b.id] || 1e9); })[0];
      return '<div class="a17"><div class="pair">' + R.slice(0, 2).map(function (r) {
        return '<a class="c side' + (r === cheap ? ' win' : '') + '" href="' + href(r) + '"><span class="msv-body" style="font-weight:600">' + esc(r.name) + '</span><br><span class="price">' + esc(from(r)) + '</span><br><span class="msv-note" style="color:var(--msv-n500)">метро ' + esc(r.metro) + '<br>' + esc(freeText(r)) + '</span></a>'; }).join('') + '</div>' +
        '<a class="c side" href="' + href(R[2]) + '" style="display:block"><span class="msv-body" style="font-weight:600">' + esc(R[2].name) + '</span> · <span class="price">' + esc(from(R[2])) + '</span> <span class="msv-note" style="color:var(--msv-n500)">— ' + esc(R[2].kind.toLowerCase()) + '</span></a></div>'; } },
    { t: 'Выбор с итогом', d: 'Переключатели и тёмная плашка внизу: сразу видно, что выбрал и сколько будет стоить.', f: function (id) {
      return '<div class="a18" data-sum="' + id + '">' + R.map(function (r, i) {
        return '<label class="opt"><input type="radio" name="' + id + '" value="' + i + '"' + (i === 0 ? ' checked' : '') + '><span style="flex:1 1 auto"><span class="msv-body" style="font-weight:600;display:block">' + esc(r.name) + '</span><span class="msv-note" style="color:var(--msv-n500)">метро ' + esc(r.metro) + ' · ' + esc(freeText(r)) + '</span></span><span class="price">' + esc(from(r)) + '</span></label>'; }).join('') +
        '<div class="sum"><span class="msv-note" style="color:#B7C3D0">Выбрано</span><br><span class="msv-sub" data-pick>' + esc(R[0].name) + '</span><br><span class="msv-body" data-cost>' + esc(from(R[0])) + ' в месяц</span></div></div>'; } },
    { t: 'Одна строка-капсула', d: 'Самый лёгкий вид: знак, название, цена в капсуле. Помещается на экране целиком.', f: function () {
      return '<div class="a19">' + R.map(function (r) {
        return '<a class="c it" href="' + href(r) + '"><img class="ava" src="' + r.ava + '" alt="" style="width:32px;height:32px"><span class="msv-body" style="flex:1 1 auto;font-weight:600">' + esc(r.name) + '</span><span class="price">' + esc(from(r)) + '</span>' + CHEV + '</a>'; }).join('') + '</div>'; } },
    { t: 'Всё в одной карточке', d: 'Баннер, тип, адрес, а снизу строка «свободно / цена». Самый подробный вид без кнопок.', f: function () {
      return '<div class="a20">' + R.map(function (r) {
        return '<a class="c it" href="' + href(r) + '"><img class="ban" src="' + r.ban + '" alt="' + esc(r.name) + '"><span class="kind" style="display:block;margin-top:8px">' + esc(r.kind) + '</span><span class="msv-sub">' + esc(r.name) + '</span><br><span class="msv-note" style="color:var(--msv-n500)">метро ' + esc(r.metro) + ' · ' + esc(r.addr) + '</span><span class="row2"><span class="free' + (free(r) === 0 ? ' free--none' : '') + '">' + esc(freeText(r)) + '</span><span class="price">' + esc(from(r)) + '</span></span></a>'; }).join('') + '</div>'; } }
  ];

  var grid = document.getElementById('grid');
  function draw() {
    grid.innerHTML = V.map(function (x, i) {
      return '<section class="v"><h2 class="msv-body v__t"><span class="v__num">' + (i + 1) + '</span>' + esc(x.t) + '</h2><p class="msv-note v__d">' + esc(x.d) + '</p>' + x.f('v' + (i + 1)) + '</section>';
    }).join('');
    grid.querySelectorAll('[data-tabs]').forEach(function (box) { pane(box, 0); });
  }
  function pane(box, i) {
    var r = R[i];
    box.querySelectorAll('.tabs button').forEach(function (b, j) { b.setAttribute('aria-pressed', String(j === i)); });
    box.querySelector('[data-pane]').innerHTML = '<img class="ban" src="' + r.ban + '" alt=""><p class="kind" style="margin:8px 0 0">' + esc(r.kind) + '</p><p class="msv-sub" style="margin:0 0 4px">' + esc(r.name) + '</p><p class="msv-body" style="margin:0 0 4px">метро ' + esc(r.metro) + ' · ' + esc(r.addr) + '</p><p class="msv-note" style="margin:0 0 12px;color:var(--msv-n500)">' + esc(freeText(r)) + ' · ' + esc(from(r)) + '</p><a class="msv-btn msv-btn--m msv-btn--primary" href="' + href(r) + '">Смотреть места</a>';
  }
  grid.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tabs] .tabs button');
    if (t) { pane(t.closest('[data-tabs]'), Number(t.dataset.i)); return; }
  });
  grid.addEventListener('change', function (e) {
    var i = e.target.closest('[data-sum] input'); if (!i) return;
    var box = i.closest('[data-sum]'), r = R[Number(i.value)];
    box.querySelector('[data-pick]').textContent = r.name;
    box.querySelector('[data-cost]').textContent = from(r) + ' в месяц';
  });
  draw();

  if (location.protocol !== 'file:') {
    fetch('/api/residences', { credentials: 'same-origin' }).then(function (r) { return r.status === 200 ? r.json() : null; }).then(function (list) {
      if (!list) return;
      var busyJobs = R.map(function (r) {
        return fetch('/api/occupancy?res=' + r.id, { credentials: 'same-origin' })
          .then(function (x) { return x.status === 200 ? x.json() : null; })
          .then(function (d) { return { id: r.id, busy: d ? d.busy.length : null }; })
          .catch(function () { return { id: r.id, busy: null }; });
      });
      list.forEach(function (res) {
        var m = null, n = 0;
        (res.beds || []).forEach(function (b) { n++; if (b.price > 0 && (m === null || b.price < m)) m = b.price; });
        PRICE[res.id] = m;
        var row = R.filter(function (x) { return x.id === res.id; })[0];
        if (row) row.beds = n || row.beds;
      });
      return Promise.all(busyJobs).then(function (arr) {
        arr.forEach(function (x) {
          var row = R.filter(function (r) { return r.id === x.id; })[0];
          if (row && x.busy !== null) FREE[x.id] = Math.max(0, row.beds - x.busy);
        });
        draw();
      });
    }).catch(function () {});
  }
})();
</script>
<script src="mark.js"></script>
<script src="protect.js"></script>

</body>
