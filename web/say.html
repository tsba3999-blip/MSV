<body>

<div class="page">

  <div class="head">
    <a class="head__back" href="menu.html" aria-label="Вернуться назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </a>
    <h1 class="msv-sub head__title"><a class="head__title-link" href="menu.html">Хочу сказать</a></h1>
  </div>

  <p class="msv-body" style="margin:0 0 var(--msv-s24);color:var(--msv-n500)">Идея, жалоба, благодарность — всё сюда. Прочитает куратор резиденции и ответит в уведомлениях.</p>

  <div class="pick" id="topics">
    <label class="pick__opt"><input class="pick__radio" type="radio" name="topic" value="Идея" checked><span><span class="pick__name">Идея</span><span class="msv-note">Что улучшить в резиденции</span></span></label>
    <label class="pick__opt"><input class="pick__radio" type="radio" name="topic" value="Жалоба"><span><span class="pick__name">Жалоба</span><span class="msv-note">Что-то мешает жить</span></span></label>
    <label class="pick__opt"><input class="pick__radio" type="radio" name="topic" value="Благодарность"><span><span class="pick__name">Благодарность</span><span class="msv-note">Кому-то стоит сказать спасибо</span></span></label>
    <label class="pick__opt"><input class="pick__radio" type="radio" name="topic" value="Другое"><span><span class="pick__name">Другое</span><span class="msv-note">Не подходит ничего из перечисленного</span></span></label>
  </div>

  <textarea class="msv-area" id="text" maxlength="1500" style="min-height:140px"
            placeholder="Например: в лаундже не хватает розеток у окна"></textarea>
  <span class="msv-note" style="display:block;margin-top:var(--msv-s4);text-align:right" id="count">0 из 1500</span>

  <label class="tog" style="display:flex;align-items:center;gap:var(--msv-s12);margin-top:var(--msv-s16);min-height:44px;cursor:pointer">
    <input type="checkbox" id="anon" style="width:20px;height:20px;accent-color:var(--msv-red)">
    <span class="msv-body">Отправить анонимно</span>
  </label>
  <p class="msv-note" style="margin-top:var(--msv-s4)">Анонимно — куратор не увидит, от кого. Но и ответить не сможет.</p>

  <div class="foot">
    <button class="msv-btn msv-btn--block msv-btn--primary" id="send" type="button" disabled>Отправить</button>
  </div>

  <div id="done" hidden style="text-align:center;padding:var(--msv-s48) 0">
    <h2 class="msv-h" style="margin:0 0 var(--msv-s12)">Принято</h2>
    <p class="msv-body" style="margin:0 0 var(--msv-s32);color:var(--msv-n500)">Куратор ответит в уведомлениях в течение трёх дней.</p>
    <a class="msv-btn msv-btn--block msv-btn--secondary" href="menu.html">В меню</a>
  </div>

</div>

    <span class="tab__cap">Заявки</span>
  </a>
  <a class="tab" href="documents.html" aria-label="Документы">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>

<script>
(function () {
  'use strict';
  var text = document.getElementById('text'), count = document.getElementById('count'), send = document.getElementById('send');
  text.addEventListener('input', function () { count.textContent = text.value.length + ' из 1500'; send.disabled = !text.value.trim(); });
  send.addEventListener('click', function () {
    var body = { topic: document.querySelector('input[name="topic"]:checked').value,
                 text: text.value.trim(), anonymous: document.getElementById('anon').checked };
    function ok() {
      Array.prototype.forEach.call(document.querySelectorAll('.page > *:not(.head):not(#done)'), function (el) { el.style.display = 'none'; });
      document.getElementById('done').hidden = false;
    }
    if (location.protocol === 'file:') { ok(); return; }
    send.disabled = true;
    fetch('/api/feedback', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (r.status === 201) ok(); else { send.disabled = false; alert('Не удалось отправить'); } })
      .catch(function () { send.disabled = false; alert('Сервер не отвечает'); });
  });
})();
</script>
