<style>
  /* Двадцать компоновок страницы «Выбери свою резиденцию» (22.09.2026).
     Одни и те же данные и картинки (баннер 415×116, круглый знак 500×500),
     разные раскладки. Цены «от …» берутся с сервера (/api/residences). */
  .page { padding-bottom: var(--msv-s48); }
  .v { padding: var(--msv-s16) 0 var(--msv-s32); border-bottom: 1px solid var(--msv-n100); }
  .v:last-child { border-bottom: 0; }
  .v__t { margin: 0 0 var(--msv-s4); font-size: 17px; line-height: 22px; padding-left: var(--msv-s16); }
  .v__d { margin: 0 0 var(--msv-s16); color: var(--msv-n500); padding-left: var(--msv-s16); }
  .v__num { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 6px; margin-right: var(--msv-s8); font-size: 13px; font-weight: 700; color: var(--msv-white); background: var(--msv-red); border-radius: 13px; vertical-align: middle; }
  a.c { color: inherit; text-decoration: none; }
  .kind { font-size: 10px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--msv-n500); }
  .price { font-weight: 700; white-space: nowrap; }
  .ava { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
  .ban { display: block; width: 100%; aspect-ratio: 415 / 116; object-fit: cover; border-radius: var(--msv-r11); }
  .chev { flex: 0 0 auto; color: var(--msv-n300); }

  /* 1 список строк */
  .l1 .row { align-items: center; }
  /* 2 открытки */
  .l2 { display: grid; gap: var(--msv-s12); }
  .l2 .card { display: flex; flex-direction: column; gap: 4px; padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); box-shadow: var(--msv-e1); }
  .l2 .ban { margin-bottom: var(--msv-s8); }
  @media (min-width: 768px) { .l2 { grid-template-columns: repeat(3, 1fr); } }
  /* 3 бенто */
  .l3 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--msv-s12); }
  .l3 .card { position: relative; display: flex; flex-direction: column; gap: 2px; min-height: 190px; padding: var(--msv-s16); background: color-mix(in srgb, var(--acc) 24%, var(--msv-white)); border-radius: var(--msv-r20); overflow: hidden; }
  .l3 .card:first-child { grid-column: 1 / -1; }
  .l3 .ban { max-width: 236px; margin-bottom: auto; box-shadow: var(--msv-e1); }
  .l3 .card:first-child .ban { max-width: 300px; }
  /* 4 карусель */
  .l4 { display: flex; gap: var(--msv-s12); overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(var(--msv-s24) * -1); padding: 4px var(--msv-s24) var(--msv-s12); scrollbar-width: none; }
  .l4::-webkit-scrollbar { display: none; }
  .l4 .card { flex: 0 0 78%; scroll-snap-align: start; display: flex; flex-direction: column; gap: 4px; padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); box-shadow: var(--msv-e1); }
  @media (min-width: 768px) { .l4 .card { flex-basis: 46%; } }
  /* 5 цветные плашки */
  .l5 { display: grid; gap: var(--msv-s12); }
  .l5 .card { display: flex; flex-direction: column; gap: 4px; min-height: 150px; padding: var(--msv-s20); color: var(--ink); background: var(--acc); border-radius: var(--msv-r20); }
  .l5 .kind, .l5 .msv-note { color: inherit; opacity: .8; }
  .l5 .ava { align-self: flex-end; margin-top: auto; width: 56px; height: 56px; border: 3px solid rgba(255,255,255,.7); }
  @media (min-width: 768px) { .l5 { grid-template-columns: repeat(3, 1fr); } }
  /* 6 таблица сравнения */
  .l6 { width: 100%; table-layout: fixed; border-collapse: collapse; overflow-wrap: anywhere; background: var(--msv-white); border-radius: var(--msv-r12); overflow: hidden; }
  .l6 th, .l6 td { padding: var(--msv-s12) 4px; text-align: center; font-size: 13px; line-height: 18px; border-bottom: 1px solid var(--msv-n100); vertical-align: top; }
  .l6 th { font-weight: 600; }
  .l6 td:first-child, .l6 th:first-child { text-align: left; color: var(--msv-n500); font-weight: 500; width: 20%; padding-left: var(--msv-s12); }
  .l6 .msv-btn--s { padding: 0 10px; }
  .l6 tr:last-child td { border-bottom: 0; }
  .l6 .ava { width: 44px; height: 44px; margin: 0 auto 4px; display: block; }
  /* 7 крупная типографика */
  .l7 .item { display: block; padding: var(--msv-s20) var(--msv-s16); border-top: 1px solid var(--msv-n300); }
  .l7 .item:last-child { border-bottom: 1px solid var(--msv-n300); }
  .l7 .name { display: block; font: 700 40px/44px var(--msv-font); letter-spacing: -.02em; color: var(--acc-ink, var(--msv-graphite)); }
  .l7 .meta { display: flex; justify-content: space-between; gap: var(--msv-s12); margin-top: var(--msv-s4); }
  /* 8 круглые знаки + раскрытие */
  .l8__row { display: flex; justify-content: space-around; gap: var(--msv-s8); }
  .l8__b { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 30%; font: 600 13px/16px var(--msv-font); color: var(--msv-graphite); background: none; border: 0; cursor: pointer; }
  .l8__b img { width: 76px; height: 76px; border-radius: 50%; border: 3px solid transparent; transition: transform .2s var(--msv-ease), border-color .2s; }
  .l8__b[aria-pressed="true"] img { border-color: var(--acc); transform: scale(1.06); }
  .l8__d { margin-top: var(--msv-s16); padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); box-shadow: var(--msv-e1); }

  .l9 summary::-webkit-details-marker { display: none; }
  .l9 .body { padding: 0 var(--msv-s16) var(--msv-s16); }
  /* 10 линия метро */
  .l10 { position: relative; padding-left: 34px; }
  .l10::before { content: ""; position: absolute; left: 11px; top: 12px; bottom: 12px; width: 4px; background: var(--msv-n300); border-radius: 2px; }
  .l10 .st { position: relative; display: block; padding: var(--msv-s8) 0 var(--msv-s20); }
  .l10 .st::before { content: ""; position: absolute; left: -30px; top: 12px; width: 18px; height: 18px; border-radius: 50%; background: var(--acc); border: 3px solid var(--msv-beige); box-shadow: 0 0 0 2px var(--acc); }
  .l10 .metro { font-weight: 700; }
  /* 11 две колонки */
  .l11 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--msv-s12); }
  .l11 .card { display: flex; flex-direction: column; gap: 4px; padding: var(--msv-s12); background: var(--msv-white); border-radius: var(--msv-r12); }
  .l11 .card:last-child { grid-column: 1 / -1; }
  .l11 .ava { width: 40px; height: 40px; }
  @media (min-width: 768px) { .l11 { grid-template-columns: repeat(3, 1fr); } .l11 .card:last-child { grid-column: auto; } }
  /* 12 нумерация */
  .l12 .item { display: grid; grid-template-columns: 56px 1fr auto; gap: var(--msv-s12); align-items: center; padding: var(--msv-s16) var(--msv-s16) var(--msv-s16) 0; border-bottom: 1px solid var(--msv-n100); }
  .l12 .n { font: 700 32px/1 var(--msv-font); color: var(--acc); text-align: right; }
  /* 13 афиша */
  .l13 .item { display: block; margin-bottom: var(--msv-s24); }
  .l13 .ban { border-radius: var(--msv-r20); box-shadow: var(--msv-e1); margin-bottom: var(--msv-s8); }
  .l13 .txt { padding: 0 var(--msv-s16); }
  @media (min-width: 768px) { .l13 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--msv-s16); } }
  /* 14 ценник */
  .l14 { display: grid; gap: var(--msv-s12); }
  .l14 .card { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--msv-s12); padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); border-left: 6px solid var(--acc); }
  .l14 .tag { grid-row: 1 / 4; align-self: center; padding: 6px 10px; font: 700 15px/1 var(--msv-font); color: var(--msv-graphite); background: var(--msv-lime); border-radius: 999px; white-space: nowrap; }
  /* 15 выбор + кнопка */
  .l15 .opt { display: flex; align-items: center; gap: var(--msv-s12); padding: var(--msv-s12) var(--msv-s16); background: var(--msv-white); border: 2px solid transparent; border-radius: var(--msv-r12); margin-bottom: var(--msv-s8); cursor: pointer; }
  .l15 .opt:has(input:checked) { border-color: var(--msv-red); }
  .l15 input { width: 20px; height: 20px; accent-color: var(--msv-red); }
  /* 16 корешки */
  .l16 { display: grid; gap: var(--msv-s12); }
  .l16 .card { display: grid; grid-template-columns: 44px 1fr; background: var(--msv-white); border-radius: var(--msv-r20); overflow: hidden; }
  .l16 .spine { display: flex; align-items: center; justify-content: center; background: var(--acc); color: var(--ink); font: 700 12px/1 var(--msv-font); letter-spacing: .12em; text-transform: uppercase; writing-mode: vertical-rl; transform: rotate(180deg); padding: var(--msv-s12) 0; }
  .l16 .body { padding: var(--msv-s16); display: flex; flex-direction: column; gap: 4px; }
  @media (min-width: 768px) { .l16 { grid-template-columns: repeat(3, 1fr); } }
  /* 17 стикеры */
  .l17 { display: grid; gap: var(--msv-s16); padding: var(--msv-s8) 4px; overflow-x: clip; }
  .l17 .card { display: flex; flex-direction: column; gap: 4px; padding: var(--msv-s16); background: var(--msv-white); border-radius: 6px; box-shadow: 0 6px 18px rgba(52,73,94,.12); transform: rotate(var(--rot)); }
  .l17 .pin { position: absolute; top: -8px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--acc); box-shadow: 0 2px 4px rgba(0,0,0,.25); }
  .l17 .card { position: relative; }
  @media (min-width: 768px) { .l17 { grid-template-columns: repeat(3, 1fr); } }
  /* 18 тёмные */
  .l18 { display: grid; gap: var(--msv-s12); }
  .l18 .card { display: flex; flex-direction: column; gap: 4px; padding: var(--msv-s20); color: #fff; background: var(--msv-graphite); border-radius: var(--msv-r20); border-top: 4px solid var(--acc); }
  .l18 .kind, .l18 .msv-note { color: #B7C3D0; }
  @media (min-width: 768px) { .l18 { grid-template-columns: repeat(3, 1fr); } }
  /* 19 станции */
  .l19 .item { display: flex; align-items: baseline; justify-content: space-between; gap: var(--msv-s12); padding: var(--msv-s16); border-bottom: 1px solid var(--msv-n100); }
  .l19 .metro { font: 700 22px/28px var(--msv-font); }
  .l19 .metro::before { content: "М"; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin-right: 8px; font-size: 13px; color: #fff; background: var(--acc); border-radius: 50%; vertical-align: 2px; }
  /* 20 главная + строки */
  .l20 .hero { display: flex; flex-direction: column; gap: 4px; padding: var(--msv-s20); margin-bottom: var(--msv-s12); background: color-mix(in srgb, var(--acc) 24%, var(--msv-white)); border-radius: var(--msv-r20); }
  .l20 .hero .ban { max-width: 300px; margin-bottom: var(--msv-s12); box-shadow: var(--msv-e1); }
</style>

  <div id="grid"></div>

</div>

<script>
(function () {
  'use strict';
  var R = [
    { id: 'forma', name: 'Forma', kind: 'Комфорт-резиденция', metro: 'Шаболовская', addr: 'Конный пер., 12', note: '16 комнат · 57 мест · свои санузлы в части комнат', rooms: 16, beds: 57, acc: '#FB344A', ink: '#fff', ban: 'logo-forma.jpg', ava: 'forma.png', map: 'https://yandex.ru/maps/-/CTtSY62w' },
    { id: 'uyut', name: 'Уют', kind: 'Эконом-резиденция', metro: 'Нагатинская', addr: 'Варшавское шоссе, 18к2', note: '16 комнат · 78 мест', rooms: 16, beds: 78, acc: '#7EB2DD', ink: '#fff', ban: 'logo-uyut.jpg', ava: 'uyt.gif', map: 'https://yandex.ru/maps/-/CTtSYE5l' },
    { id: 'molod', name: 'Молодежка', kind: 'Квартира для девушек', metro: 'Молодежная', addr: 'ул. Партизанская, 40', note: '3 комнаты · 6 мест · по двое', rooms: 3, beds: 6, acc: '#CBB6FF', ink: '#34495E', ban: 'logo-molod.jpg', ava: 'molodejka.png', map: 'https://yandex.ru/maps/-/CTtSaI6E' }
  ];
  var PRICE = { forma: null, uyut: null, molod: null };
  function money(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽'; }
  function from(r) { return PRICE[r.id] ? 'от ' + money(PRICE[r.id]) + '/мес' : ''; }
  function href(r) { return 'rooms.html?res=' + r.id; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  var CHEV = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  function style(r) { return ' style="--acc:' + r.acc + ';--ink:' + r.ink + '"'; }

  var V = [
    { t: 'Список строк', d: 'Как в меню: круглый знак, название, метро, стрелка. Самый компактный.', f: function () {
      return '<div class="rows l1">' + R.map(function (r) { return '<a class="row c" href="' + href(r) + '"><img class="ava" src="' + r.ava + '" alt=""><span class="row__text"><span class="row__name">' + esc(r.name) + '</span><span class="msv-note row__note">м. ' + esc(r.metro) + ' · ' + esc(r.note) + '</span></span><span class="row__end">' + CHEV + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Открытки', d: 'Белые карточки друг под другом: баннер сверху, текст снизу. На компьютере — три в ряд.', f: function () {
      return '<div class="l2">' + R.map(function (r) { return '<a class="card c" href="' + href(r) + '"><img class="ban" src="' + r.ban + '" alt=""><span class="kind">' + esc(r.kind) + '</span><span class="msv-sub">' + esc(r.name) + '</span><span class="msv-body">м. ' + esc(r.metro) + ' · ' + esc(r.addr) + '</span><span class="msv-note" style="color:var(--msv-n500)">' + esc(r.note) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Бенто (как сейчас)', d: 'Первая плитка во всю ширину, две — половинками. Для сравнения.', f: function () {
      return '<div class="l3">' + R.map(function (r) { return '<a class="card c" href="' + href(r) + '"' + style(r) + '><img class="ban" src="' + r.ban + '" alt=""><span class="kind" style="margin-top:12px">' + esc(r.kind) + '</span><span class="msv-h">' + esc(r.name) + '</span><span class="msv-body">м. ' + esc(r.metro) + ' · ' + esc(r.addr) + '</span><span class="msv-note">' + esc(r.note) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Карусель', d: 'Карточки листаются пальцем влево-вправо, с прилипанием. Видно, что есть ещё.', f: function () {
      return '<div class="l4">' + R.map(function (r) { return '<a class="card c" href="' + href(r) + '"><img class="ban" src="' + r.ban + '" alt=""><span class="kind" style="margin-top:8px">' + esc(r.kind) + '</span><span class="msv-sub">' + esc(r.name) + '</span><span class="msv-body">м. ' + esc(r.metro) + '</span><span class="msv-note" style="color:var(--msv-n500)">' + esc(r.note) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Цветные плашки', d: 'Каждая резиденция — сплошным своим цветом, текст белый, круглый знак в углу.', f: function () {
      return '<div class="l5">' + R.map(function (r) { return '<a class="card c" href="' + href(r) + '"' + style(r) + '><span class="kind">' + esc(r.kind) + '</span><span class="msv-h">' + esc(r.name) + '</span><span class="msv-body">м. ' + esc(r.metro) + ' · ' + esc(r.addr) + '</span><span class="msv-note">' + esc(r.note) + '</span><img class="ava" src="' + r.ava + '" alt=""></a>'; }).join('') + '</div>'; } },
    { t: 'Таблица сравнения', d: 'Три колонки, строки: тип, метро, комнаты, места, цена от, кнопка. Удобно сравнивать.', f: function () {
      var rows = [['', function (r) { return '<img class="ava" src="' + r.ava + '" alt=""><b>' + esc(r.name) + '</b>'; }], ['Тип', function (r) { return esc(r.kind); }], ['Метро', function (r) { return esc(r.metro); }], ['Комнат', function (r) { return r.rooms; }], ['Мест', function (r) { return r.beds; }], ['Цена', function (r) { return from(r) || '—'; }], ['', function (r) { return '<a class="msv-btn msv-btn--s msv-btn--secondary" href="' + href(r) + '">Выбрать</a>'; }]];
      return '<table class="l6">' + rows.map(function (row) { return '<tr><td>' + row[0] + '</td>' + R.map(function (r) { return '<td>' + row[1](r) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>'; } },
    { t: 'Крупная типографика', d: 'Без карточек: большое имя в цвете резиденции, метро и цена в строке под ним, линии между.', f: function () {

    { t: 'Три знака и раскрытие', d: 'Три круглых знака в ряд; нажатие показывает карточку выбранной резиденции под ними.', f: function (id) {
      return '<div class="l8"><div class="l8__row">' + R.map(function (r, i) { return '<button class="l8__b" type="button" data-pick="' + i + '" aria-pressed="' + (i === 0) + '"' + style(r) + '><img src="' + r.ava + '" alt="">' + esc(r.name.split(' ')[0]) + '</button>'; }).join('') + '</div><div class="l8__d" data-detail></div></div>'; } },
    { t: 'Аккордеон', d: 'Строка с названием; раскрывается баннер, адрес, описание и кнопка. Первая открыта.', f: function () {
      return '<div class="l9">' + R.map(function (r, i) { return '<details' + (i === 0 ? ' open' : '') + '><summary><img class="ava" src="' + r.ava + '" alt="" style="width:36px;height:36px"><span style="flex:1">' + esc(r.name) + '<span class="msv-note" style="display:block;color:var(--msv-n500);font-weight:400">м. ' + esc(r.metro) + '</span></span>' + CHEV + '</summary><div class="body"><img class="ban" src="' + r.ban + '" alt="" style="margin-bottom:12px"><p class="msv-body" style="margin:0 0 4px">' + esc(r.kind) + ' · ' + esc(r.addr) + '</p><p class="msv-note" style="margin:0 0 12px;color:var(--msv-n500)">' + esc(r.note) + '</p><a class="msv-btn msv-btn--m msv-btn--primary" href="' + href(r) + '">Смотреть места</a></div></details>'; }).join('') + '</div>'; } },
    { t: 'Линия метро', d: 'Вертикальная линия со «станциями» — три резиденции как остановки, точка в цвете резиденции.', f: function () {
      return '<div class="l10">' + R.map(function (r) { return '<a class="st c" href="' + href(r) + '"' + style(r) + '><span class="metro msv-body">м. ' + esc(r.metro) + '</span><span class="msv-sub" style="display:block">' + esc(r.name) + '</span><span class="msv-note" style="color:var(--msv-n500)">' + esc(r.kind) + ' · ' + esc(r.note) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Две колонки', d: 'Маленькие карточки в два столбца, третья — во всю ширину. На компьютере три в ряд.', f: function () {
      return '<div class="l11">' + R.map(function (r) { return '<a class="card c" href="' + href(r) + '"><img class="ava" src="' + r.ava + '" alt=""><span class="msv-body" style="font-weight:600">' + esc(r.name) + '</span><span class="msv-note" style="color:var(--msv-n500)">м. ' + esc(r.metro) + '</span><span class="msv-note">' + esc(r.note) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Нумерация', d: 'Крупные номера 01 02 03 в цвете резиденции, рядом имя и метро. Строго и просто.', f: function () {
      return '<div class="l12">' + R.map(function (r, i) { return '<a class="item c" href="' + href(r) + '"' + style(r) + '><span class="n">0' + (i + 1) + '</span><span><span class="msv-sub" style="display:block">' + esc(r.name) + '</span><span class="msv-note" style="color:var(--msv-n500)">м. ' + esc(r.metro) + ' · ' + esc(r.kind) + '</span></span>' + CHEV + '</a>'; }).join('') + '</div>'; } },
    { t: 'Афиша', d: 'Баннер-логотип во всю ширину как афиша, текст под ним прямо на фоне, без карточки.', f: function () {
      return '<div class="l13">' + R.map(function (r) { return '<a class="item c" href="' + href(r) + '"><img class="ban" src="' + r.ban + '" alt=""><span class="txt"><span class="msv-sub" style="display:block">' + esc(r.name) + '</span><span class="msv-note" style="color:var(--msv-n500)">м. ' + esc(r.metro) + ' · ' + esc(r.note) + '</span></span></a>'; }).join('') + '</div>'; } },
    { t: 'С ценником', d: 'Карточка с цветной кромкой слева и лаймовым ценником «от … ₽» справа (цена с сервера).', f: function () {
      return '<div class="l14">' + R.map(function (r) { return '<a class="card c" href="' + href(r) + '"' + style(r) + '><span class="msv-sub">' + esc(r.name) + '</span><span class="tag">' + (from(r) || 'цена уточняется') + '</span><span class="msv-body">м. ' + esc(r.metro) + ' · ' + esc(r.addr) + '</span><span class="msv-note" style="color:var(--msv-n500)">' + esc(r.note) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Выбор и кнопка', d: 'Переключатели с рамкой; выбрал — нажал «Дальше». Как в анкете, без прыжков по ссылкам.', f: function (id) {
      return '<div class="l15">' + R.map(function (r, i) { return '<label class="opt"><input type="radio" name="' + id + '" value="' + r.id + '"' + (i === 0 ? ' checked' : '') + '><img class="ava" src="' + r.ava + '" alt="" style="width:40px;height:40px"><span style="flex:1"><span class="msv-body" style="font-weight:600;display:block">' + esc(r.name) + '</span><span class="msv-note" style="color:var(--msv-n500)">м. ' + esc(r.metro) + ' · ' + esc(r.note) + '</span></span></label>'; }).join('') + '<div class="foot" style="padding-top:8px"><button class="msv-btn msv-btn--block msv-btn--primary" type="button" data-go="' + id + '">Дальше</button></div></div>'; } },
    { t: 'Корешки', d: 'Цветной вертикальный корешок с названием сбоку, как у книги; текст справа.', f: function () {
      return '<div class="l16">' + R.map(function (r) { return '<a class="card c" href="' + href(r) + '"' + style(r) + '><span class="spine">' + esc(r.name.split(' ')[0]) + '</span><span class="body"><span class="kind">' + esc(r.kind) + '</span><span class="msv-sub">' + esc(r.name) + '</span><span class="msv-body">м. ' + esc(r.metro) + ' · ' + esc(r.addr) + '</span><span class="msv-note" style="color:var(--msv-n500)">' + esc(r.note) + '</span></span></a>'; }).join('') + '</div>'; } },
    { t: 'Стикеры', d: 'Карточки чуть повёрнуты и «приколоты» цветной кнопкой — живо, по-студенчески.', f: function () {
      var rot = ['-1.5deg', '1.2deg', '-0.8deg'];
      return '<div class="l17">' + R.map(function (r, i) { return '<a class="card c" href="' + href(r) + '" style="--acc:' + r.acc + ';--rot:' + rot[i] + '"><span class="pin"></span><img class="ban" src="' + r.ban + '" alt=""><span class="msv-sub" style="margin-top:8px">' + esc(r.name) + '</span><span class="msv-body">м. ' + esc(r.metro) + '</span><span class="msv-note" style="color:var(--msv-n500)">' + esc(r.note) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Тёмные карточки', d: 'Графитовые карточки с цветной полосой сверху и белым текстом.', f: function () {
      return '<div class="l18">' + R.map(function (r) { return '<a class="card c" href="' + href(r) + '"' + style(r) + '><span class="kind">' + esc(r.kind) + '</span><span class="msv-h">' + esc(r.name) + '</span><span class="msv-body">м. ' + esc(r.metro) + ' · ' + esc(r.addr) + '</span><span class="msv-note">' + esc(r.note) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Станции', d: 'Главное — метро: крупно название станции со знаком «М» в цвете, имя резиденции мельче.', f: function () {
      return '<div class="l19">' + R.map(function (r) { return '<a class="item c" href="' + href(r) + '"' + style(r) + '><span><span class="metro">' + esc(r.metro) + '</span><span class="msv-note" style="display:block;margin-top:2px;color:var(--msv-n500)">' + esc(r.name) + ' · ' + esc(r.kind) + '</span></span><span class="msv-body price">' + from(r) + '</span></a>'; }).join('') + '</div>'; } },
    { t: 'Главная и строки', d: 'Forma — большой плиткой с баннером, две другие — строками списка под ней.', f: function () {
      var h = R[0], rest = R.slice(1);
      return '<div class="l20"><a class="hero c" href="' + href(h) + '"' + style(h) + '><img class="ban" src="' + h.ban + '" alt=""><span class="kind">' + esc(h.kind) + '</span><span class="msv-h">' + esc(h.name) + '</span><span class="msv-body">м. ' + esc(h.metro) + ' · ' + esc(h.addr) + '</span><span class="msv-note">' + esc(h.note) + '</span></a><div class="rows">' + rest.map(function (r) { return '<a class="row c" href="' + href(r) + '"><img class="ava" src="' + r.ava + '" alt="" style="width:40px;height:40px"><span class="row__text"><span class="row__name">' + esc(r.name) + '</span><span class="msv-note row__note">м. ' + esc(r.metro) + ' · ' + esc(r.note) + '</span></span><span class="row__end">' + CHEV + '</span></a>'; }).join('') + '</div></div>'; } }
  ];

  var grid = document.getElementById('grid');
  function draw() {
    grid.innerHTML = V.map(function (x, i) { return '<section class="v"><h2 class="msv-body v__t"><span class="v__num">' + (i + 1) + '</span>' + esc(x.t) + '</h2><p class="msv-note v__d">' + esc(x.d) + '</p>' + x.f('v' + (i + 1)) + '</section>'; }).join('');
    detail(0);
  }
  function detail(i) {
    var d = grid.querySelector('[data-detail]'); if (!d) return; var r = R[i];
    d.innerHTML = '<img class="ban" src="' + r.ban + '" alt="" style="margin-bottom:12px"><p class="kind" style="margin:0">' + esc(r.kind) + '</p><p class="msv-sub" style="margin:0 0 4px">' + esc(r.name) + '</p><p class="msv-body" style="margin:0 0 4px">м. ' + esc(r.metro) + ' · ' + esc(r.addr) + '</p><p class="msv-note" style="margin:0 0 12px;color:var(--msv-n500)">' + esc(r.note) + '</p><a class="msv-btn msv-btn--m msv-btn--primary" href="' + href(r) + '">Смотреть места</a>';
    grid.querySelectorAll('[data-pick]').forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.pick) === i)); });
  }
  grid.addEventListener('click', function (e) {
    var p = e.target.closest('[data-pick]'); if (p) { detail(Number(p.dataset.pick)); return; }
    var g = e.target.closest('[data-go]'); if (g) { var v = grid.querySelector('input[name="' + g.dataset.go + '"]:checked'); if (v) location.href = 'rooms.html?res=' + v.value; }
  });
  draw();

  /* цены «от …» — с сервера */
  if (location.protocol !== 'file:') fetch('/api/residences', { credentials: 'same-origin' }).then(function (r) { return r.status === 200 ? r.json() : null; }).then(function (list) {
    if (!list) return;
    list.forEach(function (res) { var m = null; (res.beds || []).forEach(function (b) { if (b.price > 0 && (m === null || b.price < m)) m = b.price; }); if (res.id in PRICE) PRICE[res.id] = m; });
    draw();
  }).catch(function () {});
})();
</script>
<script src="mark.js"></script>
<script src="protect.js"></script>

</body>
