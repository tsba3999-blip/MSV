<!doctype html>

<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon4.png" type="image/png">
<meta name="theme-color" content="#F5F1EA">
<title>Моя репутация — МСВ</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resident.css">
<style>
  /* ============================================================
     Индикатор репутации — утверждённый вариант (21.09.2026).
     Картинка заказчика (reputation-gauge.png) как есть, поверх —
     своя графитовая стрелка:
       · без белого: картинка обрезана по полукругу, середина и зазор
         между кольцом и полосой — бежевые, как страница;
       · белые прорези между цветами закрыты кусочками соседних секторов
         (градиент радиальный — шва нет), цвета сомкнуты;
       · в сером кольце прорези закрыты серым, между делениями — тонкие
         тёмные перегородки;
       · надписи в кольце — шрифт сайта, обычное начертание, строчными,
         ровно по середине кольца;
       · теней нет; жизни — сразу под ступицей;
       · балл — «электронными» цифрами, как на семисегментном табло.
     Геометрия картинки 1024×683: центр (512, 576), кольцо r 430–508,
     цветная полоса r 217–426, прорези на 36°, 72°, 108°, 144°.
     Родная стрелка (в координатах отражённой картинки 9°–25°) закрыта
     четырьмя кусочками того же сектора, углы подобраны по пикселям.
     ============================================================ */
  .page { padding-bottom: var(--msv-s48); }
  .gauge { display: block; width: 100%; margin: var(--msv-s8) 0 0; }
  .gauge svg { display: block; width: 100%; height: auto; overflow: visible; }
  .needle { transition: transform 1.5s cubic-bezier(.22, 1.2, .36, 1); }
  .needle--reset { transition: none !important; }
  .st { text-align: center; margin-top: var(--msv-s8); }
  .lcd { display: block; width: 120px; height: auto; margin: 0 auto; }
  .st__phrase { margin: var(--msv-s12) 0 0; font: 600 17px/22px var(--msv-font); color: var(--msv-graphite); }
  .st__note { margin: var(--msv-s8) 0 0; color: var(--msv-n500); }
  .again { display: inline-flex; align-items: center; height: var(--msv-btn-s); padding: 0 var(--msv-s16); margin-top: var(--msv-s16); font: 600 13px/1 var(--msv-font); color: var(--msv-graphite); background: var(--msv-white); border: 1px solid var(--msv-n100); border-radius: 999px; cursor: pointer; }
  .ctl { margin: var(--msv-s32) 0 0; padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); }
  .ctl__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--msv-s8) var(--msv-s16); margin-bottom: var(--msv-s8); }
  .ctl__row:last-child { margin-bottom: 0; }
  .ctl__l { font-size: 12px; color: var(--msv-n500); min-width: 150px; }
  .ctl input[type=range] { width: 160px; accent-color: var(--msv-red); }
  .ctl .chip { height: 32px; padding: 0 12px; font-size: 13px; }
  .ctl__val { display: inline-block; min-width: 26px; font-weight: 700; }
</style>
</head>
<body>

<div class="page">

  <div class="head">
    <a class="head__back" href="reputation.html" aria-label="Вернуться назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <span class="head__back-label">Вернуться</span></a>
    <h1 class="msv-sub head__title">Моя репутация</h1>
  </div>

  <div class="gauge" id="gauge"></div>

  <div class="st">
    <div id="lcd"></div>
    <p class="st__phrase" id="phrase"></p>
    <p class="msv-note st__note" id="livesNote"></p>
    <p class="msv-note st__note" id="disc"></p>
    <button class="again" type="button" id="again">Показать анимацию ещё раз</button>
  </div>

  <div class="ctl" aria-label="Проверка">
    <div class="ctl__row">
      <span class="ctl__l">Репутация <span class="ctl__val" id="vVal">+1</span></span>
      <input type="range" id="v" min="-2" max="2" step="1" value="1" aria-label="Репутация">
    </div>
    <div class="ctl__row">
      <span class="ctl__l">Жизни</span>
      <span role="group" aria-label="Жизни">
        <button class="chip" type="button" data-l="3" aria-pressed="false">3</button>
        <button class="chip" type="button" data-l="2" aria-pressed="true">2</button>
        <button class="chip" type="button" data-l="1" aria-pressed="false">1</button>
      </span>
    </div>
    <div class="ctl__row">
      <span class="ctl__l">Месяцев на максимуме <span class="ctl__val" id="mVal">2</span></span>
      <input type="range" id="m" min="0" max="6" step="1" value="2" aria-label="Месяцев на максимуме">
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var S = [
    { v: -2, word: 'Опасность', w: 'Опасность расторжения договора' },
    { v: -1, word: 'Внимание',  w: 'Нужно быть внимательным' },
    { v:  0, word: 'Старайся',  w: 'Нужно сделать что-то хорошее' },
    { v:  1, word: 'Хорошо',    w: 'У тебя хорошее будущее' },
    { v:  2, word: 'Отлично',   w: 'Ты на высоте — так держать!' }
  ];
  var HEART = 'M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z';
  var BG = '#F5F1EA', INK = '#34495E', RED = '#FB344A', GREY = '#E4E4E4', TXT = '#6B6B6B', DIV = '#1B1B1B';
  var state = { v: 1, lives: 2, months: 2 };

  var CX = 512, CY = 576;
  function pt(r, a) { var k = a * Math.PI / 180; return [CX + r * Math.cos(k), CY - r * Math.sin(k)]; }
  function f(n) { return Math.round(n * 100) / 100; }
  function ring(r1, r2, a1, a2) {
    var p1 = pt(r2, a1), p2 = pt(r2, a2), p3 = pt(r1, a2), p4 = pt(r1, a1);
    return 'M' + f(p1[0]) + ' ' + f(p1[1]) + ' A' + r2 + ' ' + r2 + ' 0 0 1 ' + f(p2[0]) + ' ' + f(p2[1]) +
      ' L' + f(p3[0]) + ' ' + f(p3[1]) + ' A' + r1 + ' ' + r1 + ' 0 0 0 ' + f(p4[0]) + ' ' + f(p4[1]) + ' Z';
  }
  function arc(r, a1, a2) { var p1 = pt(r, a1), p2 = pt(r, a2); return 'M' + f(p1[0]) + ' ' + f(p1[1]) + ' A' + r + ' ' + r + ' 0 0 1 ' + f(p2[0]) + ' ' + f(p2[1]); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function plural(n) { return n === 1 ? 'месяц' : n < 5 ? 'месяца' : 'месяцев'; }
  function img(rot) { return '<image href="reputation-gauge.png" x="0" y="0" width="1024" height="683"' + (rot ? ' transform="rotate(' + rot + ' ' + CX + ' ' + CY + ')"' : '') + '/>'; }

  function gauge() {
    var idx = state.v + 2;
    var ang = 180 - 36 * idx - 18, rot = 90 - ang;
    var s = ['<svg viewBox="0 0 1024 683" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Репутация ' + state.v + '">', '<defs>'];
    /* полукруг — всё белое снаружи отрезается */
    s.push('<clipPath id="half"><path d="M' + (CX - 508.5) + ' ' + (CY - 0.5) + ' A508.5 508.5 0 0 1 ' + (CX + 508.5) + ' ' + (CY - 0.5) + ' Z"/></clipPath>');
    /* кусочки, закрывающие родную стрелку (координаты отражённой картинки) */
    var P = [[214, 228.5, 13.5, 9.2, -4], [214, 228.5, 23.7, 13.2, 10.8], [225.5, 340, 15.8, 8.8, -5.5], [225.5, 340, 24.7, 15.4, 9.8]];
    /* кусочки, смыкающие цвета на прорезях 36°, 72°, 108°, 144°: с каждой стороны — своим цветом */
    [36, 72, 108, 144].forEach(function (b) { P.push([216, 427.5, b + 0.05, b - 1.4, -3]); P.push([216, 427.5, b + 1.4, b - 0.05, 3]); });
    P.forEach(function (p, i) { s.push('<clipPath id="c' + i + '"><path d="' + ring(p[0], p[1], p[2], p[3]) + '"/></clipPath>'); });
    s.push('</defs>');

    s.push('<g clip-path="url(#half)">');
    s.push('<g transform="matrix(-1 0 0 1 1024 0)">');   // отражение: красное слева, зелёное справа
    s.push(img(0));
    P.forEach(function (p, i) { s.push('<g clip-path="url(#c' + i + ')">' + img(p[4]) + '</g>'); });
    s.push('</g>');
    /* бежевое вместо белого: середина и зазор между кольцом и полосой */
    s.push('<circle cx="' + CX + '" cy="' + CY + '" r="218" fill="' + BG + '"/>');
    s.push('<path d="' + ring(425.5, 430.5, 180, 0.001) + '" fill="' + BG + '"/>');
    /* серое кольцо: прорези закрыты серым, между делениями — тонкие тёмные перегородки */
    [36, 72, 108, 144].forEach(function (b) {
      s.push('<path d="' + ring(430.5, 508, b + 1.3, b - 1.3) + '" fill="' + GREY + '"/>');
      s.push('<line x1="' + f(pt(430.5, b)[0]) + '" y1="' + f(pt(430.5, b)[1]) + '" x2="' + f(pt(508, b)[0]) + '" y2="' + f(pt(508, b)[1]) + '" stroke="' + DIV + '" stroke-width="2.5"/>');
    });
    s.push('</g>');

    /* надписи в кольце: английские закрыты серым, свои — шрифт сайта, обычное начертание, по середине кольца */
    S.forEach(function (x, i) {
      var a1 = 180 - 36 * i - 1.6, a2 = 144 - 36 * i + 1.6;
      s.push('<path d="' + ring(434, 504, a1, a2) + '" fill="' + GREY + '"/>');
      s.push('<path id="t' + i + '" d="' + arc(469, a1, a2) + '" fill="none"/>');
      s.push('<text font-size="28" fill="' + TXT + '" font-family="var(--msv-font)"><textPath href="#t' + i + '" startOffset="50%" text-anchor="middle" dominant-baseline="central">' + esc(x.word) + '</textPath></text>');
    });

    /* графитовая стрелка и ступица (ступица не вращается) */
    var len = 318;
    s.push('<g class="needle needle--reset" id="needle" data-rot="' + f(rot) + '" style="transform-origin:' + CX + 'px ' + CY + 'px;transform:rotate(-90deg)"><path d="M' + CX + ' ' + (CY - len) + ' L' + (CX - 12) + ' ' + (CY - 14) + ' L' + (CX + 12) + ' ' + (CY - 14) + ' Z" fill="' + INK + '"/></g>');
    s.push('<circle cx="' + CX + '" cy="' + CY + '" r="30" fill="' + BG + '" stroke="' + INK + '" stroke-width="4"/><circle cx="' + CX + '" cy="' + CY + '" r="10" fill="' + INK + '"/>');

    /* жизни — сразу под ступицей */
    for (var h = 0; h < 3; h++) {
      var x = CX - 44 + h * 44, y = CY + 62, al = h < state.lives;
      s.push('<g transform="translate(' + f(x - 18) + ' ' + f(y - 18) + ') scale(1.5)"><path d="' + HEART + '" fill="' + (al ? RED : 'none') + '" stroke="' + (al ? RED : '#B8B1A5') + '" stroke-width="2" stroke-linejoin="round"/></g>');
    }
    s.push('</svg>');
    return s.join('');
  }

  /* ---------- «электронные» цифры: семисегментное табло ----------
     Сегменты a (верх), b (верх-право), c (низ-право), d (низ), e (низ-лево), f (верх-лево), g (середина).
     Знак — отдельная ячейка: «−» = средняя полоса, «+» = полоса и вертикальная планка. */
  var SEG = {
    a: '4,2 36,2 32,8 8,8', b: '38,4 38,34 32,30 32,10', c: '38,38 38,68 32,62 32,42',
    d: '4,70 36,70 32,64 8,64', e: '2,38 8,42 8,62 2,68', f: '2,4 8,10 8,30 2,34', g: '5,36 9,32 31,32 35,36 31,40 9,40'
  };
  var DIG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
  function cell(dx, on, lit) {
    return Object.keys(SEG).map(function (k) {
      return '<polygon transform="translate(' + dx + ' 0)" points="' + SEG[k] + '" fill="' + (on.indexOf(k) >= 0 ? lit : 'rgba(52,73,94,.08)') + '"/>';
    }).join('');
  }
  function lcd(v) {
    var sign = v < 0 ? '−' : v > 0 ? '+' : '';
    var s = '<svg class="lcd" viewBox="-6 -6 100 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Балл ' + (sign + Math.abs(v)) + '">';
    s += '<g transform="skewX(-6)">';
    /* ячейка знака */
    s += '<polygon points="5,36 9,32 31,32 35,36 31,40 9,40" fill="' + (sign ? INK : 'rgba(52,73,94,.08)') + '"/>';
    s += '<polygon points="20,12 24,16 24,30 20,34 16,30 16,16" fill="' + (sign === '+' ? INK : 'rgba(52,73,94,.08)') + '"/>';
    s += '<polygon points="20,38 24,42 24,56 20,60 16,56 16,42" fill="' + (sign === '+' ? INK : 'rgba(52,73,94,.08)') + '"/>';
    /* цифра */
    s += cell(48, DIG[Math.abs(v)], INK);
    s += '</g></svg>';
    return s;
  }

  function build() {
    var cur = S[state.v + 2];
    document.getElementById('gauge').innerHTML = gauge();
    document.getElementById('lcd').innerHTML = lcd(state.v);
    document.getElementById('phrase').textContent = cur.w;
    document.getElementById('livesNote').textContent = state.lives === 3 ? 'Три жизни — все на месте' : state.lives === 2 ? 'Одна жизнь сгорела: нарушение отметил модератор' : 'Осталась последняя жизнь — следующее нарушение означает расторжение договора';
    var mm = state.months;
    document.getElementById('disc').textContent = mm >= 6 ? 'Скидка 5 % на проживание действует: полгода на максимуме' : 'До скидки 5 %: ещё ' + (6 - mm) + ' ' + plural(6 - mm) + ' на максимальной репутации';
    animate();
  }

  function animate() {
    var g = document.getElementById('needle');
    g.classList.add('needle--reset'); g.style.transform = 'rotate(-90deg)';
    void g.getBoundingClientRect();
    setTimeout(function () { g.classList.remove('needle--reset'); g.style.transform = 'rotate(' + g.dataset.rot + 'deg)'; }, 300);
  }

  document.getElementById('v').addEventListener('input', function () { state.v = Number(this.value); document.getElementById('vVal').textContent = (state.v > 0 ? '+' : '') + state.v; build(); });
  document.getElementById('m').addEventListener('input', function () { state.months = Number(this.value); document.getElementById('mVal').textContent = state.months; build(); });
  document.querySelectorAll('[data-l]').forEach(function (b) { b.addEventListener('click', function () { document.querySelectorAll('[data-l]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); state.lives = Number(b.dataset.l); build(); }); });
  document.getElementById('again').addEventListener('click', animate);
  build();
})();
</script>
<script src="mark.js"></script>
<script src="protect.js"></script>

</body>
</html>
