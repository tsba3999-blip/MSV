<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Моя репутация — МСВ</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resident.css">
<style>
  /* ============================================================
     Индикатор репутации — утверждённый рисунок (21.09.2026).
     Картинка заказчика (reputation-gauge.png) как есть, поверх —
     своя графитовая стрелка:
       · без белого: обрезка по кругу r 500, середина и уголки закрыты;
       · прорези между цветами и между кольцом и цветом закрыты,
         в кольце — тонкие тёмные перегородки;
       · надписи в кольце — шрифт сайта, строчными, по середине;
       · еле заметные значки в полях: треугольник «!», STOP, росток,
         звезда, кубок;
       · шкала баллов −30 … 0 … +50: риски по нижнему краю цвета,
         числа тем же кеглем, что слова в кольце;
       · «У вас осталось жизней:» и три сердца; сгоревшая — разбитое;
       · табло — два семисегментных разряда со знаком, следует за стрелкой;
       · стрелка: «нажали на газ» — до упора, «отпустили» — плавно к значению.
     ============================================================ */
  .page { padding-bottom: var(--msv-s48); }
  .gauge { display: block; width: 100%; }
  .gauge svg { display: block; width: 100%; height: auto; overflow: visible; }
  .needle { transition: transform 1.6s cubic-bezier(.25, .8, .25, 1); }
  .needle--gas { transition: transform .8s cubic-bezier(.45, 0, .55, 1); }
  .needle--reset { transition: none !important; }
  @keyframes smoke { 0% { transform: translateY(0) scale(1); opacity: .7; } 100% { transform: translateY(-9px) scale(1.2); opacity: 0; } }
  .smoke path { animation: smoke 2.4s ease-out infinite; transform-origin: 12px 4px; }
  .smoke path:nth-child(2) { animation-delay: .8s; }
  .smoke path:nth-child(3) { animation-delay: 1.6s; }
  .cracks__h { width: 100%; margin: var(--msv-s8) 0 0; padding-left: var(--msv-s8); font-size: 13px; font-weight: 600; color: var(--msv-graphite); }
  .st { text-align: center; }
  .lcd { display: block; width: 168px; height: auto; margin: 0 auto; }
  .st__phrase { margin: var(--msv-s12) 0 0; font: 600 17px/22px var(--msv-font); color: var(--msv-graphite); }
  .st__note { margin: var(--msv-s8) 0 0; color: var(--msv-n500); }
  .again { display: inline-flex; align-items: center; height: var(--msv-btn-s); padding: 0 var(--msv-s16); margin-top: var(--msv-s16); font: 600 13px/1 var(--msv-font); color: var(--msv-graphite); background: var(--msv-white); border: 1px solid var(--msv-n100); border-radius: 999px; cursor: pointer; }
  .ctl { position: sticky; top: 0; z-index: 2; margin: 0 calc(var(--msv-s24) * -1) var(--msv-s8); padding: var(--msv-s12) var(--msv-s24); background: color-mix(in srgb, var(--msv-beige) 92%, transparent); backdrop-filter: blur(6px); }
  .ctl__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--msv-s8) var(--msv-s16); }
  .ctl__l { font-size: 12px; color: var(--msv-n500); }
  .ctl input[type=range] { width: 200px; accent-color: var(--msv-red); }
  .ctl .chip { height: 32px; padding: 0 12px; font-size: 13px; }
  .ctl__val { display: inline-block; min-width: 32px; font-weight: 700; }
  /* варианты трещины */
  .cracks { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--msv-s16); margin-top: var(--msv-s24); padding: var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r20); }
  .crack { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 120px; font-size: 12px; color: var(--msv-n500); text-align: center; cursor: pointer; border: 0; background: none; font-family: var(--msv-font); }
  .crack svg { width: 72px; height: 72px; }
  .crack[aria-pressed="true"] { color: var(--msv-graphite); font-weight: 600; }
  .crack[aria-pressed="true"] svg { outline: 2px solid var(--msv-red); outline-offset: 4px; border-radius: 8px; }
</style>
</head>
<body>

<div class="page">

  <div class="head">
    <a class="head__back" href="reputation.html" aria-label="Вернуться назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <span class="head__back-label">Вернуться</span></a>
    <h1 class="msv-sub head__title">Моя репутация</h1>
  </div>

  <div class="ctl">
    <div class="ctl__row">
      <span class="ctl__l">Баллы <span class="ctl__val" id="vVal">+12</span></span>
      <input type="range" id="v" min="-30" max="50" step="1" value="12" aria-label="Баллы">
      <span class="ctl__l">Жизни</span>
      <span role="group" aria-label="Жизни">
        <button class="chip" type="button" data-l="3" aria-pressed="false">3</button>
        <button class="chip" type="button" data-l="2" aria-pressed="true">2</button>
        <button class="chip" type="button" data-l="1" aria-pressed="false">1</button>
      </span>
      <span class="ctl__l">Месяцев на максимуме <span class="ctl__val" id="mVal">2</span></span>
      <input type="range" id="m" min="0" max="6" step="1" value="2" aria-label="Месяцев на максимуме" style="width:120px">
    </div>
  </div>

  <div class="gauge" id="gauge"></div>

  <div class="st">
    <div class="lcdbox" id="lcdbox"></div>
    <p class="st__phrase" id="phrase"></p>
    <p class="msv-note st__note" id="livesNote"></p>
    <p class="msv-note st__note" id="disc"></p>
    <button class="again" type="button" id="again">Показать анимацию ещё раз</button>
  </div>

  <p class="msv-note" style="margin:var(--msv-s24) 0 0;padding-left:var(--msv-s16);color:var(--msv-n500)">Сгоревшая жизнь — выбери рисунок:</p>
  <div class="cracks" id="cracks"></div>

</div>

<script>
(function () {
  'use strict';

  var S = [
    { word: 'Опасность', w: 'Опасность расторжения договора' },
    { word: 'Внимание',  w: 'Нужно быть внимательным' },
    { word: 'Начало',    w: 'Нужно сделать что-то хорошее' },
    { word: 'Хорошо',    w: 'У тебя хорошее будущее' },
    { word: 'Отлично',   w: 'Ты на высоте — так держать!' }
  ];
  var HEART = 'M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z';
  var BG = '#F5F1EA', INK = '#34495E', RED = '#FB344A', GREY = '#E4E4E4', TXT = '#6B6B6B', DIV = '#1B1B1B', N500 = '#6B665E', N300 = '#B8B1A5';
  var state = { v: 12, lives: 2, months: 2, crack: 'bolt' };

  function angOf(v) { return v < 0 ? 90 + 90 * (-v / 30) : 90 - 90 * (v / 50); }
  function valOf(a) { return a > 90 ? -Math.round((a - 90) / 90 * 30) : Math.round((90 - a) / 90 * 50); }
  function sectorOf(v) { return Math.min(4, Math.max(0, Math.floor((180 - angOf(v)) / 36))); }

  /* значки-силуэты (сетка 24×24), еле заметные */
  var IC = {
    warn:   '<path d="M12 2.5L23 21.5H1z" class="f"/><path d="M12 9.5v6" class="cut" stroke-width="2.4"/><circle cx="12" cy="18.3" r="1.3" class="cutf"/>',
    stop:   '<path d="M8 2.5h8l5.5 5.5v8L16 21.5H8L2.5 16V8z" class="f"/><text x="12" y="14.1" font-size="5.4" font-weight="800" text-anchor="middle" stroke="none" class="cutt" font-family="var(--msv-font)">STOP</text>',
    sprout: '<path d="M12 21.5V11" class="ln" stroke-width="2.6"/><path d="M12 13.5c0-4.5-3.2-7.5-8-7.5 0 4.8 3 8 8 7.5z" class="f"/><path d="M12 11c0-4.5 3.2-7.5 8-7.5 0 4.8-3 8-8 7.5z" class="f"/><path d="M6 21.5h12" class="ln" stroke-width="2.6"/>',
    star:   '<path d="M12 2.5l2.9 6.1 6.7.9-4.9 4.6 1.3 6.7L12 17.6l-6 3.2 1.3-6.7L2.4 9.5l6.7-.9z" class="f"/>',
    cup:    '<path d="M5.5 3h13v5.5a6.5 6.5 0 0 1-13 0z" class="f"/><path d="M10.5 13.5h3V19h-3z" class="f"/><path d="M7.5 19h9v2.5h-9z" class="f"/><path d="M5.5 5.5H2.5v2.8a3.7 3.7 0 0 0 3.7 3.7" class="ln"/><path d="M18.5 5.5h3v2.8a3.7 3.7 0 0 1-3.7 3.7" class="ln"/>'
  };
  var ICONS = ['warn', 'stop', 'sprout', 'star', 'cup'];

  /* трещины — четыре рисунка */
  var CRACK = {
    line: { t: 'Ломаная',            d: 'M12 6.5l-2.2 4 3.2 3-2.6 3.6 1.6 3.9' },
    bolt: { t: 'Молния',             d: 'M13.2 6l-3.6 5.2 3 1.4-3.2 5.6' },
    chip: { t: 'С отколотым кусочком', d: 'M12 6.5l-1.6 3.2 2.6 2.4-2 3.2', chip: 'M14.2 8.6l3.6-1.2-.6 3.6z' },
    split: { t: 'Две половинки',      split: true },
    /* разбитые — ещё шесть */
    fork:   { t: 'Раздвоенная',        d: 'M12 6.5l-1.5 3.5 2.5 2.5-2 4 M13 12.5l2.5 2.5-1.5 3.5' },
    web:    { t: 'С ответвлениями',    d: 'M12 6.5l-2 4 3 3-2.5 4 1.5 3 M10 10.5l-2.5 1 M13 13.5l2.5-1.5 M10.5 17.5l-2 .5' },
    gap:    { t: 'Расколото пополам',  gap: true },
    shards: { t: 'Осколки',            d: 'M12 12l-1.5-5 M12 12l4-3.5 M12 12l-4 2.5 M12 12l1 6', chip: 'M15.5 8.2l3.2-1.3-.4 3.4z' },
    stitch: { t: 'Зашитое',            d: 'M12 6.5l-1.5 4 2.5 3-2 4 1 2.5', stitch: 'M9 9.5l3.5 1.2 M10.5 12.8l3.5-1 M9.5 15.6l3.5.8 M10 18.3l3.2-.4' },
    tip:    { t: 'Без кончика',        d: 'M12 6.5l-1.5 3.5 2.5 2.5-1.5 3', chip: 'M8.6 17.4L12 21.2l3.4-3.8-3.4 1.4z' },
    /* сгоревшие — шесть */
    ember:  { t: 'Уголь с искрами',    burnt: 'ember' },
    edge:   { t: 'Обгоревший край',    burnt: 'edge' },
    ash:    { t: 'Пепел',              burnt: 'ash' },
    smoke:  { t: 'С дымком',           burnt: 'smoke' },
    glow:   { t: 'Тлеющее',            burnt: 'glow' },
    lava:   { t: 'С огненными трещинами', burnt: 'lava' }
  };
  var DARK = '#3A3A3A', EMBER = '#FF7A00';
  var LOWER = 'M2.6 12.3q2.35 1.5 4.7 0t4.7 0 4.7 0 4.7 0L21.5 12C20 16 17 19 12 21 7 19 4 16 2.5 12z';   // нижняя половина сердца с волнистым краем
  function burntHeart(kind) {
    var base = '<path d="' + HEART + '" fill="' + DARK + '" stroke="' + DARK + '" stroke-width="1.6" stroke-linejoin="round"/>';
    switch (kind) {
      case 'ember': return base + '<circle cx="9" cy="14" r=".9" fill="' + EMBER + '"/><circle cx="13.5" cy="11" r=".7" fill="' + EMBER + '"/><circle cx="12" cy="16.5" r=".6" fill="' + EMBER + '"/><circle cx="15.5" cy="14.5" r=".5" fill="' + EMBER + '"/>';
      case 'edge':  return '<path d="' + HEART + '" fill="' + RED + '" stroke="' + RED + '" stroke-width="1.6" stroke-linejoin="round"/><path d="' + LOWER + '" fill="' + DARK + '"/><circle cx="8" cy="12.6" r=".55" fill="' + EMBER + '"/><circle cx="16.5" cy="12.4" r=".55" fill="' + EMBER + '"/>';
      case 'ash':   return '<path d="' + HEART + '" fill="#CFCAC0" stroke="#B8B1A5" stroke-width="1.4" stroke-dasharray="1.6 1.2" stroke-linejoin="round"/><circle cx="7" cy="22.5" r=".7" fill="#B8B1A5"/><circle cx="10.5" cy="23.2" r=".5" fill="#B8B1A5"/><circle cx="15" cy="22.8" r=".6" fill="#B8B1A5"/><circle cx="18" cy="21.6" r=".45" fill="#B8B1A5"/>';
      case 'smoke': return base + '<g class="smoke" fill="none" stroke="#9A958C" stroke-width="1.1" stroke-linecap="round"><path d="M9 5c-1.5-1.5 1.5-2.5 0-4"/><path d="M12.5 4c-1.5-1.5 1.5-2.5 0-4"/><path d="M16 5.5c-1.5-1.5 1.5-2.5 0-4"/></g>';
      case 'glow':  return base + '<path d="' + LOWER + '" fill="' + EMBER + '" opacity=".55"/><path d="M12 21c-2.4-1.2-4.2-2.6-5.6-4.2 1.9 1 3.7 1.5 5.6 1.5s3.7-.5 5.6-1.5c-1.4 1.6-3.2 3-5.6 4.2z" fill="#FFD93D" opacity=".7"/>';
      default:      return base + '<path d="M12 6.5l-2 4 3 3-2.5 4 1.5 3 M15 9l-1.5 3 2 2" fill="none" stroke="' + EMBER + '" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>';
    }
  }
  function lostHeart(kind, sc) {
    var c = CRACK[kind] || CRACK.bolt;
    if (c.burnt) return burntHeart(c.burnt);
    if (c.gap) {
      return '<g transform="translate(-1 0)"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6l-1.2 3.4 2 2.4-1.6 3 1.4 2.6-.6 3.6z" fill="' + N300 + '" stroke="' + N300 + '" stroke-width="1.4" stroke-linejoin="round"/></g>' +
             '<g transform="translate(1 0)"><path d="M12 21c2.5-1.6 7-4.5 9.5-9A5.5 5.5 0 0 0 12 6l-1.2 3.4 2 2.4-1.6 3 1.4 2.6-.6 3.6z" fill="' + N300 + '" stroke="' + N300 + '" stroke-width="1.4" stroke-linejoin="round"/></g>';
    }
    if (c.split) {
      return '<g transform="rotate(-6 6 14)"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6z" fill="' + N300 + '" stroke="' + N300 + '" stroke-width="1.6" stroke-linejoin="round"/></g>' +
             '<g transform="translate(1.6 0) rotate(6 18 14)"><path d="M12 21c2.5-1.6 7-4.5 9.5-9A5.5 5.5 0 0 0 12 6z" fill="' + N300 + '" stroke="' + N300 + '" stroke-width="1.6" stroke-linejoin="round"/></g>';
    }
    return '<path d="' + HEART + '" fill="' + N300 + '" stroke="' + N300 + '" stroke-width="2" stroke-linejoin="round"/>' +
      (c.chip ? '<path d="' + c.chip + '" fill="' + BG + '" stroke="none"/>' : '') +
      (c.stitch ? '<path d="' + c.stitch + '" fill="none" stroke="' + INK + '" stroke-width="1" stroke-linecap="round"/>' : '') +
      '<path d="' + c.d + '" fill="none" stroke="' + BG + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
  }

  var CX = 512, CY = 576;
  function pt(r, a) { var k = a * Math.PI / 180; return [CX + r * Math.cos(k), CY - r * Math.sin(k)]; }
  function f(n) { return Math.round(n * 100) / 100; }
  function ring(r1, r2, a1, a2) {
    var p1 = pt(r2, a1), p2 = pt(r2, a2), p3 = pt(r1, a2), p4 = pt(r1, a1);
    return 'M' + f(p1[0]) + ' ' + f(p1[1]) + ' A' + r2 + ' ' + r2 + ' 0 0 1 ' + f(p2[0]) + ' ' + f(p2[1]) +
      ' L' + f(p3[0]) + ' ' + f(p3[1]) + ' A' + r1 + ' ' + r1 + ' 0 0 0 ' + f(p4[0]) + ' ' + f(p4[1]) + ' Z';
  }
  function arc(r, a1, a2) { var p1 = pt(r, a1), p2 = pt(r, a2); return 'M' + f(p1[0]) + ' ' + f(p1[1]) + ' A' + r + ' ' + r + ' 0 0 1 ' + f(p2[0]) + ' ' + f(p2[1]); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function plural(n) { return n === 1 ? 'месяц' : n < 5 ? 'месяца' : 'месяцев'; }
  function img(rot) { return '<image href="reputation-gauge.png" x="0" y="0" width="1024" height="683"' + (rot ? ' transform="rotate(' + rot + ' ' + CX + ' ' + CY + ')"' : '') + '/>'; }
  function sign(v) { return v < 0 ? '−' : v > 0 ? '+' : ''; }

  function gauge() {
    var ang = angOf(state.v), rot = 90 - ang;
    var s = ['<svg viewBox="0 0 1024 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Репутация ' + state.v + '">', '<defs>'];
    s.push('<clipPath id="half"><path d="M' + (CX - 500.5) + ' ' + (CY - 0.5) + ' A500.5 500.5 0 0 1 ' + (CX + 500.5) + ' ' + (CY - 0.5) + ' Z"/></clipPath>');
    var P = [[214, 228.5, 13.5, 9.2, -4], [214, 228.5, 23.7, 13.2, 10.8], [225.5, 340, 15.8, 8.8, -5.5], [225.5, 340, 24.7, 15.4, 9.8]];
    [36, 72, 108, 144].forEach(function (b) { P.push([216, 427.5, b + 0.05, b - 1.4, -3]); P.push([216, 427.5, b + 1.4, b - 0.05, 3]); });
    [[3.3, 5.6, 3], [1.0, 3.4, 5.3], [-1, 1.1, 7.3]].forEach(function (q) { P.push([214, 252, q[1], q[0], q[2]]); P.push([214, 252, 180 - q[0], 180 - q[1], -q[2]]); });
    P.forEach(function (p, i) { s.push('<clipPath id="c' + i + '"><path d="' + ring(p[0], p[1], p[2], p[3]) + '"/></clipPath>'); });
    s.push('<style>.ic .f{fill:rgba(0,0,0,.055);stroke:none}.ic .cut{stroke:rgba(255,255,255,.16)}.ic .cutf{fill:rgba(255,255,255,.16);stroke:none}.ic .cutt{fill:rgba(255,255,255,.2)}.ic .ln{fill:none;stroke:rgba(0,0,0,.055);stroke-width:2;stroke-linecap:round}</style>');
    s.push('</defs>');

    s.push('<g clip-path="url(#half)">');
    s.push('<g transform="matrix(-1 0 0 1 1024 0)">');
    s.push(img(0));
    P.forEach(function (p, i) { s.push('<g clip-path="url(#c' + i + ')">' + img(p[4]) + '</g>'); });
    s.push('</g>');
    /* зазор между кольцом и цветом — закрыт серым: кольцо доходит до цвета */
    s.push('<path d="' + ring(425, 431, 180.5, -0.5) + '" fill="' + GREY + '"/>');
    [36, 72, 108, 144].forEach(function (b) {
      s.push('<path d="' + ring(425, 500, b + 1.3, b - 1.3) + '" fill="' + GREY + '"/>');
      s.push('<line x1="' + f(pt(425.5, b)[0]) + '" y1="' + f(pt(425.5, b)[1]) + '" x2="' + f(pt(500, b)[0]) + '" y2="' + f(pt(500, b)[1]) + '" stroke="' + DIV + '" stroke-width="2.5"/>');
    });
    s.push('<path d="' + ring(478, 500, 1.4, -0.5) + '" fill="' + GREY + '"/><path d="' + ring(478, 500, 180.5, 178.6) + '" fill="' + GREY + '"/>');
    s.push('</g>');
    s.push('<circle cx="' + CX + '" cy="' + CY + '" r="218" fill="' + BG + '"/>');
    s.push('<rect x="0" y="' + (CY + 0.5) + '" width="1024" height="8" fill="' + BG + '"/>');

    /* надписи в кольце */
    S.forEach(function (x, i) {
      var a1 = 180 - 36 * i - 1.6, a2 = 144 - 36 * i + 1.6;
      s.push('<path d="' + ring(434, 499, a1, a2) + '" fill="' + GREY + '"/>');
      s.push('<path id="t' + i + '" d="' + arc(465, a1, a2) + '" fill="none"/>');
      s.push('<text font-size="28" fill="' + TXT + '" font-family="var(--msv-font)"><textPath href="#t' + i + '" startOffset="50%" text-anchor="middle" dominant-baseline="central">' + esc(x.word) + '</textPath></text>');
    });

    /* значки */
    ICONS.forEach(function (k, i) {
      var p = pt(322, 162 - 36 * i), sc = 3.6;
      s.push('<g class="ic" transform="translate(' + f(p[0] - 12 * sc) + ' ' + f(p[1] - 12 * sc) + ') scale(' + sc + ')" fill="none" stroke="none">' + IC[k] + '</g>');
    });

    /* риски и числа — тем же кеглем, что слова в кольце */
    for (var u = -30; u <= 50; u++) {
      var a = angOf(u), big = u % 10 === 0, mid = u % 5 === 0;
      var r1 = big ? 198 : mid ? 204 : 209, p1 = pt(r1, a), p2 = pt(215, a);
      s.push('<line x1="' + f(p1[0]) + '" y1="' + f(p1[1]) + '" x2="' + f(p2[0]) + '" y2="' + f(p2[1]) + '" stroke="' + INK + '" stroke-width="' + (big ? 2 : 1.1) + '" opacity="' + (big ? .75 : .45) + '"/>');
      if (big) { var q = pt(176, a); s.push('<text x="' + f(q[0]) + '" y="' + f(q[1]) + '" font-size="28" fill="' + TXT + '" text-anchor="middle" dominant-baseline="central" font-family="var(--msv-font)">' + (u > 0 ? '+' : '') + u + '</text>'); }
    }

    /* стрелка и ступица */
    var len = 318;
    s.push('<g class="needle needle--reset" id="needle" data-rot="' + f(rot) + '" style="transform-origin:' + CX + 'px ' + CY + 'px;transform:rotate(-90deg)"><path d="M' + CX + ' ' + (CY - len) + ' L' + (CX - 12) + ' ' + (CY - 14) + ' L' + (CX + 12) + ' ' + (CY - 14) + ' Z" fill="' + INK + '"/></g>');
    s.push('<circle cx="' + CX + '" cy="' + CY + '" r="30" fill="' + BG + '" stroke="' + INK + '" stroke-width="4"/><circle cx="' + CX + '" cy="' + CY + '" r="10" fill="' + INK + '"/>');

    /* жизни */
    s.push('<text x="' + CX + '" y="' + (CY + 62) + '" font-size="26" fill="' + N500 + '" text-anchor="middle" dominant-baseline="central" font-family="var(--msv-font)">У вас осталось жизней:</text>');
    for (var h = 0; h < 3; h++) {
      var x = CX - 90 + h * 90, y = CY + 136, al = h < state.lives, k2 = 3;
      s.push('<g transform="translate(' + f(x - 12 * k2) + ' ' + f(y - 12 * k2) + ') scale(' + k2 + ')">');
      s.push(al ? '<path d="' + HEART + '" fill="' + RED + '" stroke="' + RED + '" stroke-width="2" stroke-linejoin="round"/>' : lostHeart(state.crack));
      s.push('</g>');
    }
    s.push('</svg>');
    return s.join('');
  }

  /* табло: знак и два разряда */
  var SEG = { a: '4,2 36,2 32,8 8,8', b: '38,4 38,34 32,30 32,10', c: '38,38 38,68 32,62 32,42', d: '4,70 36,70 32,64 8,64', e: '2,38 8,42 8,62 2,68', f: '2,4 8,10 8,30 2,34', g: '5,36 9,32 31,32 35,36 31,40 9,40' };
  var DIG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
  var OFF = 'rgba(52,73,94,.08)';
  function cellSvg(dx, on) { return Object.keys(SEG).map(function (k) { return '<polygon transform="translate(' + dx + ' 0)" points="' + SEG[k] + '" fill="' + (on.indexOf(k) >= 0 ? INK : OFF) + '"/>'; }).join(''); }
  function lcd(v) {
    var sg = sign(v), a = Math.abs(v), tens = Math.floor(a / 10), ones = a % 10;
    var s = '<svg class="lcd" viewBox="-6 -6 148 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Балл ' + sg + a + '"><g transform="skewX(-6)">';
    s += '<polygon points="5,36 9,32 31,32 35,36 31,40 9,40" fill="' + (sg ? INK : OFF) + '"/>';
    s += '<polygon points="20,12 24,16 24,30 20,34 16,30 16,16" fill="' + (sg === '+' ? INK : OFF) + '"/>';
    s += '<polygon points="20,38 24,42 24,56 20,60 16,56 16,42" fill="' + (sg === '+' ? INK : OFF) + '"/>';
    s += cellSvg(48, tens ? DIG[tens] : '') + cellSvg(96, DIG[ones]);
    return s + '</g></svg>';
  }

  function build() {
    var cur = S[sectorOf(state.v)], mm = state.months;
    document.getElementById('gauge').innerHTML = gauge();
    document.getElementById('phrase').textContent = cur.w;
    document.getElementById('livesNote').textContent = state.lives === 3 ? 'Три жизни — все на месте' : state.lives === 2 ? 'Одна жизнь сгорела: нарушение отметил модератор' : 'Осталась последняя жизнь — следующее нарушение означает расторжение договора';
    document.getElementById('disc').textContent = mm >= 6 ? 'Скидка 5 % на проживание действует: полгода на максимуме' : 'До скидки 5 %: ещё ' + (6 - mm) + ' ' + plural(6 - mm) + ' на максимальной репутации';
    var keys = Object.keys(CRACK);
    document.getElementById('cracks').innerHTML = keys.map(function (k, i) {
      var head = i === 0 ? '<p class="cracks__h">Разбитые — первые четыре</p>' : i === 4 ? '<p class="cracks__h">Разбитые — ещё шесть</p>' : i === 10 ? '<p class="cracks__h">Сгоревшие — шесть</p>' : '';
      return head + '<button class="crack" type="button" data-crack="' + k + '" aria-pressed="' + (state.crack === k) + '"><svg viewBox="0 0 24 24">' + lostHeart(k) + '</svg>' + esc(CRACK[k].t) + '</button>';
    }).join('');
    animate();
  }

  function animate() {
    var g = document.getElementById('needle'), box = document.getElementById('lcdbox'), rot = g.dataset.rot;
    g.classList.add('needle--reset'); g.classList.remove('needle--gas'); g.style.transform = 'rotate(-90deg)';
    box.innerHTML = lcd(-30);
    void g.getBoundingClientRect();
    var t0 = performance.now(), last = null, target = state.v;
    setTimeout(function () { g.classList.remove('needle--reset'); g.classList.add('needle--gas'); g.style.transform = 'rotate(90deg)'; }, 250);
    setTimeout(function () { g.classList.remove('needle--gas'); g.style.transform = 'rotate(' + rot + 'deg)'; }, 1200);
    setTimeout(function () { if (state.v === target) box.innerHTML = lcd(target); }, 3300);
    (function tick() {
      if (state.v !== target) return;
      var m = getComputedStyle(g).transform, a = -90;
      if (m && m !== 'none') { var q = m.match(/matrix\(([^)]+)\)/); if (q) { var c = q[1].split(',').map(Number); a = Math.atan2(c[1], c[0]) * 180 / Math.PI; } }
      var v = valOf(Math.max(0, Math.min(180, 90 - a)));
      if (v !== last) { last = v; box.innerHTML = lcd(v); }
      if (performance.now() - t0 < 3200) requestAnimationFrame(tick);
    })();
  }

  document.getElementById('v').addEventListener('input', function () { state.v = Number(this.value); document.getElementById('vVal').textContent = sign(state.v) + Math.abs(state.v); build(); });
  document.getElementById('m').addEventListener('input', function () { state.months = Number(this.value); document.getElementById('mVal').textContent = state.months; build(); });
  document.querySelectorAll('[data-l]').forEach(function (b) { b.addEventListener('click', function () { document.querySelectorAll('[data-l]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); state.lives = Number(b.dataset.l); build(); }); });
  document.getElementById('cracks').addEventListener('click', function (e) { var b = e.target.closest('[data-crack]'); if (b) { state.crack = b.dataset.crack; build(); } });
  document.getElementById('again').addEventListener('click', animate);
  build();
})();
</script>
<script src="mark.js"></script>
<script src="protect.js"></script>
