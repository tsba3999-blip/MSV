<head>
<meta charset="utf-8">

<style>
  .legend { margin: 0 0 var(--msv-s16); padding: var(--msv-s12) var(--msv-s16); background: var(--msv-white); border-radius: var(--msv-r12); }
  .legend__item { display: flex; align-items: center; gap: var(--msv-s12); padding: var(--msv-s4) 0; }
  .legend__item .note-card__mark { flex: 0 0 auto; }
  .bar { display: flex; flex-wrap: wrap; gap: var(--msv-s8); margin: 0 0 var(--msv-s16); padding-left: var(--msv-s16); }
  /* Статус уведомления: не прочитано — красная точка и жирный текст; прочитано — обычный;
     отправлено в мессенджер или на почту — значок «улетело» */
  .note-card { position: relative; }
  .note-card--new .note-card__text { font-weight: 600; }
  .note-card--new::before { content: ""; position: absolute; left: 6px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--msv-red); }
  .note-card__state { display: inline-flex; align-items: center; gap: 4px; margin-left: var(--msv-s8); color: var(--msv-n500); }
  .note-card__state svg { width: 14px; height: 14px; }

  #notice-list .note-card{display:block;background:var(--msv-white);padding:0;overflow:hidden;border:1px solid var(--msv-n100)}
  #notice-list .note-card--new{background:var(--msv-n100)}
  #notice-list .note-card::before{display:none}
  .notice-open{display:flex;align-items:flex-start;gap:var(--msv-s12);width:100%;padding:var(--msv-s16);border:0;background:none;color:var(--msv-graphite);font:inherit;text-align:left;cursor:pointer}
  .notice-open:focus-visible{outline:2px solid var(--msv-violet);outline-offset:-3px}
  .notice-dot{flex:0 0 8px;width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--msv-red)}
  .note-card:not(.note-card--new) .notice-dot{visibility:hidden}
  .notice-summary{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .notice-detail{margin:0;padding:0 var(--msv-s16) var(--msv-s16) 36px;white-space:pre-wrap;overflow-wrap:anywhere}
  .notice-open .note-card__text{overflow-wrap:anywhere}
  #notice-status{margin-bottom:var(--msv-s16)}.bar{padding-left:0}
</style>
</head>
<body>

<div class="page">

  <div class="head">
    <a class="head__back" href="menu.html" aria-label="Вернуться назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="msv-chevron">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    <span class="head__back-label form__back-label">Вернуться</span></a>
    <h1 class="msv-sub head__title">Уведомления</h1>
  </div>

  <!-- Расшифровка значков и статусов (решение заказчика 22.09.2026) -->
  <div class="legend">
    <div class="legend__item"><span class="note-card__mark note-card__mark--alarm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 22 20H2z"/><path d="M12 9v5"/><path d="M12 17h.01"/></svg></span><span class="msv-note">Важное: долг, пени, риск расторжения договора</span></div>
    <div class="legend__item"><span class="note-card__mark note-card__mark--pay"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12h5a3.5 3.5 0 0 0 0-7H9v14"/><path d="M7 15h7"/></svg></span><span class="msv-note">Оплата: сроки, чеки, напоминания</span></div>
    <div class="legend__item"><span class="note-card__mark note-card__mark--info"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg></span><span class="msv-note">Сообщение от модератора или куратора</span></div>
    <div class="legend__item"><span class="note-card__mark note-card__mark--ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8z"/></svg></span><span class="msv-note">Хорошее: события, репутация, скидки</span></div>
  </div>

  <div class="chips bar" id="bar" role="group" aria-label="Фильтр уведомлений">
    <button class="chip" type="button" data-f="" aria-pressed="true">Все</button>
    <button class="chip" type="button" data-f="new" aria-pressed="false">Непрочитанные</button>
    <button class="chip" type="button" data-f="read" aria-pressed="false">Прочитанные</button>

  </div>

  <p id="notice-status" class="msv-note" role="status">Загрузка…</p>
  <div id="notice-list"></div>

  <p class="msv-note" style="margin-top:var(--msv-s24)">Условия уведомлений можно поменять в разделе <a class="msv-link" href="settings.html">Настройки</a>.</p>

</div>
