<style>
  /* ============================================================
     Страница «Выбери свою резиденцию» — двадцать вариантов строго по
     брендбуку мобильного приложения (22.09.2026). Использованы только
     его элементы:
       · бенто: сетка 4 колонки, зазор 12, радиус 20, паддинг 16;
         2×2 на экране одна, цветных плиток не больше четырёх, один
         цвет — одна плитка, на цветной плитке тени нет, текст ≥ 13 px,
         белый подблок внутри цветной — только капсула главного действия;
       · карточка списка: радиус 12, паддинг 12, тень Elevation 1,
         высота от 72, зазор 12, миниатюра в маске 60 px;
       · бейдж 24 px, радиус 4, 11 px капс, трекинг +8 %, один на карточку;
       · чипы-фильтры 36 px капсула: выбранный графит/белый, остальные обводка 1,5 px N300;
       · кнопки-капсулы L 52 / M 44 / S 36, Primary на экране одна,
         во всю ширину — только Primary внизу;
       · шкала: заголовок 32/36 600, подзаголовок 20/26 600, текст 15/22,
         примечание 12/16 500 #6B665E, данные 14/18 400, подпись плитки 13/18 600;
       · декор: тёплый градиент #FFD93D→#FB344A и холодный #CBB6FF→#6E3BFF
         (180°, светлый сверху) — только обложки и плитки-заглушки;
         паттерн на красном: плашка 8, шаг 20, наклон 76°, белый 35 %;
         стикер — одна из девяти форм, цвет из палитры стикеров, поворот 0° или 14°,
         один на экран, как заглушка;
       · допустимые пары: графит+лайм, бежевый+красный, фиолетовый+белый,
         жёлтый+графит, лавандовый+графит, графит+ледяной; на красном и
         фиолетовом текст всегда белый.
     Планшет и веб: шкала ×1,25 от 768 px — здесь колонка сайта 640/720,

     ============================================================ */
  .page { padding-bottom: var(--msv-s48); }

  a.c { color: inherit; text-decoration: none; display: block; }

  /* шкала набора */
  .h1 { font: 600 32px/36px var(--msv-font); letter-spacing: -.015em; color: var(--msv-graphite); margin: 0; }
  .h2 { font: 600 20px/26px var(--msv-font); letter-spacing: -.005em; color: var(--msv-graphite); margin: 0; }
  .body { font: 400 15px/22px var(--msv-font); color: var(--msv-graphite); margin: 0; }
  .note { font: 500 12px/16px var(--msv-font); letter-spacing: .01em; color: var(--msv-n500); margin: 0; }
  .data { font: 400 14px/18px var(--msv-font); color: var(--msv-graphite); margin: 0; }
  .cap13 { font: 600 13px/18px var(--msv-font); }
  .label { font: 600 11px/16px var(--msv-font); letter-spacing: .08em; text-transform: uppercase; }
  .inv { color: #fff; } .inv .note, .inv .h1, .inv .h2, .inv .body, .inv .data { color: #fff; } .inv .note { opacity: .85; }

  /* бенто */
  .bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 88px; gap: 12px; }
  .tile { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 20px; background: var(--msv-white); box-shadow: var(--msv-e1); overflow: hidden; }
  .tile--c { box-shadow: none; }
  .t11 { grid-column: span 1; grid-row: span 1; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 12px 8px; }
  .t21 { grid-column: span 2; grid-row: span 1; justify-content: flex-end; }
  .t22 { grid-column: span 2; grid-row: span 2; justify-content: flex-end; }
  .t41 { grid-column: span 4; grid-row: span 1; justify-content: center; }
  .t42 { grid-column: span 4; grid-row: span 2; justify-content: flex-end; }
  .tile .label { margin-bottom: auto; }
  .tile .cap { display: block; margin-top: 8px; }
  .icon24 { width: 24px; height: 24px; }
  .thumb { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
  .cta { display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; height: 44px; padding: 0 20px; margin-top: 12px; font: 600 15px/1 var(--msv-font); color: var(--msv-graphite); background: var(--msv-white); border-radius: 22px; }
  .cta--s { height: 36px; padding: 0 16px; font-size: 13px; margin-top: 8px; }

  /* карточка списка */
  .list { display: grid; gap: 12px; }
  .card { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px; background: var(--msv-white); border-radius: 12px; box-shadow: var(--msv-e1); }
  .card__body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .card__end { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .chev { width: 16px; height: 16px; color: var(--msv-n300); flex: 0 0 auto; }
  .card--sel { outline: 2px solid var(--msv-violet); outline-offset: 2px; }

  /* бейджи */
  .badge { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; max-width: 96px; font: 600 11px/1 var(--msv-font); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; color: var(--msv-graphite); background: var(--msv-lime); border-radius: 4px; }
  .badge--lav { background: var(--msv-lavender); }
  .badge--yel { background: var(--msv-yellow); }
  .badge--n { background: var(--msv-n100); }

  /* чипы-фильтры */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 calc(var(--msv-s24) * -1) 16px; padding: 0 var(--msv-s24); scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .fchip { flex: 0 0 auto; height: 36px; padding: 0 16px; font: 600 13px/32px var(--msv-font); color: var(--msv-graphite); background: transparent; border: 1.5px solid var(--msv-n300); border-radius: 18px; white-space: nowrap; cursor: pointer; }
  .fchip[aria-pressed="true"] { color: #fff; background: var(--msv-graphite); border-color: var(--msv-graphite); }

  /* обложки и декор */
  .cover { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; min-height: 160px; padding: 16px; border-radius: 20px; margin-bottom: 24px; overflow: hidden; }
  .cover--warm { background: linear-gradient(180deg, #FFD93D 0%, #FB344A 100%); }
  .cover--cold { background: linear-gradient(180deg, #CBB6FF 0%, #6E3BFF 100%); }
  .cover--red { background: var(--msv-red); }
  .cover--red::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(76deg, rgba(255,255,255,.35) 0 8px, transparent 8px 20px); opacity: 1; pointer-events: none; }
  .cover--red > * { position: relative; }
  .sticker { display: flex; align-items: center; justify-content: center; }
  .sticker svg { width: 56px; height: 56px; }
  .rot14 { transform: rotate(14deg); }

  /* шапки */
  .hdr { margin-bottom: 24px; }
  .hdr .note { margin-top: 8px; }
  .sec { margin: 32px 0 12px; }
  .sec:first-child { margin-top: 0; }

  /* карусель */
  .car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(var(--msv-s24) * -1); padding: 4px var(--msv-s24) 12px; scrollbar-width: none; }
  .car::-webkit-scrollbar { display: none; }
  .car .tile { flex: 0 0 68%; min-height: 176px; scroll-snap-align: start; }

  /* выбор + Primary внизу */
  .primaryL { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; margin-top: 24px; font: 600 16px/1 var(--msv-font); color: #fff; background: var(--msv-red); border: 0; border-radius: 26px; cursor: pointer; }

  /* широкий экран */
  @media (min-width: 1100px) {
    .list--3 { grid-template-columns: repeat(3, 1fr); }
    .bento { grid-auto-rows: 104px; }
  }
</style>

<script>
(function () {
  'use strict';
  var R = [
    { id: 'forma', name: 'Forma', kind: 'Комфорт-резиденция', short: 'Комфорт', metro: 'Шаболовская', addr: 'Конный пер., 12', rooms: 16, beds: 57, note: 'свои санузлы в части комнат', ava: 'forma.png' },
    { id: 'uyut', name: 'Уют на Варшавке', kind: 'Эконом-резиденция', short: 'Эконом', metro: 'Нагатинская', addr: 'Варшавское шоссе, 18к2', rooms: 16, beds: 78, note: 'от двух до восьми мест в комнате', ava: 'uyt.gif' },
    { id: 'molod', name: 'Молодежка', kind: 'Квартира для девушек', short: 'Девушкам', metro: 'Молодежная', addr: 'ул. Партизанская, 40', rooms: 3, beds: 6, note: 'три двухместные комнаты', ava: 'molodejka.png' }
  ];
  var PRICE = { forma: null, uyut: null, molod: null };
  var C = { red: '#FB344A', graphite: '#34495E', lime: '#C8F03C', violet: '#6E3BFF', lav: '#CBB6FF', yellow: '#FFD93D', ice: '#A2D2FF', white: '#FFFFFF', n100: '#EAE4DA' };
  function money(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' руб.'; }
  function from(r) { return PRICE[r.id] ? 'от ' + money(PRICE[r.id]) : 'цена уточняется'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function href(r) { return 'rooms.html?res=' + r.id; }
  function places(r) { return r.beds + ' ' + (r.beds % 10 === 1 && r.beds % 100 !== 11 ? 'место' : (r.beds % 10 >= 2 && r.beds % 10 <= 4 && (r.beds % 100 < 10 || r.beds % 100 >= 20)) ? 'места' : 'мест'); }
  var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  var HOME = '<svg class="icon24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 10v10h12V10"/></svg>';
  var MAP = '<svg class="icon24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>';

  /* стикеры — формы из закрытой библиотеки */
  function sticker(form, color, rot) {
    var p = form === 'sparks' ? '<path d="M50 4c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z"/>'
      : form === 'daisy' ? '<g>' + [0, 45, 90, 135, 180, 225, 270, 315].map(function (a) { return '<ellipse cx="50" cy="22" rx="12" ry="20" transform="rotate(' + a + ' 50 50)"/>'; }).join('') + '<circle cx="50" cy="50" r="14"/></g>'
      : form === 'clover' ? '<g><circle cx="50" cy="28" r="20"/><circle cx="72" cy="50" r="20"/><circle cx="50" cy="72" r="20"/><circle cx="28" cy="50" r="20"/></g>'
      : '<path d="M50 5l9 22 22-9-9 22 22 9-22 9 9 22-22-9-9 22-9-22-22 9 9-22-22-9 22-9-9-22 22 9z"/>';   // звезда-цветок
    return '<span class="sticker' + (rot ? ' rot14' : '') + '" aria-hidden="true"><svg viewBox="0 0 100 100" fill="' + color + '">' + p + '</svg></span>';
  }

  /* карточка списка по брендбуку */
  function card(r, o) {
    o = o || {};
    var end = o.price ? '<span class="data">' + esc(from(r)) + '</span>' : '';
    if (o.badge) end += '<span class="badge' + (o.badge === 'lav' ? ' badge--lav' : o.badge === 'n' ? ' badge--n' : '') + '">' + esc(o.badgeText ? o.badgeText(r) : places(r)) + '</span>';
    if (o.btn) end += '<span class="cta cta--s" style="margin-top:0;background:var(--msv-beige)">Подробнее</span>';
    return '<' + (o.tag || 'a') + ' class="card c' + (o.sel ? ' card--sel' : '') + '"' + (o.tag ? '' : ' href="' + href(r) + '"') + (o.attrs || '') + '>' +
      (o.radio ? '<input type="radio" name="' + o.radio + '" value="' + r.id + '"' + (o.sel ? ' checked' : '') + ' style="width:20px;height:20px;accent-color:var(--msv-red);flex:0 0 auto">' : '') +
      (o.noThumb ? '' : '<img class="thumb" src="' + r.ava + '" alt="">') +
      '<span class="card__body"><span class="body" style="font-weight:500">' + esc(r.name) + '</span><span class="note">' + esc(o.line ? o.line(r) : 'метро ' + r.metro + ' · ' + r.kind) + '</span>' + (o.line2 ? '<span class="data">' + esc(o.line2(r)) + '</span>' : '') + '</span>' +
      (end ? '<span class="card__end">' + end + '</span>' : '') + (o.noChev ? '' : CHEV) + '</' + (o.tag || 'a') + '>';
  }
  /* плитки бенто */
  function tile(size, color, ink, inner, hrefTo) {
    var c = color ? ' tile--c' : '', st = color ? ' style="background:' + color + ';color:' + ink + '"' : '';
    var cls = 'tile ' + size + c + (ink === '#fff' ? ' inv' : '');
    return hrefTo ? '<a class="' + cls + '" href="' + hrefTo + '"' + st + '>' + inner + '</a>' : '<div class="' + cls + '"' + st + '>' + inner + '</div>';
  }
  function t22(r, color, ink) { return tile('t22', color, ink, '<span class="label">' + esc(r.kind) + '</span><span class="h1">' + esc(r.name) + '</span><span class="note">метро ' + esc(r.metro) + ' · ' + esc(places(r)) + '</span><span class="cta">Смотреть места</span>', href(r)); }
  function t21(r, color, ink, o) { o = o || {}; return tile('t21', color, ink, (o.thumb ? '<img class="thumb" src="' + r.ava + '" alt="" style="width:44px;height:44px;margin-bottom:auto">' : '<span class="label">' + esc(o.label || r.short) + '</span>') + '<span class="cap13">' + esc(r.name) + '</span><span class="note">' + esc(o.line ? o.line(r) : 'метро ' + r.metro) + '</span>', href(r)); }
  function t11(r, color, ink) { return tile('t11', color, ink, HOME + '<span class="cap13">' + esc(r.name.split(' ')[0]) + '</span>', href(r)); }
  function stickerTile(form, color, rot) { return tile('t21', null, null, '<span style="margin:auto">' + sticker(form, color, rot) + '</span>'); }
  function hdr(title, sub) { return '<div class="hdr"><p class="h1">' + esc(title) + '</p>' + (sub ? '<p class="note">' + esc(sub) + '</p>' : '') + '</div>'; }
  function list(o, cls) { return '<div class="list ' + (cls || 'list--3') + '">' + R.map(function (r) { return card(r, o); }).join('') + '</div>'; }

  var V = [
    { t: 'Бенто: 2×2 + две 2×1', d: 'Forma — красная плитка 2×2 с белой капсулой действия, две другие — 2×1 лавандовая и ледяная. Три цветных плитки, один цвет — одна плитка.', f: function () {
      return '<div class="bento">' + t22(R[0], C.red, '#fff') + t21(R[1], C.lav, C.graphite) + t21(R[2], C.ice, C.graphite) + '</div>'; } },
    { t: 'Три плитки 2×1 и стикер-заглушка', d: 'Три одинаковые нейтральные плитки 2×1 с лейблом и подписью; четвёртое место занимает стикер — так брендбук закрывает пустоту.', f: function () {
      return '<div class="bento">' + R.map(function (r) { return t21(r, null, null); }).join('') + stickerTile('star', '#FFAB37', true) + '</div>'; } },
    { t: 'Карточки списка', d: 'Ровно по спецификации: радиус 12, паддинг 12, миниатюра в круглой маске 60 px, шеврон 16 px.', f: function () { return list({}); } },
    { t: 'Список с ценой и бейджем мест', d: 'Справа — цена данными 14/18 и лаймовый бейдж «57 МЕСТ». Один бейдж на карточку.', f: function () { return list({ price: true, badge: true, noChev: true }); } },
    { t: 'Тёплая обложка + список', d: 'Обложка с тёплым градиентом (#FFD93D → #FB344A) и заголовком 32/36 белым, ниже карточки списка.', f: function () {
      return '<a class="cover cover--warm inv c" href="#"><span class="label">Выбери свою резиденцию</span><span class="h1">Где будешь жить</span><span class="note">три резиденции у метро</span></a>' + list({ price: true, noChev: true }); } },
    { t: 'Красная обложка с паттерном', d: 'Паттерн из наклонных плашек 76° на красном (не более 30 % экрана), текст белый; ниже нейтральные карточки.', f: function () {
      return '<div class="cover cover--red inv"><span class="h1">Резиденции</span><span class="note">Москва в студентов верит!</span></div>' + list({ badge: true, noChev: true }); } },
    { t: 'Четыре плитки 1×1', d: 'Иконка 24 px и подпись 13 px — ничего больше, как велит брендбук для 1×1. Три резиденции и «Карта» нейтральной плиткой.', f: function () {
      return '<div class="bento">' + t11(R[0], C.lime, C.graphite) + t11(R[1], C.lav, C.graphite) + t11(R[2], C.yellow, C.graphite) + tile('t11', null, null, MAP + '<span class="cap13">Карта</span>') + '</div><div style="margin-top:24px">' + list({ price: true, noChev: true }) + '</div>'; } },
    { t: 'Плитки 2×1 с фото в маске', d: 'Вариант 2×1 из брендбука: миниатюра в маске плюс два текстовых поля. Четвёртая плитка — стикер «ромашка».', f: function () {
      return '<div class="bento">' + R.map(function (r) { return t21(r, null, null, { thumb: true }); }).join('') + stickerTile('daisy', '#FFE558', false) + '</div>'; } },
    { t: 'Тёмная плитка + список', d: 'Forma — тёмная плитка 2×1 в графите с белым квадратом 44×44 (как «событие дня»), две другие — карточки списка.', f: function () {
      return '<div class="bento" style="margin-bottom:12px">' + tile('t41', C.graphite, '#fff', '<span style="display:flex;gap:12px;align-items:center"><img class="thumb" src="' + R[0].ava + '" alt="" style="width:44px;height:44px;border-radius:11px;background:#fff"><span><span class="cap13" style="display:block">' + esc(R[0].name) + ' · ' + esc(R[0].kind) + '</span><span class="note">метро ' + esc(R[0].metro) + ' · ' + esc(from(R[0])) + '</span></span></span>', href(R[0])) + '</div><div class="list">' + card(R[1], { price: true, noChev: true }) + card(R[2], { price: true, noChev: true }) + '</div>'; } },
    { t: 'Чипы-фильтры + список', d: 'Ряд чипов 36 px (выбранный — графит), под ним карточки; чип отбирает резиденции по типу.', f: function (id) {
      return '<div class="chips" data-filter="' + id + '"><button class="fchip" type="button" data-k="" aria-pressed="true">Все</button><button class="fchip" type="button" data-k="forma" aria-pressed="false">Комфорт</button><button class="fchip" type="button" data-k="uyut" aria-pressed="false">Эконом</button><button class="fchip" type="button" data-k="molod" aria-pressed="false">Девушкам</button></div><div class="list" data-list="' + id + '">' + R.map(function (r) { return card(r, { price: true, noChev: true, attrs: ' data-id="' + r.id + '"' }); }).join('') + '</div>'; } },
    { t: 'Шапка главной + лаймовое бенто', d: 'Шапка типа 1 («Привет, Артём» + примечание), Forma — лаймовая 2×2 с графитовым текстом, остальные — лавандовая и жёлтая 2×1.', f: function () {
      return hdr('Привет, Артём', 'выбери резиденцию — дальше покажем места') + '<div class="bento">' + t22(R[0], C.lime, C.graphite) + t21(R[1], C.lav, C.graphite) + t21(R[2], C.yellow, C.graphite) + '</div>'; } },
    { t: 'Холодная обложка + плитки', d: 'Обложка с холодным градиентом (#CBB6FF → #6E3BFF), под ней три нейтральные плитки 2×1 и стикер «искры».', f: function () {
      return '<div class="cover cover--cold inv"><span class="h1">Три резиденции</span><span class="note">у метро, с годовым контрактом</span></div><div class="bento">' + R.map(function (r) { return t21(r, null, null, { line: function (x) { return 'метро ' + x.metro + ' · ' + from(x); } }); }).join('') + stickerTile('sparks', '#567EDD', true) + '</div>'; } },
    { t: 'Список со статусом мест', d: 'Бейдж статуса на каждой карточке: «СВОБОДНО» лаймом, число мест — в примечании.', f: function () { return list({ badge: true, badgeText: function () { return 'Свободно'; }, line: function (r) { return 'метро ' + r.metro + ' · ' + places(r); } }); } },
    { t: 'Карусель плиток', d: 'Горизонтальная карусель навылет за боковое поле с внутренним паддингом 16 — как в брендбуке. Плитки нейтральные, с миниатюрой.', f: function () {
      return '<div class="car">' + R.map(function (r) { return tile('t21', null, null, '<img class="thumb" src="' + r.ava + '" alt="" style="margin-bottom:auto"><span class="label">' + esc(r.short) + '</span><span class="h2">' + esc(r.name) + '</span><span class="note">метро ' + esc(r.metro) + ' · ' + esc(from(r)) + '</span>', href(r)); }).join('') + '</div>'; } },
    { t: 'Плитки с данными', d: 'Нейтральные 2×1: лейбл сверху, строка данных снизу — «57 мест · от 27 280 руб.».', f: function () {
      return '<div class="bento">' + R.map(function (r) { return t21(r, null, null, { label: r.name, line: function (x) { return places(x) + ' · ' + from(x); } }); }).join('') + stickerTile('clover', '#D04D87', false) + '</div>'; } },
    { t: 'Секции по типу', d: 'Заголовок секции 32 над каждой резиденцией (отступ 32), под ним одна карточка списка.', f: function () {
      return R.map(function (r) { return '<p class="h2 sec">' + esc(r.kind) + '</p>' + card(r, { price: true, noChev: true }); }).join(''); } },
    { t: 'Карточки с кнопкой S', d: 'Secondary-кнопка S 36 px «Подробнее» в карточке; Primary на экране нет.', f: function () { return list({ btn: true, noChev: true, line: function (r) { return 'метро ' + r.metro + ' · ' + from(r); } }); } },
    { t: 'Заголовок экрана + список + стикер', d: 'Заголовок 32/36 «Где будешь жить», карточки, в конце экрана стикер-заглушка «звезда-цветок» под 14°.', f: function () {
      return hdr('Где будешь жить', 'три резиденции у метро · выбери — покажем места') + list({ price: true, noChev: true }) + '<div style="display:flex;justify-content:center;padding:24px 0 0">' + sticker('star', '#C84DD1', true) + '</div>'; } },
    { t: 'Чипы + одна плитка 2×2', d: 'Чипы выбирают резиденцию, лавандовая 2×2 показывает выбранную с капсулой действия; плитка одна.', f: function (id) {
      return '<div class="chips" data-pick="' + id + '">' + R.map(function (r, i) { return '<button class="fchip" type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(r.name.split(' ')[0]) + '</button>'; }).join('') + '</div><div class="bento" data-pickbox="' + id + '">' + t22(R[0], C.lav, C.graphite) + tile('t21', null, null, '<span class="label">Метро</span><span class="cap13" data-pm>' + esc(R[0].metro) + '</span>') + tile('t21', null, null, '<span class="label">Цена</span><span class="cap13" data-pp>' + esc(from(R[0])) + '</span>') + '</div>'; } },
    { t: 'Выбор и Primary L внизу', d: 'Карточки с переключателем, выбранная обведена фиолетовым (фокус 2 px); внизу единственная Primary L во всю ширину — по правилу брендбука.', f: function (id) {
      return '<div class="list" data-radio="' + id + '">' + R.map(function (r, i) { return card(r, { tag: 'label', radio: id, sel: i === 0, noChev: true, price: true }); }).join('') + '</div><button class="primaryL" type="button" data-go="' + id + '">Смотреть места</button>'; } }
  ];

  var grid = document.getElementById('grid');
  function draw() {
    grid.innerHTML = V.map(function (x, i) { return '<section class="v"><h2 class="msv-body v__t"><span class="v__num">' + (i + 1) + '</span>' + esc(x.t) + '</h2><p class="msv-note v__d">' + esc(x.d) + '</p>' + x.f('v' + (i + 1)) + '</section>'; }).join('');
  }
  grid.addEventListener('click', function (e) {
    var f = e.target.closest('[data-filter] .fchip');
    if (f) { var box = f.closest('[data-filter]'); box.querySelectorAll('.fchip').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); }); f.setAttribute('aria-pressed', 'true'); var k = f.dataset.k; grid.querySelectorAll('[data-list="' + box.dataset.filter + '"] .card').forEach(function (c) { c.style.display = !k || c.dataset.id === k ? '' : 'none'; }); return; }
    var p = e.target.closest('[data-pick] .fchip');
    if (p) { var pb = p.closest('[data-pick]'); pb.querySelectorAll('.fchip').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); }); p.setAttribute('aria-pressed', 'true'); var r = R[Number(p.dataset.i)]; var bx = grid.querySelector('[data-pickbox="' + pb.dataset.pick + '"]'); bx.querySelector('.t22').outerHTML = t22(r, C.lav, C.graphite); bx.querySelector('[data-pm]').textContent = r.metro; bx.querySelector('[data-pp]').textContent = from(r); return; }
    var g = e.target.closest('[data-go]');
    if (g) { var v = grid.querySelector('input[name="' + g.dataset.go + '"]:checked'); if (v) location.href = 'rooms.html?res=' + v.value; return; }
  });
  grid.addEventListener('change', function (e) {
    var i = e.target.closest('input[type="radio"]'); if (!i) return;
    var box = i.closest('[data-radio]'); box.querySelectorAll('.card').forEach(function (c) { c.classList.toggle('card--sel', c.querySelector('input').checked); });
  });
  draw();
  if (location.protocol !== 'file:') fetch('/api/residences', { credentials: 'same-origin' }).then(function (r) { return r.status === 200 ? r.json() : null; }).then(function (list) {
    if (!list) return;
    list.forEach(function (res) { var m = null; (res.beds || []).forEach(function (b) { if (b.price > 0 && (m === null || b.price < m)) m = b.price; }); if (res.id in PRICE) PRICE[res.id] = m; });
    draw();
  }).catch(function () {});
})();
</script>
<script src="mark.js"></script>
<script src="protect.js"></script>
