<script>
MSV.ready(function (ctx) {
  'use strict';

  var RES = ctx.residences;
  var today = (function () { var n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); })();
  var DAY = 86400000;

  function day(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function money(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009') + '\u2009руб.'; }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var notice = document.querySelector('.notice');
  if (notice && ctx.live) notice.textContent = 'Данные из базы. Цифры на сегодня.';

  var total = { beds: 0, busy: 0, debt: 0, debtPeople: 0, leaving: 0, minors: 0 };
  var rows = [];

  RES.forEach(function (res) {
    var d = ctx.bookings(res);
    var byId = {}; d.residents.forEach(function (r) { byId[r.id] = r; });
    var busy = 0, debt = 0, debtPeople = 0, leaving = 0, minors = 0;

    d.bookings.forEach(function (b) {
      var from = day(b.from), to = day(b.to);
      if (from === null || to === null) return;
      if (from <= today && to >= today) busy++;
      var owed = (b.accrued || 0) - (b.paid || 0);
      if (owed > 0.5) { debt += owed; debtPeople++; }
      if (to >= today && to - today <= 14 * DAY) leaving++;
      var r = byId[b.residentId];
      if (r && r.birthday) {
        var bd = day(r.birthday);
        if (bd !== null) {
          var t = new Date(today), x = new Date(bd);
          var age = t.getUTCFullYear() - x.getUTCFullYear();
          if (t.getUTCMonth() < x.getUTCMonth() || (t.getUTCMonth() === x.getUTCMonth() && t.getUTCDate() < x.getUTCDate())) age--;
          if (age < 18) minors++;
        }
      }
    });

    total.beds += res.beds.length; total.busy += busy; total.debt += debt;
    total.debtPeople += debtPeople; total.leaving += leaving; total.minors += minors;
    rows.push({ res: res, beds: res.beds.length, busy: busy });
  });

  var free = total.beds - total.busy;
  var load = total.beds ? Math.round(100 * total.busy / total.beds) : 0;

  document.getElementById('stats').innerHTML = [
    ['Занято мест', total.busy + ' из ' + total.beds, load + '% заполнено', ''],
    ['Свободно', String(free), 'можно заселять', ''],
    ['Долги', money(total.debt), total.debtPeople + ' чел. не внесли полную сумму', total.debt > 0 ? ' stat--debt' : ''],
    ['Выезжают за две недели', String(total.leaving), 'освободят места', ''],
    ['Несовершеннолетних', String(total.minors), 'нужно согласие родителей', '']
  ].map(function (x) {
    return '<div class="stat' + x[3] + '"><span class="stat__label">' + esc(x[0]) + '</span>' +
      '<span class="stat__value">' + esc(x[1]) + '</span>' +
      '<span class="msv-note stat__note">' + esc(x[2]) + '</span></div>';
  }).join('');

  document.getElementById('byRes').innerHTML = rows.map(function (x) {
    var pct = x.beds ? Math.round(100 * x.busy / x.beds) : 0;
    return '<a class="res-row" href="admin-shahmatka.html?res=' + encodeURIComponent(x.res.id) + '">' +
      '<img class="res-row__logo" src="' + esc(x.res.logo || '') + '" alt="">' +
      '<span class="res-row__body"><span class="res-row__name">' + esc(x.res.title) + '</span>' +
        '<span class="res-row__bar"><span class="res-row__fill" style="width:' + pct + '%"></span></span></span>' +
      '<span class="res-row__num"><b>' + x.busy + ' / ' + x.beds + '</b><span class="msv-note">' + pct + '%</span></span>' +
    '</a>';
  }).join('');
});
</script>
