<script>
/* Шапка меню: имя, инициалы и место — с сервера, как на главной.
   Без сервера остаётся образец из вёрстки. */
(function () {
  'use strict';
  if (location.protocol === 'file:') return;
  fetch('/api/me/home', { credentials: 'same-origin' })
    .then(function (r) { return r.status === 200 ? r.json() : null; })
    .then(function (d) {
      if (!d || !d.me) return;
      var name = d.me.name || '';
      var parts = name.split(/\s+/).filter(Boolean);
      // В базе «Фамилия Имя [Отчество]» — показываем «Имя Фамилия»
      var shown = parts.length >= 2 ? parts[1] + ' ' + parts[0] : name;
      var initials = parts.length >= 2 ? (parts[1].charAt(0) + parts[0].charAt(0)) : name.slice(0, 2);
      var nm = document.querySelector('.who__name'); if (nm) nm.textContent = shown;
      var face = document.querySelector('.who__face'); if (face) face.textContent = initials.toUpperCase();
      var pl = document.querySelector('.who__place');
      if (pl) pl.textContent = d.booking
        ? d.booking.residence + ' · ' + d.booking.room + ' · ' + (d.booking.tier ? d.booking.tier + ' место' : 'место')
        : 'место ещё не выбрано';
    })
    .catch(function () {});
})();
</script>
